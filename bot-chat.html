<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Lab – Luminous Studio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080810;--sidebar:#0d0d1a;--card:#13131f;--border:rgba(255,255,255,0.06);--text:#e2e8f0;--muted:#94a3b8;--accent:#a78bfa;--accent2:#7c3aed;--user-msg:linear-gradient(135deg,#7c3aed,#a78bfa)}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{display:flex;height:100vh}
/* SIDEBAR */
#sidebar{width:280px;min-width:280px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform 0.3s}
#sidebar-top{padding:16px;border-bottom:1px solid var(--border)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;text-decoration:none;transition:color 0.2s}
.back-link:hover{color:var(--accent)}
#sidebar-body{flex:1;overflow-y:auto;padding:20px 16px}
#sidebar-body::-webkit-scrollbar{width:4px}
#sidebar-body::-webkit-scrollbar-track{background:transparent}
#sidebar-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.bot-icon-lg{text-align:center;margin-bottom:12px}
  .icon-gradient{background:linear-gradient(135deg,#4d7cff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bot-name-lg{font-size:18px;font-weight:700;text-align:center;margin-bottom:6px}
.bot-cat-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(167,139,250,0.15);color:var(--accent);margin:0 auto 12px;display:block;width:fit-content;margin-left:auto;margin-right:auto}
.bot-desc-lg{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:24px}
.starters-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:10px}
.starter-pill{display:block;width:100%;text-align:left;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;cursor:pointer;margin-bottom:8px;transition:all 0.2s;line-height:1.4}
.starter-pill:hover{border-color:var(--accent);color:var(--accent);background:rgba(167,139,250,0.05)}
#sidebar-bottom{padding:16px;border-top:1px solid var(--border)}
.new-chat-btn{width:100%;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:13px;cursor:pointer;transition:all 0.2s}
.new-chat-btn:hover{border-color:var(--accent);color:var(--accent)}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#chat-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
#mobile-toggle{display:none;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
.chat-header-icon{font-size:24px}
.chat-header-name{font-weight:700;font-size:16px}
.chat-header-model{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
.model-dot{width:7px;height:7px;background:var(--accent);border-radius:50%}
#messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-track{background:transparent}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.msg{max-width:75%;display:flex;flex-direction:column;gap:4px;animation:msgIn 0.2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.bot{align-self:flex-start;align-items:flex-start}
.msg-bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6}
.msg.user .msg-bubble{background:var(--user-msg);color:#fff;border-bottom-right-radius:4px}
.msg.bot .msg-bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-bubble b{font-weight:700}
.msg-bubble code{background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px}
.msg-bubble pre{background:rgba(0,0,0,0.3);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.msg-bubble pre code{background:none;padding:0}
.msg-bubble ul,.msg-bubble ol{padding-left:20px;margin:6px 0}
.msg-bubble li{margin-bottom:4px}
.msg-time{font-size:11px;color:var(--muted);padding:0 4px}
.typing-indicator{display:flex;align-items:center;gap:5px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;align-self:flex-start}
.typing-dot{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:typingBounce 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes typingBounce{0%,80%,100%{transform:scale(0.8);opacity:0.5}40%{transform:scale(1.2);opacity:1}}
#empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--muted);text-align:center;padding:40px}
#empty-state .es-icon{font-size:56px;margin-bottom:8px;opacity:0.4}
#empty-state p{font-size:14px;max-width:280px;line-height:1.6}
#input-bar{padding:16px 24px;border-top:1px solid var(--border);background:var(--bg)}
.input-wrap{display:flex;align-items:flex-end;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 14px;transition:border-color 0.2s}
.input-wrap:focus-within{border-color:var(--accent)}
#user-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;resize:none;max-height:160px;line-height:1.5;font-family:inherit}
#user-input::placeholder{color:var(--muted)}
#send-btn{background:var(--accent2);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
#send-btn:hover{background:var(--accent);transform:scale(1.05)}
#send-btn:disabled{opacity:0.5;cursor:default;transform:none}
/* LOCKED */
#locked-overlay{position:absolute;inset:0;background:rgba(8,8,16,0.9);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:50}
.locked-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;text-align:center;max-width:360px}
.locked-icon{font-size:48px;margin-bottom:16px}
.locked-title{font-size:20px;font-weight:700;margin-bottom:8px}
.locked-desc{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.locked-btn{display:inline-block;padding:12px 28px;background:var(--accent2);color:#fff;text-decoration:none;border-radius:12px;font-weight:600;transition:background 0.2s}
.locked-btn:hover{background:var(--accent)}
/* MOBILE */
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #mobile-toggle{display:block}
  #main{position:relative}
  .msg{max-width:90%}
}
</style>
</head>

let currentBot=null, messages=[], isTyping=false, userId=null, groqKey=null, userPlan='free';

function getParam(name){return new URLSearchParams(location.search).get(name)}
function storageKey(id){return'bot_chat_'+id}
function saveMessages(){if(currentBot)localStorage.setItem(storageKey(currentBot.id),JSON.stringify(messages))}
function loadMessages(){if(!currentBot)return[];try{return JSON.parse(localStorage.getItem(storageKey(currentBot.id))||'[]')}catch{return[]}}

function md(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^### (.*?)$/gm,'<b style="font-size:15px">$1</b>')
    .replace(/^## (.*?)$/gm,'<b style="font-size:16px">$1</b>')
    .replace(/^# (.*?)$/gm,'<b style="font-size:17px">$1</b>')
    .replace(/^\* (.*?)$/gm,'<li>$1</li>')
    .replace(/^- (.*?)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>')
    .replace(/\n/g,'<br>');
}

function timeStr(){const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}

function renderMessages(){
  const el=document.getElementById('messages');
  if(messages.length===0){
    el.innerHTML=`<div id="empty-state"><div class="es-icon">${currentBot?chatBotIcon(currentBot.id,56):'<span class="material-symbols-outlined icon-gradient" style="font-size:56px;font-variation-settings:\'FILL\' 1">smart_toy</span>'}</div><p>Hola, soy <b>${currentBot?currentBot.name:'el bot'}</b>. ¿En qué puedo ayudarte hoy?</p></div>`;
    return;
  }
  el.innerHTML=messages.map(m=>`
    <div class="msg ${m.role==='user'?'user':'bot'}">
      <div class="msg-bubble">${md(m.content)}</div>
      <div class="msg-time">${m.time||''}</div>
    </div>
  `).join('');
  el.scrollTop=el.scrollHeight;
}

function showTyping(){
  const el=document.getElementById('messages');
  const d=document.createElement('div');
  d.id='typing-indicator';
  d.className='typing-indicator';
  d.innerHTML='<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  el.appendChild(d);
  el.scrollTop=el.scrollHeight;
}
function hideTyping(){const t=document.getElementById('typing-indicator');if(t)t.remove()}

async function sendMessage(text){
  const input=document.getElementById('user-input');
  const msg=(text||input.value).trim();
  if(!msg||isTyping)return;
  input.value='';
  input.style.height='auto';
  messages.push({role:'user',content:msg,time:timeStr()});
  saveMessages();
  renderMessages();
  isTyping=true;
  document.getElementById('send-btn').disabled=true;
  showTyping();
  try{
    const reply=await callAI(msg);
    hideTyping();
    messages.push({role:'assistant',content:reply,time:timeStr()});
    saveMessages();
    renderMessages();
  }catch(e){
    hideTyping();
    messages.push({role:'assistant',content:'Lo siento, hubo un error al procesar tu mensaje. Por favor intenta de nuevo.',time:timeStr()});
    renderMessages();
    console.error(e);
  }
  isTyping=false;
  document.getElementById('send-btn').disabled=false;
}

async function callAI(userMsg){
  const systemPrompt=BOT_PROMPTS[currentBot.id]||'Eres un asistente útil. Responde en español.';
  const history=messages.slice(-10).map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}));
  if(groqKey){
    try{
      const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':'Bearer '+groqKey,'Content-Type':'application/json'},
        body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:systemPrompt},...history],max_tokens:2048,temperature:0.7})
      });
      if(r.ok){const d=await r.json();return d.choices[0].message.content}
    }catch(e){console.warn('Groq failed, trying proxy',e)}
  }
  const token=await Auth.getToken();
  const r=await fetch(SUPABASE_URL+'/functions/v1/claude-proxy',{
    method:'POST',
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({messages:[{role:'system',content:systemPrompt},...history],max_tokens:2048})
  });
  if(!r.ok)throw new Error('AI request failed: '+r.status);
  const d=await r.json();
  return d.content||d.choices?.[0]?.message?.content||'Sin respuesta';
}

function newChat(){
  messages=[];
  saveMessages();
  renderMessages();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}

async function init(){
  const user=await Auth.requireAuth();
  if(!user)return;
  userId=user.id;
  try{
    const {data}=await db.from('profiles').select('plan,groq_api_key').eq('id',userId).single();
    userPlan=data?.plan||'free';
    groqKey=data?.groq_api_key||null;
  }catch(e){console.warn(e)}
  const botId=getParam('bot');
  currentBot=BOTS.find(b=>b.id===botId)||BOTS[0];
  document.getElementById('sb-icon').innerHTML=chatBotIcon(currentBot.id,48);
  document.getElementById('sb-name').textContent=currentBot.name;
  document.getElementById('sb-cat').textContent=currentBot.category;
  document.getElementById('sb-desc').textContent=currentBot.desc;
  document.getElementById('hdr-icon').innerHTML=chatBotIcon(currentBot.id,24);
  document.getElementById('hdr-name').textContent=currentBot.name;
  document.title=currentBot.name+' – Luminous Studio';
  const starters=BOT_STARTERS[currentBot.id]||[];
  document.getElementById('starters-list').innerHTML=starters.map(s=>`<button class="starter-pill" onclick="sendMessage('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('');
  if(currentBot.plan==='pro'&&userPlan==='free'){
    document.getElementById('locked-overlay').style.display='flex';
  }
  messages=loadMessages();
  renderMessages();
  const input=document.getElementById('user-input');
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});
}
init();
</script>
