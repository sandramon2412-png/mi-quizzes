<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mini-App | Luminous Studio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="./app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#2E5BFF", "primary-dim": "#3867fb", "secondary": "#69f6b8",
          "surface": "#0e0e0e", "surface-container-low": "#131313",
          "surface-container": "#1a1a1a", "surface-container-high": "#20201f",
          "surface-container-highest": "#262626", "on-surface": "#ffffff",
          "on-surface-variant": "#adaaaa", "outline-variant": "#484847",
          "error": "#ff6e84",
        },
        fontFamily: { "sans": ["Plus Jakarta Sans"] },
        borderRadius: { "DEFAULT": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
      },
    },
  }
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .fade-in { animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .check-item input:checked ~ label { text-decoration: line-through; opacity: .5; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen">

<!-- ACCESS SCREEN -->
<div id="screen-access" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm text-center fade-in">
    <div id="access-icon" class="text-6xl mb-4">⚡</div>
    <h1 id="access-title" class="text-2xl font-extrabold tracking-tight mb-2">Mini-App</h1>
    <p id="access-desc" class="text-on-surface-variant text-sm mb-8">Cargando...</p>

    <div id="access-code-section" class="hidden">
      <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-3">Código de acceso</label>
      <input id="access-code-input" type="text" placeholder="Ingresa tu código..."
        class="w-full bg-surface-container border border-outline-variant/30 rounded-xl px-4 py-3 text-center text-sm font-bold focus:ring-2 focus:ring-primary outline-none transition mb-3"/>
      <button onclick="validateAccess()"
        class="w-full py-3 bg-primary text-white font-extrabold rounded-xl hover:opacity-90 transition-opacity">
        Ingresar
      </button>
      <p id="access-error" class="text-error text-xs mt-2 hidden">Código incorrecto. Verifica con quien te compartió el acceso.</p>
    </div>

    <div id="access-free-btn" class="hidden">
      <button onclick="enterApp()"
        class="w-full py-3 bg-primary text-white font-extrabold rounded-xl hover:opacity-90 transition-opacity">
        Abrir Mini-App
      </button>
    </div>

    <a href="./dashboard.html" class="block mt-6 text-xs text-on-surface-variant hover:text-primary transition-colors">
      ← Volver al dashboard
    </a>
  </div>
</div>

<!-- APP SCREEN -->
<div id="screen-app" class="hidden min-h-screen">
  <!-- Header -->
  <header class="flex items-center gap-3 px-5 py-4 border-b border-white/5 bg-surface-container-low sticky top-0 z-10">
    <div id="app-icon-header" class="text-2xl w-10 h-10 flex items-center justify-center">⚡</div>
    <div class="flex-1 min-w-0">
      <h1 id="app-title-header" class="font-extrabold text-base truncate">Mini-App</h1>
      <p id="app-type-header" class="text-xs text-on-surface-variant">Aplicación interactiva</p>
    </div>
    <a href="./dashboard.html" class="w-8 h-8 rounded-xl bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-sm">home</span>
    </a>
  </header>

  <!-- Dynamic content -->
  <div id="app-content" class="px-4 py-6 max-w-lg mx-auto">
    <!-- populated by renderApp() -->
  </div>
</div>

<script>
let currentApp = null;

document.addEventListener('DOMContentLoaded', () => {
  const id = getParam('id');
  if (!id) { showError('No se especificó una mini-app.'); return; }
  const app = MiniApps.get(id);
  if (!app) { showError('Mini-App no encontrada. Verifica el enlace.'); return; }

  currentApp = app;

  // Fill access screen
  document.getElementById('access-icon').textContent = app.icon || '⚡';
  document.getElementById('access-title').textContent = app.name;
  document.getElementById('access-desc').textContent = app.description || (app.niche ? `Nicho: ${app.niche}` : 'Aplicación interactiva');

  if (app.accessCodes && app.accessCodes.length > 0) {
    document.getElementById('access-code-section').classList.remove('hidden');
  } else {
    document.getElementById('access-free-btn').classList.remove('hidden');
  }

  // Update page title
  document.title = `${app.name} | Luminous Studio`;
});

function validateAccess() {
  const code = document.getElementById('access-code-input').value.trim();
  const errEl = document.getElementById('access-error');
  if (MiniApps.validateCode(currentApp.id, code)) {
    errEl.classList.add('hidden');
    enterApp();
  } else {
    errEl.classList.remove('hidden');
    document.getElementById('access-code-input').classList.add('ring-2', 'ring-error');
    setTimeout(() => document.getElementById('access-code-input').classList.remove('ring-2', 'ring-error'), 1500);
  }
}

function enterApp() {
  document.getElementById('screen-access').classList.add('hidden');
  document.getElementById('screen-app').classList.remove('hidden');

  // Header
  document.getElementById('app-icon-header').textContent = currentApp.icon || '⚡';
  document.getElementById('app-title-header').textContent = currentApp.name;
  const typeLabels = {
    devocional:'Devocional', checklist:'Checklist interactivo', tracker:'Tracker de progreso',
    calculadora:'Calculadora', planificador:'Planificador', 'quiz-embed':'Quiz', generador:'Generador IA',
  };
  document.getElementById('app-type-header').textContent = typeLabels[currentApp.type] || 'Aplicación interactiva';

  renderApp();
}

// ── Render by type ────────────────────────────────────────
function renderApp() {
  const content = document.getElementById('app-content');
  const type = currentApp.type;

  if (type === 'checklist') return renderChecklist(content);
  if (type === 'tracker') return renderTracker(content);
  if (type === 'devocional') return renderDevocional(content);
  if (type === 'planificador') return renderPlanificador(content);
  if (type === 'calculadora') return renderCalculadora(content);
  if (type === 'quiz-embed') return renderQuizEmbed(content);
  renderGeneric(content);
}

// ── CHECKLIST ─────────────────────────────────────────────
function renderChecklist(el) {
  const storageKey = `app_checklist_${currentApp.id}`;
  let items = JSON.parse(localStorage.getItem(storageKey) || '[]');

  function save() { localStorage.setItem(storageKey, JSON.stringify(items)); }

  function draw() {
    const done = items.filter(i => i.done).length;
    const pct = items.length ? Math.round((done / items.length) * 100) : 0;
    el.innerHTML = `
      <div class="fade-in">
        <div class="mb-6">
          <div class="flex justify-between items-center mb-2">
            <p class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Progreso</p>
            <p class="text-xs font-bold text-primary">${done}/${items.length} · ${pct}%</p>
          </div>
          <div class="h-2 bg-surface-container-highest rounded-full overflow-hidden">
            <div class="h-full bg-primary rounded-full transition-all" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="space-y-2 mb-6" id="cl-list">
          ${items.map((item, i) => `
            <label class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-colors ${item.done ? 'bg-surface-container opacity-60' : 'bg-surface-container hover:bg-surface-container-high'}">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheck(${i})" class="w-4 h-4 rounded accent-primary cursor-pointer"/>
              <span class="text-sm flex-1 ${item.done ? 'line-through' : ''}">${esc(item.text)}</span>
              <button onclick="removeItem(${i})" class="text-on-surface-variant/40 hover:text-error transition-colors text-lg leading-none">×</button>
            </label>`).join('')}
          ${items.length === 0 ? '<p class="text-center text-on-surface-variant text-sm py-6">Agrega tu primer ítem ⬇️</p>' : ''}
        </div>
        <div class="flex gap-2">
          <input id="new-item-input" type="text" placeholder="Nuevo ítem..." maxlength="100"
            class="flex-1 bg-surface-container border border-outline-variant/30 rounded-xl px-4 py-2.5 text-sm focus:ring-1 focus:ring-primary outline-none"
            onkeydown="if(event.key==='Enter')addItem()"/>
          <button onclick="addItem()" class="px-4 py-2.5 bg-primary text-white text-xs font-bold rounded-xl hover:opacity-90 transition-opacity">Agregar</button>
        </div>
      </div>`;
  }

  window.toggleCheck = (i) => { items[i].done = !items[i].done; save(); draw(); };
  window.removeItem = (i) => { items.splice(i, 1); save(); draw(); };
  window.addItem = () => {
    const inp = document.getElementById('new-item-input');
    const text = inp.value.trim();
    if (!text) return;
    items.push({ text, done: false });
    save();
    draw();
  };
  draw();
}

// ── TRACKER ───────────────────────────────────────────────
function renderTracker(el) {
  const storageKey = `app_tracker_${currentApp.id}`;
  let data = JSON.parse(localStorage.getItem(storageKey) || '{"days":30,"checked":[]}');

  function save() { localStorage.setItem(storageKey, JSON.stringify(data)); }

  const days = data.days || 30;
  const checked = new Set(data.checked || []);
  const today = new Date().toISOString().split('T')[0];
  const streak = calcStreak(checked, today);

  function draw() {
    el.innerHTML = `
      <div class="fade-in">
        <div class="grid grid-cols-3 gap-3 mb-6">
          <div class="bg-surface-container rounded-2xl p-4 text-center">
            <p class="text-2xl font-extrabold text-primary">${streak}</p>
            <p class="text-[10px] text-on-surface-variant uppercase tracking-wider">Racha</p>
          </div>
          <div class="bg-surface-container rounded-2xl p-4 text-center">
            <p class="text-2xl font-extrabold text-secondary">${checked.size}</p>
            <p class="text-[10px] text-on-surface-variant uppercase tracking-wider">Días</p>
          </div>
          <div class="bg-surface-container rounded-2xl p-4 text-center">
            <p class="text-2xl font-extrabold text-on-surface">${Math.round((checked.size/days)*100)}%</p>
            <p class="text-[10px] text-on-surface-variant uppercase tracking-wider">Logrado</p>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-1.5 mb-4">
          ${Array.from({length:days}, (_,i) => {
            const d = dateOffset(i);
            const done = checked.has(d);
            const isToday = d === today;
            return `<button onclick="toggleDay('${d}')"
              class="aspect-square rounded-lg text-[10px] font-bold transition-all ${done ? 'bg-primary text-white' : isToday ? 'bg-primary/20 text-primary border border-primary/40' : 'bg-surface-container text-on-surface-variant hover:bg-surface-container-high'}"
              title="${d}">${i+1}</button>`;
          }).join('')}
        </div>
        <button onclick="toggleDay('${today}')"
          class="w-full py-3 ${checked.has(today) ? 'bg-secondary/20 text-secondary border border-secondary/30' : 'bg-primary text-white'} font-extrabold rounded-xl transition-all">
          ${checked.has(today) ? '✓ Día completado' : 'Marcar hoy como completado'}
        </button>
      </div>`;
  }

  window.toggleDay = (d) => {
    if (checked.has(d)) checked.delete(d); else checked.add(d);
    data.checked = [...checked];
    save();
    draw();
  };
  draw();
}

function calcStreak(checked, today) {
  let streak = 0;
  let d = new Date(today);
  while (true) {
    const key = d.toISOString().split('T')[0];
    if (checked.has(key)) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function dateOffset(daysFromStart) {
  const start = new Date();
  start.setDate(start.getDate() - start.getDay()); // start of week
  // Actually start from today - (days-1)
  const d = new Date();
  d.setDate(d.getDate() - (29 - daysFromStart));
  return d.toISOString().split('T')[0];
}

// ── DEVOCIONAL ────────────────────────────────────────────
function renderDevocional(el) {
  const storageKey = `app_devo_${currentApp.id}`;
  let notes = JSON.parse(localStorage.getItem(storageKey) || '{}');
  const today = new Date().toISOString().split('T')[0];
  const dayNum = getDayNumber();

  function save() { localStorage.setItem(storageKey, JSON.stringify(notes)); }

  el.innerHTML = `
    <div class="fade-in space-y-4">
      <div class="bg-surface-container rounded-2xl p-5 border border-outline-variant/10 text-center">
        <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-2">Día ${dayNum}</p>
        <p class="text-xs text-on-surface-variant mb-3">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</p>
        <div class="text-4xl mb-3">${currentApp.icon || '🕊️'}</div>
        <h2 class="text-lg font-extrabold text-on-surface mb-2">${esc(currentApp.name)}</h2>
        <p class="text-sm text-on-surface-variant">${esc(currentApp.description || 'Reflexión del día')}</p>
      </div>
      <div class="bg-surface-container rounded-2xl p-5 border border-outline-variant/10">
        <h3 class="text-sm font-bold mb-3 flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-sm">edit_note</span>
          Mi reflexión de hoy
        </h3>
        <textarea id="devo-note" rows="5" placeholder="Escribe aquí tus reflexiones, pensamientos o respuestas al mensaje de hoy..."
          class="w-full bg-surface-container-high border border-outline-variant/20 rounded-xl p-3 text-sm focus:ring-1 focus:ring-primary outline-none resize-none placeholder:text-on-surface-variant/40"
          onblur="saveNote()">${esc(notes[today] || '')}</textarea>
        <button onclick="saveNote()" class="mt-3 w-full py-2.5 bg-primary text-white text-xs font-bold rounded-xl hover:opacity-90 transition-opacity">
          Guardar reflexión
        </button>
      </div>
      ${Object.keys(notes).length > 1 ? `
      <div class="bg-surface-container rounded-2xl p-5 border border-outline-variant/10">
        <h3 class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-3">Mis reflexiones anteriores</h3>
        <div class="space-y-2 max-h-48 overflow-y-auto">
          ${Object.entries(notes).filter(([d]) => d !== today).sort((a,b) => b[0].localeCompare(a[0])).map(([d, text]) => `
            <div class="p-3 bg-surface-container-high rounded-xl">
              <p class="text-[10px] text-on-surface-variant mb-1">${new Date(d).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</p>
              <p class="text-xs text-on-surface line-clamp-2">${esc(text)}</p>
            </div>`).join('')}
        </div>
      </div>` : ''}
    </div>`;

  window.saveNote = () => {
    const val = document.getElementById('devo-note')?.value?.trim();
    if (val) { notes[today] = val; save(); showToast('Reflexión guardada ✨'); }
  };
}

function getDayNumber() {
  const storageKey = `app_devo_start_${currentApp?.id}`;
  let start = localStorage.getItem(storageKey);
  if (!start) { start = new Date().toISOString().split('T')[0]; localStorage.setItem(storageKey, start); }
  const diff = Math.floor((new Date() - new Date(start)) / 86400000);
  return diff + 1;
}

// ── CALCULADORA ───────────────────────────────────────────
function renderCalculadora(el) {
  el.innerHTML = `
    <div class="fade-in space-y-4">
      <div class="bg-surface-container rounded-2xl p-5 border border-outline-variant/10">
        <div class="text-3xl text-center mb-3">🧮</div>
        <h2 class="text-base font-extrabold text-center mb-1">${esc(currentApp.name)}</h2>
        <p class="text-xs text-on-surface-variant text-center mb-5">${esc(currentApp.description || '')}</p>
        <div class="space-y-3">
          <div>
            <label class="text-xs font-bold text-on-surface-variant block mb-1.5">Valor A</label>
            <input type="number" id="calc-a" placeholder="0"
              class="w-full bg-surface-container-high border border-outline-variant/20 rounded-xl px-4 py-2.5 text-sm focus:ring-1 focus:ring-primary outline-none" oninput="calcResult()"/>
          </div>
          <div>
            <label class="text-xs font-bold text-on-surface-variant block mb-1.5">Valor B</label>
            <input type="number" id="calc-b" placeholder="0"
              class="w-full bg-surface-container-high border border-outline-variant/20 rounded-xl px-4 py-2.5 text-sm focus:ring-1 focus:ring-primary outline-none" oninput="calcResult()"/>
          </div>
          <div class="flex gap-2 flex-wrap">
            ${['Suma','Resta','Multiplica','Divide','Porcentaje'].map(op => `
              <button onclick="setOp('${op}')" id="op-${op}"
                class="px-3 py-1.5 rounded-xl text-xs font-bold bg-surface-container-high text-on-surface-variant hover:bg-primary/10 hover:text-primary transition-all">
                ${op}
              </button>`).join('')}
          </div>
          <div id="calc-result" class="p-4 bg-primary/10 rounded-xl text-center border border-primary/20 hidden">
            <p class="text-[10px] text-on-surface-variant uppercase tracking-wider mb-1">Resultado</p>
            <p class="text-3xl font-extrabold text-primary" id="calc-value">—</p>
          </div>
        </div>
      </div>
    </div>`;

  let currentOp = 'Suma';
  window.setOp = (op) => {
    currentOp = op;
    document.querySelectorAll('[id^="op-"]').forEach(b => b.classList.remove('bg-primary','text-white'));
    document.getElementById(`op-${op}`)?.classList.add('bg-primary','text-white');
    calcResult();
  };
  window.calcResult = () => {
    const a = parseFloat(document.getElementById('calc-a').value) || 0;
    const b = parseFloat(document.getElementById('calc-b').value) || 0;
    let res;
    if (currentOp === 'Suma') res = a + b;
    else if (currentOp === 'Resta') res = a - b;
    else if (currentOp === 'Multiplica') res = a * b;
    else if (currentOp === 'Divide') res = b !== 0 ? (a / b).toFixed(4) : '∞';
    else if (currentOp === 'Porcentaje') res = ((a * b) / 100).toFixed(2);
    document.getElementById('calc-result').classList.remove('hidden');
    document.getElementById('calc-value').textContent = res;
  };
  window.setOp('Suma');
}

// ── PLANIFICADOR ──────────────────────────────────────────
function renderPlanificador(el) {
  const storageKey = `app_plan_${currentApp.id}`;
  let tasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
  function save() { localStorage.setItem(storageKey, JSON.stringify(tasks)); }

  function draw() {
    const todo = tasks.filter(t => t.status === 'todo');
    const doing = tasks.filter(t => t.status === 'doing');
    const done = tasks.filter(t => t.status === 'done');

    const col = (title, color, items, status) => `
      <div class="bg-surface-container rounded-2xl p-4 border border-outline-variant/10">
        <h3 class="text-xs font-extrabold ${color} uppercase tracking-wider mb-3">${title} <span class="opacity-60">(${items.length})</span></h3>
        <div class="space-y-2 min-h-[60px]">
          ${items.map(t => `
            <div class="p-2.5 rounded-xl bg-surface-container-high text-xs flex items-start gap-2 group">
              <span class="flex-1">${esc(t.text)}</span>
              <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                ${status !== 'doing' ? `<button onclick="moveTo('${t.id}','doing')" class="text-primary hover:opacity-80" title="En progreso">→</button>` : ''}
                ${status !== 'done' ? `<button onclick="moveTo('${t.id}','done')" class="text-secondary hover:opacity-80" title="Listo">✓</button>` : ''}
                <button onclick="removeTask('${t.id}')" class="text-error hover:opacity-80" title="Eliminar">×</button>
              </div>
            </div>`).join('') || '<p class="text-[10px] text-on-surface-variant/40">Vacío</p>'}
        </div>
        <div class="mt-3 flex gap-1">
          <input placeholder="Nueva tarea..." id="inp-${status}" maxlength="80"
            class="flex-1 bg-surface-container-highest border border-outline-variant/20 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-primary outline-none"
            onkeydown="if(event.key==='Enter')addTask('${status}')"/>
          <button onclick="addTask('${status}')" class="px-2.5 py-1.5 bg-primary text-white text-xs font-bold rounded-lg hover:opacity-90">+</button>
        </div>
      </div>`;

    el.innerHTML = `
      <div class="fade-in">
        <h2 class="text-base font-extrabold mb-4">${esc(currentApp.name)}</h2>
        <div class="space-y-4">
          ${col('Por hacer','text-on-surface-variant', todo, 'todo')}
          ${col('En progreso','text-primary', doing, 'doing')}
          ${col('Completado','text-secondary', done, 'done')}
        </div>
      </div>`;
  }

  window.addTask = (status) => {
    const inp = document.getElementById(`inp-${status}`);
    const text = inp?.value?.trim();
    if (!text) return;
    tasks.push({ id: crypto.randomUUID(), text, status });
    save(); draw();
  };
  window.moveTo = (id, status) => {
    const t = tasks.find(t => t.id === id);
    if (t) { t.status = status; save(); draw(); }
  };
  window.removeTask = (id) => {
    tasks = tasks.filter(t => t.id !== id); save(); draw();
  };
  draw();
}

// ── QUIZ EMBED ────────────────────────────────────────────
function renderQuizEmbed(el) {
  const quizzes = Quizzes.getAll();
  if (!quizzes.length) {
    el.innerHTML = `
      <div class="text-center py-12">
        <p class="text-on-surface-variant text-sm mb-4">No tienes quizzes creados todavía.</p>
        <a href="./generador-ia.html" class="px-5 py-2.5 bg-primary text-white rounded-xl text-xs font-bold">Crear un quiz</a>
      </div>`;
    return;
  }
  el.innerHTML = `
    <div class="fade-in">
      <h2 class="text-base font-extrabold mb-4">Selecciona un quiz</h2>
      <div class="space-y-3">
        ${quizzes.map(q => `
          <a href="./quiz.html?quiz=${q.id}" class="flex items-center gap-3 p-4 bg-surface-container rounded-2xl border border-outline-variant/10 hover:border-primary/30 transition-all">
            <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
              <span class="material-symbols-outlined text-primary">quiz</span>
            </div>
            <div>
              <p class="text-sm font-bold">${esc(q.title)}</p>
              <p class="text-xs text-on-surface-variant">${esc(q.niche || '')}</p>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant ml-auto">arrow_forward</span>
          </a>`).join('')}
      </div>
    </div>`;
}

// ── GENERIC ───────────────────────────────────────────────
function renderGeneric(el) {
  el.innerHTML = `
    <div class="fade-in text-center py-16">
      <div class="text-6xl mb-4">${esc(currentApp.icon || '⚡')}</div>
      <h2 class="text-xl font-extrabold mb-2">${esc(currentApp.name)}</h2>
      <p class="text-on-surface-variant text-sm mb-2">${esc(currentApp.description || '')}</p>
      <p class="text-xs text-on-surface-variant/50">Tipo: ${esc(currentApp.type)} · Nicho: ${esc(currentApp.niche)}</p>
      <div class="mt-8 p-4 bg-primary/5 border border-primary/20 rounded-2xl text-left">
        <p class="text-xs text-primary font-bold mb-1">¿Quieres personalizar esta mini-app?</p>
        <p class="text-xs text-on-surface-variant">Próximamente podrás añadir contenido, secciones y personalización avanzada desde el editor de mini-apps.</p>
      </div>
    </div>`;
}

// ── Error screen ──────────────────────────────────────────
function showError(msg) {
  document.getElementById('screen-access').innerHTML = `
    <div class="text-center fade-in">
      <div class="text-5xl mb-4">⚠️</div>
      <h1 class="text-xl font-extrabold mb-2">Algo salió mal</h1>
      <p class="text-on-surface-variant text-sm mb-6">${esc(msg)}</p>
      <a href="./dashboard.html" class="px-5 py-2.5 bg-primary text-white rounded-xl text-sm font-bold">← Volver</a>
    </div>`;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
