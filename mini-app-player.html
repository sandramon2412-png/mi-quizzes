<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="./supabase-config.js"></script>

<script src="./skinglow-demo-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #09090b; --bg2: #18181b; --bg3: #27272a;
    --border: rgba(255,255,255,0.08);
    --text: #fafafa; --muted: #a1a1aa;
    --accent: #2E5BFF; --accent2: #7c3aed;
    --success: #22c55e; --warn: #f97316;
    --card: #18181b; --card2: #27272a;
    --btn: linear-gradient(135deg,#2E5BFF,#7c3aed);
    --radius: 16px;
  }
  [data-theme="light"] {
    --bg: #fdf8f4; --bg2: #fff; --bg3: #f5ede6;
    --border: rgba(180,120,100,0.13);
    --text: #2d1f1a; --muted: #7a5c52;
    --accent: #c0635c; --accent2: #d4856a;
    --success: #5a8a5e; --warn: #d4856a;
    --card: #fff; --card2: #fdf8f4;
    --btn: linear-gradient(135deg,#c0635c,#d4856a);
    --radius: 18px;
    --access-bg: linear-gradient(160deg, #fdf8f4 0%, #f9efe7 50%, #f3e6d8 100%);
  }
  :root {
    --access-bg: var(--bg);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:var(--bg); }
  body {
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--access-bg,var(--bg));
    color:var(--text);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    background-attachment:fixed;
  }
  body:not([data-theme="light"]) {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 62%),
      radial-gradient(ellipse 70% 48% at 50% 112%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 64%),
      linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size:auto, auto, 42px 42px, 42px 42px;
  }
  body[data-theme="light"] {
    background-image:
      radial-gradient(ellipse 70% 45% at 50% -10%, rgba(255,255,255,0.72), transparent 60%),
      radial-gradient(ellipse 62% 48% at 50% 112%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 65%);
  }
  .serif { font-family:'Lora',Georgia,serif; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }

  /* App container — phone-width centered */
  #screen-access, #screen-app {
    width: 100%;
    max-width: 520px;
  }
  body.map-engine-open #screen-app { max-width: min(100%, 720px); }

  /* Cards */
  .card {
    background:color-mix(in srgb, var(--card) 86%, transparent);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12), 0 18px 42px -24px rgba(0,0,0,0.82);
    backdrop-filter: blur(18px) saturate(1.22);
    -webkit-backdrop-filter: blur(18px) saturate(1.22);
  }
  .card2 {
    background:color-mix(in srgb, var(--card2) 88%, transparent);
    border:1px solid var(--border);
    border-radius:calc(var(--radius) - 4px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.10);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .card-dark { background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 78%,#100820) 0%,color-mix(in srgb,var(--accent2,var(--accent)) 64%,#080618) 100%); color:#fff; border-radius:var(--radius); padding:20px; margin-bottom:14px; border:1px solid rgba(255,255,255,.18); box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 28%,rgba(0,0,0,.22)),inset 0 1px 0 rgba(255,255,255,.24); }
  .quote-box { background:var(--bg3); border-left:3px solid var(--accent); border-radius:10px; padding:14px 16px; font-style:italic; color:var(--muted); font-size:13px; line-height:1.7; }

  /* Buttons */
  .btn-primary { background:var(--btn); color:#fff; border:none; border-radius:50px; padding:14px 24px; font-family:inherit; font-weight:800; font-size:14px; cursor:pointer; width:100%; transition:all .2s; box-shadow:0 4px 18px rgba(0,0,0,0.2); display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(0,0,0,0.3); }
  .btn-primary:active { transform:translateY(0); }
  .btn-primary:disabled { opacity:.6; cursor:default; transform:none; }
  .btn-secondary { background:var(--card); color:var(--text); border:1.5px solid var(--border); border-radius:50px; padding:10px 20px; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; transition:all .2s; }
  .btn-secondary:hover { border-color:var(--accent); color:var(--accent); }
  .btn-done { background:var(--card); color:var(--success); border:1.5px solid var(--success); border-radius:50px; padding:14px 24px; font-family:inherit; font-weight:800; font-size:14px; cursor:pointer; width:100%; display:inline-flex; align-items:center; justify-content:center; gap:6px; }

  /* Quiz options */
  .quiz-opt { width:100%; padding:14px 18px; border:1.5px solid var(--border); border-radius:14px; background:var(--card); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; transition:all .18s; text-align:left; margin-bottom:10px; color:var(--text); display:flex; align-items:center; gap:10px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.08); }
  .quiz-opt:hover:not(:disabled) { border-color:var(--accent); background:var(--bg3); transform:translateX(2px); }
  .quiz-opt.correct { border-color:#16a34a; background:#f0fdf4; color:#166534; }
  .quiz-opt.wrong   { border-color:#dc2626; background:#fef2f2; color:#991b1b; animation:shake .3s ease; }
  .quiz-opt:disabled { cursor:default; }
  .quiz-opt .opt-letter { width:28px; height:28px; border-radius:50%; background:var(--bg3); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0; }
  .quiz-opt.correct .opt-letter { background:#16a34a; color:#fff; }
  .quiz-opt.wrong   .opt-letter { background:#dc2626; color:#fff; }

  /* Input */
  .input { background:var(--card2); border:1.5px solid var(--border); border-radius:12px; padding:12px 16px; font-size:14px; color:var(--text); outline:none; transition:border-color .2s; font-family:inherit; }
  .input:focus { border-color:var(--accent); }
  textarea.input { resize:none; line-height:1.6; }

  /* Access screen */
  #screen-access { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .access-wrap { width:100%; max-width:360px; text-align:center; animation:fadeUp .4s ease; }
  .access-icon-wrap { width:88px; height:88px; border-radius:28px; background:var(--btn); display:flex; align-items:center; justify-content:center; font-size:44px; margin:0 auto 20px; box-shadow:0 16px 56px color-mix(in srgb, var(--accent) 34%, transparent), 0 0 0 12px color-mix(in srgb, var(--accent) 16%, transparent); }
  .access-title { font-family:'Lora',serif; font-size:28px; font-weight:700; margin-bottom:6px; line-height:1.2; }
  .access-subtitle { color:var(--muted); font-size:14px; margin-bottom:32px; line-height:1.5; }
  .access-box { background:color-mix(in srgb, var(--card) 88%, transparent); border:1px solid var(--border); border-radius:24px; padding:24px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.12), 0 24px 60px -24px rgba(0,0,0,0.72); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  .access-box-title { font-weight:700; font-size:15px; margin-bottom:6px; }
  .access-box-desc { color:var(--muted); font-size:12px; margin-bottom:16px; line-height:1.5; }

  /* App screen */
  #screen-app { min-height:100dvh; flex-direction:column; background:color-mix(in srgb, var(--bg) 84%, transparent); box-shadow:0 0 0 1px rgba(255,255,255,0.04), 0 30px 90px rgba(0,0,0,0.28); }
  #app-header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; background:var(--bg); width:100%; }
  #app-header-icon { font-size:22px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:12px; background:var(--btn); flex-shrink:0; box-shadow:0 2px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
  #app-header-name { font-weight:800; font-size:14px; }
  #app-header-greeting { font-size:11px; color:var(--accent); font-weight:600; margin-left:auto; }

  /* Top pill tabs */
  .tab-btn { flex-shrink:0; padding:8px 13px; border-radius:20px; font-size:11px; font-weight:800; color:var(--text); border:1.5px solid var(--border); background:color-mix(in srgb, var(--card) 82%, transparent); cursor:pointer; transition:all .2s; white-space:nowrap; display:flex; align-items:center; gap:5px; height:36px; opacity:.82; box-shadow:inset 0 1px 0 rgba(255,255,255,0.08); }
  .tab-btn:hover { opacity:1; border-color:var(--accent); }
  .tab-btn.active { background:var(--btn); color:#fff; border-color:transparent; box-shadow:0 2px 12px rgba(0,0,0,0.18); opacity:1; }

  /* Reto day card */
  .day-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:12px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 8px 24px -8px rgba(0,0,0,0.6); }
  .day-card-header { display:flex; align-items:center; gap:12px; padding:16px; cursor:pointer; }
  .day-num { width:36px; height:36px; border-radius:50%; border:2px solid var(--accent); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }
  .day-num.done { background:var(--accent); color:#fff; border-color:var(--accent); }
  .day-card-body { padding:0 16px 20px; border-top:1px solid var(--border); }
  .day-icon { color:var(--accent); font-size:18px; vertical-align:-4px; margin-right:4px; }

  /* Stat pills */
  .stat-row { display:flex; gap:10px; margin-bottom:16px; }
  .stat-pill { flex:1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 8px; text-align:center; box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 8px 20px -8px rgba(0,0,0,0.5); }
  .stat-val { font-size:24px; font-weight:900; color:var(--accent); line-height:1.1; }
  .stat-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-top:3px; font-weight:700; }

  /* Progress bar */
  .prog-wrap { height:8px; background:var(--bg3); border-radius:99px; overflow:hidden; margin-bottom:4px; }
  .prog-bar { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2,var(--accent))); transition:width .6s cubic-bezier(.4,0,.2,1); }

  /* Shake animation for wrong answers */
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }

  /* Checklist item */
  .check-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
  .check-row:last-child { border-bottom:none; }
  .check-circle { width:24px; height:24px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:all .15s; }
  .check-circle.done { background:var(--accent); border-color:var(--accent); }

  /* Chat bubbles */
  .bubble-wrap { display:flex; gap:8px; margin-bottom:12px; align-items:flex-end; }
  .bubble-wrap.user { flex-direction:row-reverse; }
  .bubble { padding:10px 14px; border-radius:18px; font-size:13px; line-height:1.5; max-width:80%; }
  .bubble.bot { background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .bubble.user { background:var(--btn); color:#fff; border-bottom-right-radius:4px; }

  /* Flashcard */
  .flip-card { perspective:1000px; }
  .flip-inner { transition:transform .45s; transform-style:preserve-3d; position:relative; min-height:160px; }
  .flip-inner.flipped { transform:rotateY(180deg); }
  .flip-face { backface-visibility:hidden; position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; border-radius:var(--radius); background:var(--card); border:1.5px solid var(--border); }
  .flip-face.back { transform:rotateY(180deg); border-color:var(--accent); }

  /* Animations */
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none} }
  .fade-up { animation:fadeUp .35s ease; }
  @keyframes pulseRing { 0%{transform:scale(.85);opacity:.8} 60%{transform:scale(1.4);opacity:0} 100%{transform:scale(.85);opacity:0} }
  @keyframes waveBar { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }

  /* Speaking indicator */
  .speaking-wrap { display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0; }
  .speaking-dot { width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulseRing 1.4s ease infinite; }
  .speaking-bars { display:flex;align-items:flex-end;gap:3px;height:18px; }
  .speaking-bars span { width:3px;border-radius:2px;background:var(--accent);animation:waveBar 1s ease infinite; }
  .speaking-bars span:nth-child(2){animation-delay:.15s}.speaking-bars span:nth-child(3){animation-delay:.3s}.speaking-bars span:nth-child(4){animation-delay:.45s}

  /* Voice toggle */
  .voice-toggle { padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;font-family:inherit; }
  .voice-toggle.on { border-color:var(--accent);color:var(--accent); }
  .icon-btn { width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;flex-shrink:0;cursor:pointer;transition:all .2s; }
  .icon-btn:hover { color:var(--accent);border-color:var(--accent); }
  .voice-panel { position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.48);backdrop-filter:blur(8px);padding:18px; }
  .voice-panel.open { display:flex; }
  .voice-sheet { width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.5); }
  .voice-field { width:100%;background:var(--card2);border:1px solid var(--border);border-radius:14px;color:var(--text);font:inherit;font-size:13px;padding:11px 12px;outline:none; }
  .voice-range { width:100%;accent-color:var(--accent); }

  /* Meditation timer */
  .med-timer { font-size:56px;font-weight:900;letter-spacing:3px;color:var(--accent);font-family:'Plus Jakarta Sans',monospace;line-height:1; }
  .med-ctrl-row { display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px; }
  .med-play { width:60px;height:60px;border-radius:50%;background:var(--btn);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,0.2);transition:all .2s; }
  .med-play:hover { transform:scale(1.07); }
  .med-stop { width:44px;height:44px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s; }
  .med-stop:hover { border-color:#e55;color:#e55; }

  ::-webkit-scrollbar { width:3px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

  /* â”€â”€ PREMIUM VISUAL UPGRADE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */

  /* Section hero — replaces flat card-dark in all 19 section types */
  .section-hero {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2, var(--accent)) 100%);
    border-radius: var(--radius); padding: 26px 22px 22px; margin-bottom: 16px;
    box-shadow: 0 8px 40px color-mix(in srgb, var(--accent) 28%, transparent), 0 2px 8px rgba(0,0,0,0.22);
    animation: fadeUp .35s ease;
  }
  .section-hero::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 88% 15%, rgba(255,255,255,0.16) 0%, transparent 52%),
                radial-gradient(ellipse at 12% 85%, rgba(0,0,0,0.1) 0%, transparent 45%);
  }
  .section-hero::after {
    content: ''; position: absolute; top: -28px; right: -28px; pointer-events: none;
    width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,0.07);
  }
  .section-hero-icon {
    width: 50px; height: 50px; border-radius: 15px; position: relative; z-index: 1;
    background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .section-hero-title {
    font-size: 22px; font-weight: 700; color: #fff; line-height: 1.2;
    margin-bottom: 5px; position: relative; z-index: 1;
  }
  .section-hero-sub {
    font-size: 12px; color: rgba(255,255,255,0.72); font-weight: 500;
    position: relative; z-index: 1;
  }

  /* Stat values — solid color, no gradient (per design taste skill) */
  .stat-val { font-size: 28px; font-weight: 800; line-height: 1.1; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; font-weight: 600; }

  /* Glass header */
  #app-header { backdrop-filter: blur(16px) saturate(1.4); background: rgba(14,14,14,0.88) !important; }
  [data-theme="light"] #app-header { background: rgba(253,248,244,0.88) !important; }

  /* Active tab glow */
  .tab-btn.active { box-shadow: 0 2px 18px color-mix(in srgb, var(--accent) 38%, transparent) !important; }

  /* Guided app shell inspired by finished product apps */
  #app-content { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
  .today-wrap { padding: 22px 18px 24px; animation: fadeUp .32s ease; }
  .today-hero {
    position:relative; overflow:hidden; border-radius:28px; padding:24px 22px;
    background:
      radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 36%),
      linear-gradient(135deg, color-mix(in srgb, var(--card) 92%, transparent), color-mix(in srgb, var(--bg3) 86%, transparent));
    border:1px solid var(--border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.11), 0 20px 60px -38px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .today-kicker { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; color:var(--muted); font-size:12px; font-weight:800; }
  .today-title { font-family:'Lora',serif; font-size:28px; line-height:1.12; color:var(--text); margin-bottom:8px; }
  .today-copy { color:var(--muted); font-size:13px; line-height:1.65; max-width:36rem; }
  .today-chip-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  .today-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:999px; padding:8px 11px; font-size:11px; font-weight:800; }
  .tool-grid { display:grid; gap:12px; margin-top:16px; }
  .tool-card {
    width:100%; border:none; text-align:left; cursor:pointer; color:var(--text);
    display:flex; align-items:center; gap:14px; padding:15px; border-radius:20px;
    background:var(--card); border:1px solid var(--border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 12px 32px -24px rgba(0,0,0,0.45);
    font-family:inherit; transition:transform .16s, border-color .16s, box-shadow .16s;
  }
  .tool-card:hover { transform:translateY(-1px); border-color:color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow:0 16px 40px -28px color-mix(in srgb, var(--accent) 60%, transparent); }

  .skin-scan-next { margin-top:10px; padding:12px; border-radius:18px; background:rgba(255,253,249,.72); border:1px solid rgba(33,22,27,.08); color:var(--text); font-size:12px; line-height:1.5; font-weight:750; }
  .skin-scan-result-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .skin-scan-proof { display:grid; gap:8px; margin-top:12px; }
  .skin-scan-proof-row { display:grid; grid-template-columns:32px 1fr; gap:10px; align-items:start; padding:11px; border-radius:18px; border:1px solid rgba(33,22,27,.08); background:rgba(255,253,249,.72); }
  .skin-scan-proof-row .material-symbols-outlined { width:32px; height:32px; display:grid; place-items:center; border-radius:12px; color:#fff; background:linear-gradient(135deg,#6f9d92,#70405d); font-size:18px; }

  .skin-scan-deep { display:none; margin-top:12px; padding:16px; border-radius:24px; border:1px solid rgba(200,79,120,.16); background:linear-gradient(145deg,rgba(255,253,249,.92),rgba(248,238,231,.72)); }
  .skin-scan-deep.show { display:block; animation:fadeUp .25s ease; }

  .skin-scan-source { display:inline-flex; align-items:center; gap:6px; padding:6px 9px; border-radius:999px; background:rgba(200,79,120,.10); color:#8f3157; font-size:9px; font-weight:950; text-transform:uppercase; letter-spacing:.07em; white-space:nowrap; }
  .skin-scan-quality { display:grid; grid-template-columns:88px 1fr; gap:10px; align-items:center; padding:12px; border-radius:18px; background:rgba(255,255,255,.72); border:1px solid rgba(33,22,27,.08); margin-bottom:10px; }
  .skin-scan-quality strong { display:block; color:var(--text); font-size:23px; line-height:1; }
  .skin-scan-quality span { display:block; margin-top:4px; color:var(--muted); font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.05em; }
  .skin-scan-zone-grid { display:grid; gap:8px; margin:12px 0; }
  .skin-scan-zone { display:grid; grid-template-columns:36px 1fr auto; gap:10px; align-items:start; padding:12px; border-radius:18px; background:rgba(255,255,255,.68); border:1px solid rgba(33,22,27,.08); }
  .skin-scan-zone .material-symbols-outlined { width:36px; height:36px; display:grid; place-items:center; border-radius:13px; color:#fff; background:linear-gradient(135deg,#c84f78,#70405d); font-size:19px; }

  .skin-scan-list b { width:24px; height:24px; display:grid; place-items:center; border-radius:9px; background:rgba(200,79,120,.10); color:#c84f78; font-size:10px; }

  /* Personalized experience widgets */
  .bodymap-card { padding:20px; text-align:center; overflow:hidden; }
  .bodymap-stage { position:relative; max-width:420px; margin:4px auto 18px; }
  .body-silhouette {
    position:absolute; inset:8px 72px 18px;
    background:linear-gradient(180deg, color-mix(in srgb, var(--accent2) 18%, #fff), color-mix(in srgb, var(--accent) 10%, #fff));
    border:2px solid color-mix(in srgb, var(--accent) 36%, transparent);
    border-radius:46% 46% 38% 38% / 16% 16% 28% 28%;
    box-shadow:0 26px 80px color-mix(in srgb, var(--accent) 14%, transparent);
    opacity:.72;
    clip-path:polygon(37% 0,63% 0,68% 18%,86% 24%,78% 52%,70% 70%,62% 92%,58% 100%,42% 100%,38% 92%,30% 70%,22% 52%,14% 24%,32% 18%);
  }
  .body-silhouette:before {
    content:""; position:absolute; left:50%; top:-34px; width:68px; height:76px; transform:translateX(-50%);
    border-radius:50%; border:2px solid color-mix(in srgb, var(--accent) 42%, transparent);
    background:color-mix(in srgb, var(--accent2) 13%, #fff);
  }
  .signal-dot {
    position:absolute; transform:translate(-50%,-50%); border:none; background:transparent; color:var(--accent);

    color:var(--text); font:inherit; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; gap:10px;

  .signal-node-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .bodymap-visual { display:none; }

  .signal-sheet { text-align:left; padding:18px; margin-top:12px; display:none; }

  .signal-title { font-size:20px; font-weight:800; margin-bottom:8px; }
  .signal-compass {
    position:relative; min-height:390px; margin:14px 0 16px; border-radius:30px; padding:18px;
    background:
      radial-gradient(circle at 50% 48%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 28%),
      radial-gradient(circle at 22% 24%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 30%),
      linear-gradient(135deg, color-mix(in srgb, var(--accent) 8%, var(--card)), color-mix(in srgb, var(--accent2) 6%, var(--card)));
    border:1px solid color-mix(in srgb, var(--accent) 18%, var(--border));

  .body-engine {

  .companion-card { margin-top:16px; padding:18px; display:grid; gap:12px; text-align:left; }
  .companion-row { display:flex; gap:12px; align-items:flex-start; padding:13px; border-radius:16px; background:color-mix(in srgb, var(--card2) 70%, transparent); border:1px solid var(--border); }
  .companion-row .material-symbols-outlined { color:var(--accent); flex-shrink:0; }
  .companion-row strong { display:block; font-size:13px; margin-bottom:3px; }
  .companion-row span { display:block; color:var(--muted); font-size:12px; line-height:1.5; }
  .signal-map-stage .body-silhouette { display:none; }
  .signal-hub {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:118px; height:118px; border-radius:34px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 24%, var(--card)), color-mix(in srgb, var(--accent2) 18%, var(--card)));
    border:1px solid color-mix(in srgb, var(--accent) 28%, var(--border));
    box-shadow:0 24px 70px -42px color-mix(in srgb, var(--accent) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.14);
    color:var(--accent);
  }
  .signal-hub .material-symbols-outlined { font-size:48px; }
  .signal-map-stage:before {
    content:""; position:absolute; left:50%; top:50%; width:250px; height:250px; transform:translate(-50%,-50%);
    border-radius:999px; border:1px dashed color-mix(in srgb, var(--accent) 25%, transparent);
  }
  @media (max-width:380px) { .signal-board { grid-template-columns:1fr; } }
  .records-tabs { display:flex; gap:8px; margin:14px 0; }
  .records-tab { flex:1; border:none; border-bottom:2px solid transparent; background:transparent; color:var(--muted); font:inherit; font-size:12px; font-weight:900; padding:10px 4px; }
  .records-tab.active { color:var(--accent); border-color:var(--accent); }

  /* Shimmer progress bar */
  @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
  .prog-bar {
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2,var(--accent)) 50%, var(--accent) 100%) !important;
    background-size: 200% 100% !important;
    animation: shimmer 2.5s linear infinite !important;
  }

  /* Day card hover + completion */
  .day-card { transition: box-shadow .2s, transform .15s; }
  .day-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.14); transform: translateY(-1px); }
  .day-card.completed { border-color: color-mix(in srgb, var(--accent) 28%, transparent) !important; }
  .day-num.done {
    background: var(--btn) !important;
    border-color: transparent !important; box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  /* Button primary glow upgrade */
  .btn-primary:hover { box-shadow: 0 8px 32px color-mix(in srgb, var(--accent) 38%, transparent), 0 2px 8px rgba(0,0,0,0.18) !important; }

  /* Tracker dot hover */
  .tracker-dot { transition: transform .12s, box-shadow .12s !important; }
  .tracker-dot:hover { transform: scale(1.18) !important; z-index: 1; box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 28%, transparent) !important; }

  /* Flashcard back glow */
  .flip-face.back { box-shadow: 0 0 0 2px var(--accent), 0 4px 20px color-mix(in srgb, var(--accent) 20%, transparent) !important; }

  /* Ambient access screen glows */
  .access-glow {
    position: absolute; border-radius: 50%; pointer-events: none; will-change: transform;
    animation: floatGlow 7s ease-in-out infinite alternate;
  }
  @keyframes floatGlow { 0%{transform:translateY(0) scale(1)} 100%{transform:translateY(-18px) scale(1.04)} }
</style>
</head>
<body>

<!-- â”€â”€ ACCESS SCREEN â”€â”€ -->
<div id="screen-access" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg);background-image:radial-gradient(circle at 18% 38%,color-mix(in srgb, var(--accent) 36%, transparent) 0%,transparent 48%),radial-gradient(circle at 82% 72%,color-mix(in srgb, var(--accent2) 32%, transparent) 0%,transparent 45%);background-attachment:fixed">
  <div style="width:100%;max-width:360px;text-align:center;animation:fadeUp .4s ease;position:relative;z-index:1">
    <div id="access-icon-wrap" style="width:108px;height:108px;border-radius:34px;background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:54px;margin:0 auto 24px;box-shadow:0 16px 56px color-mix(in srgb, var(--accent) 38%, transparent),0 0 0 12px color-mix(in srgb, var(--accent) 10%, transparent)">
      <span id="access-icon"><span class="material-symbols-outlined" style="font-size:48px;color:#fff">bolt</span></span>

    <p id="access-desc" style="color:var(--muted);font-size:14px;margin-bottom:36px;line-height:1.6">Cargando...</p>

    <div id="access-code-section" style="display:none;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:24px;text-align:left">

      <button class="btn-primary" onclick="validateAccess()"><span class="material-symbols-outlined" style="font-size:16px">auto_awesome</span> Activar acceso</button>

<div id="screen-app" style="display:none;min-height:100dvh;flex-direction:column;background:var(--bg);background-image:radial-gradient(circle at 15% 25%,color-mix(in srgb, var(--accent) 32%, transparent) 0%,transparent 45%),radial-gradient(circle at 85% 75%,color-mix(in srgb, var(--accent2) 28%, transparent) 0%,transparent 42%);background-attachment:fixed;overflow-x:clip">
  <!-- Top bar -->
  <header id="app-header">
    <div id="app-header-icon"><span class="material-symbols-outlined" style="font-size:20px;color:#fff">bolt</span></div>
    <div style="flex:1;min-width:0">
      <div id="app-header-name">App</div>

    <span id="footer-text">Hecho con <a href="https://luminous-studio.com" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-weight:600;">Luminous Studio</a></span>
  </footer>
</div>

<div id="voice-panel" class="voice-panel" onclick="if(event.target.id==='voice-panel')closeVoicePanel()">
  <div class="voice-sheet">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px">
      <div>
        <p style="font-size:13px;font-weight:900;color:var(--text)">Voz de lectura</p>
        <p style="font-size:11px;color:var(--muted);margin-top:3px">La calidad depende de las voces instaladas en este navegador.</p>

      <button onclick="closeVoicePanel()" class="icon-btn" style="width:34px;height:34px"><span class="material-symbols-outlined" style="font-size:17px">close</span></button>
    </div>
    <label style="display:block;font-size:11px;font-weight:800;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em">Voz</label>
    <select id="voice-select" class="voice-field" onchange="saveVoiceSettings()"></select>

        <input id="voice-rate" class="voice-range" type="range" min="0.75" max="1.05" step="0.01" onchange="saveVoiceSettings()" oninput="saveVoiceSettings()">

        <input id="voice-pitch" class="voice-range" type="range" min="0.82" max="1.1" step="0.01" onchange="saveVoiceSettings()" oninput="saveVoiceSettings()">
      </label>

    <button class="btn-primary" onclick="testSelectedVoice()"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;margin-right:4px">play_arrow</span>Probar voz</button>
  </div>
</div>

<script>
let currentApp = null;
let activeTab = 0;

function withTimeout(promise, ms = 4000, message = 'timeout') {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
  ]);
}

// â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
document.addEventListener('DOMContentLoaded', async () => {
  const templateId = getParam('template_id');
  const id = getParam('id');
  let app = null;
  // Direct template preview via ?template_id=tpl-xxx — no localStorage needed
  if (templateId && typeof getBuiltinMiniAppTemplates === 'function') {
    const tpl = getBuiltinMiniAppTemplates().find(t => t.id === templateId);
    if (tpl) {
      app = { ...tpl, id: tpl.id, status: 'active', _fromTemplate: true, _templateId: tpl.id, _isPreview: true,
        accent: tpl.primaryColor, accent2: tpl.secondaryColor, bg: tpl.bgColor,
        types: Array.isArray(tpl.types) && tpl.types.length ? tpl.types : [tpl.type || 'reto'] };
    }
  }
  if (!app) {
    if (!id) { showError('No se especificó una mini-app.'); return; }
    const builtInApp = typeof getSkinGlowMiniApp === 'function' ? getSkinGlowMiniApp(id) : null;
    const localApp = MiniApps.get(id);
    app = builtInApp || localApp || null;
    if (!app && typeof DB !== 'undefined') {
      try { app = await withTimeout(DB.miniApps.get(id), 4500, 'No se pudo conectar con la base de datos.'); } catch(e) {
        console.warn('[mini-app] DB load failed:', e.message);
      }
    }
    if (!app) app = getDemoPreviewApp(id);
  }
  if (!app) { showError('Mini-App no encontrada. Verifica el enlace.'); return; }
  try {
  app = repairTextTree(app);
  try {
    MiniApps.save(app);
  } catch (storageErr) {
    console.warn('[mini-app] no se pudo actualizar localStorage, continuo con la app remota:', storageErr);
  }
  currentApp = app;
  document.body.classList.toggle('app-skinglow', app.id === 'skinglow-miniapp');
  if (app.id) document.body.dataset.appId = app.id;

  const ownerId = app.owner_id || app.userId || app.user_id;
  const originalTheme = extractAppTheme(app);

  // Fallback theme if no AI-generated theme data
  if (!app.mode) {
    const n = `${app.niche || ''} ${app.category || ''} ${app.subcategory || ''} ${app.name || ''}`.toLowerCase();
    if (/espirit|bibl|fe\b|dios|oraci|cristi|religi|angel|manna|sagr/i.test(n))
      Object.assign(app, {mode:'light',accent:'#7c3aed',accent2:'#a855f7',bg:'#f5f0ff',card:'#fff',text:'#2d1f3a',muted:'#7c6890',font:'serif'});
    else if (/wellness|bienestar|salud|yoga|medita|mindful|emocio|autoam/i.test(n))
      Object.assign(app, {mode:'light',accent:'#c0635c',accent2:'#d4856a',bg:'#fdf8f4',card:'#fff',text:'#2d1f1a',muted:'#9c7b6e',font:'serif'});
    else if (/fitness|gym|ejercic|deport|muscula|crossfit/i.test(n))
      Object.assign(app, {mode:'dark',accent:'#22c55e',accent2:'#06b6d4',bg:'#101816',card:'#17201d',text:'#f3fff9',muted:'#9bb5aa',font:'sans'});
    else if (/finanz|dinero|negocio|emprender|inversion|crypto/i.test(n))
      Object.assign(app, {mode:'light',accent:'#047857',accent2:'#0f766e',bg:'#eefbf5',card:'#ffffff',text:'#12332a',muted:'#5f7b70',font:'sans'});
    else if (/nutrici|alimentaci|cocina|dieta|receta/i.test(n))
      Object.assign(app, {mode:'light',accent:'#16a34a',accent2:'#15803d',bg:'#f0fdf4',card:'#fff',text:'#1a3a1a',muted:'#6b7c6b',font:'sans'});
    else if (/maternidad|bebe|embaraz|bebé|infantil|niño/i.test(n))
      Object.assign(app, {mode:'light',accent:'#ec4899',accent2:'#f472b6',bg:'#fff5f7',card:'#fff',text:'#3a1a2a',muted:'#9c6b7e',font:'serif'});
  }

  const usesNichePalette = app._fromTemplate || app.category || isKnownNicheTheme(app);
  const explicitTheme = {
    accent: app.primaryColor || (!usesNichePalette ? app.accent : ''),
    accent2: app.secondaryColor || (!usesNichePalette ? app.accent2 : ''),
    bg: !usesNichePalette ? (app.bg || app.bgColor) : '',
    card: !usesNichePalette ? app.card : '',
    text: !usesNichePalette ? app.text : '',
    muted: !usesNichePalette ? app.muted : '',
    mode: !usesNichePalette ? app.mode : '',
    font: !usesNichePalette ? app.font : '',
  };

  if (usesNichePalette) {
    Object.assign(app, getNichePalette(app));
    Object.entries(explicitTheme).forEach(([key, value]) => {
      if (value) app[key] = value;
    });
  } else {
    if (app.primaryColor) app.accent = app.primaryColor;
    if (app.secondaryColor) app.accent2 = app.secondaryColor;
    if (app.bgColor && !app.bg) app.bg = app.bgColor;
  }
  Object.assign(app, resolveAppTheme(app, originalTheme));

  // Apply dynamic theme from niche/product generation
  const root = document.documentElement;
  const setThemeVar = (name, value) => {
    if (!value) return;
    root.style.setProperty(name, value);
    document.body.style.setProperty(name, value);
  };
  if (app.mode === 'light') {
    document.body.setAttribute('data-theme', 'light');
  } else if (app.mode === 'dark') {
    document.body.removeAttribute('data-theme');
  } else if (app.theme === 'light') {
    document.body.setAttribute('data-theme', 'light');
  }
  setThemeVar('--accent', app.accent);
  setThemeVar('--accent2', app.accent2);
  setThemeVar('--bg', app.bg);
  setThemeVar('--card', app.card);
  setThemeVar('--text', app.text);
  setThemeVar('--muted', app.muted);
  // Update btn gradient when accent colors are set
  if (app.accent || app.accent2) {
    const a1 = app.accent  || (app.mode === 'light' ? '#c0635c' : '#2E5BFF');
    const a2 = app.accent2 || (app.mode === 'light' ? '#d4856a' : '#7c3aed');
    setThemeVar('--btn', `linear-gradient(135deg,${a1},${a2})`);
  }
  // Access screen background gradient
  if (app.mode === 'light' && app.bg) {
    // Slightly darker gradient for warmth
    setThemeVar('--access-bg', `linear-gradient(160deg, ${app.bg} 0%, ${app.card||'#fff'} 50%, ${app.bg} 100%)`);
  }
  if (app.font === 'serif') {
    document.body.style.fontFamily = "'Lora', Georgia, serif";
  } else if (app.font === 'sans') {
    document.body.style.fontFamily = "'Plus Jakarta Sans', sans-serif";
  }

  // Access screen
  const accessIconEl = document.getElementById('access-icon');
  accessIconEl.innerHTML = appIconHtml(48, app.types?.[0] || app.type, app.icon);
  document.getElementById('access-title').textContent = app.name;
  document.getElementById('access-desc').textContent = app.description || (app.niche ? `${app.niche}` : 'Aplicación interactiva');
  // White-label: si el creador tiene Elite + white-label activo, ocultar marca Luminous Studio
  const brandSuffix = app.whiteLabel && app.whiteLabelName ? ' | ' + app.whiteLabelName : (app.whiteLabel ? '' : ' | Luminous Studio');
  const brandDesc = app.whiteLabel && app.whiteLabelName ? `Aplicación interactiva de ${app.whiteLabelName}` : 'Aplicación interactiva creada con Luminous Studio';
  document.title = app.name + brandSuffix;
  document.querySelector('meta[property="og:title"]')?.setAttribute('content', app.name + brandSuffix);
  document.querySelector('meta[property="og:description"]')?.setAttribute('content', app.description || brandDesc);
  document.querySelector('meta[name="description"]')?.setAttribute('content', app.description || brandDesc);

  // Footer: si no es white-label, mostrar "Hecho con Luminous Studio".
  // Si es white-label CON marca personalizada â†’ mostrarla. Si es white-label SIN marca â†’ ocultar todo.
  const footer     = document.getElementById('app-footer');
  const footerText = document.getElementById('footer-text');
  if (footer && footerText) {
    if (!app.whiteLabel) {
      footerText.innerHTML = 'Hecho con <a href="https://luminous-studio.com" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-weight:600;">Luminous Studio</a>';
      footer.style.display = 'block';
    } else if (app.whiteLabelName) {
      const logoHtml = app.whiteLabelLogo ? `<img src="${app.whiteLabelLogo}" alt="${app.whiteLabelName}" style="height:18px;vertical-align:middle;margin-right:6px;">` : '';
      footerText.innerHTML = `${logoHtml}<span style="font-weight:600;color:var(--text);">${app.whiteLabelName}</span>`;
      footer.style.display = 'block';
    } else {
      footer.style.display = 'none';
    }
  }
  if (app.accessCodes?.length) {
    document.getElementById('access-code-section').style.display = 'block';
  } else {
    document.getElementById('access-free-btn').style.display = 'block';
  }
  document.getElementById('open-app-btn')?.addEventListener('click', (event) => {
    event.preventDefault();
    enterApp();
  });
  if (getParam('open') === '1' && !app.accessCodes?.length) {
    requestAnimationFrame(() => enterApp());
    setTimeout(() => enterApp(), 350);
    window.addEventListener('load', () => enterApp(), { once:true });
  }

  // Track + usage + white-label en background (no bloquean la pantalla de acceso)
  if (ownerId) {
    (async () => {
      try {
        if (typeof ResponseTracker !== 'undefined') {
          await withTimeout(ResponseTracker.track(ownerId, 'miniapp', id), 2500, 'tracking timeout');
          const usage = await withTimeout(ResponseTracker.getUsageStatus(ownerId), 2500, 'usage timeout');
          if (usage.exceeded) {
            showError('Este contenido está temporalmente pausado. El creador ha alcanzado su límite mensual de visitas.');
            return;
          }
        }
      } catch (_) {}
      try {
        if (typeof DB !== 'undefined') {
          const profile = await withTimeout(DB.profiles.get(ownerId), 2500, 'profile timeout');
          if (profile) {
            app.whiteLabel     = !!profile.white_label;
            app.whiteLabelName = profile.white_label_name || '';
            app.whiteLabelLogo = profile.white_label_logo || '';
            // Update footer with white-label info once loaded
            const footer     = document.getElementById('app-footer');
            const footerText = document.getElementById('footer-text');
            if (footer && footerText) {
              if (app.whiteLabel && app.whiteLabelName) {
                const logoHtml = app.whiteLabelLogo ? `<img src="${app.whiteLabelLogo}" alt="${app.whiteLabelName}" style="height:18px;vertical-align:middle;margin-right:6px;">` : '';
                footerText.innerHTML = `${logoHtml}<span style="font-weight:600;color:var(--text);">${app.whiteLabelName}</span>`;
                footer.style.display = 'block';
              } else if (app.whiteLabel) {
                footer.style.display = 'none';
              }
            }
            // Update page title/meta
            const brandSuffix2 = app.whiteLabelName ? ' | ' + app.whiteLabelName : '';
            if (brandSuffix2) {
              document.title = app.name + brandSuffix2;
              document.querySelector('meta[property="og:title"]')?.setAttribute('content', app.name + brandSuffix2);
            }
          }
        }
      } catch (_) {}
    })();
  }
  } catch (initErr) {
    console.error('[mini-app] init error:', initErr);
    showError('Error al cargar la aplicación. Por favor recarga la página.');
  }
});

function getDemoPreviewApp(id) {
  if (typeof getSkinGlowMiniApp === 'function') {
    const skinGlowApp = getSkinGlowMiniApp(id);
    if (skinGlowApp) return skinGlowApp;
  }
  const base = { id, status:'active', accessCodes:[], _fromTemplate:true, mode:'light', card:'#fff', font:'sans', owner_id:'demo-preview' };
  if (id === 'demo-finanzas-senales') return {
    ...base,
    name:'Mapa Financiero Antifugas', niche:'finanzas personales, ahorro, deudas', category:'Finanzas',

function validateAccess() {
  const code = document.getElementById('access-code-input').value.trim();

    document.getElementById('access-error').style.display = 'none';

  }
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Buenos días';
  if (h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}

function displayAppName(app = currentApp) {
  const raw = cleanText(app?.name || 'Mini-App');
  const normalized = normalizeText(raw);
  if (/learna/i.test(raw) || /aprende.*hablar.*ingles.*90/.test(normalized)) return 'Inglés 90 Pro';
  return raw;
}

function enterApp() {
  if (!currentApp) return;
  try {
    startTextRepairObserver();
    document.getElementById('screen-access').style.display = 'none';
    document.getElementById('screen-app').style.display = 'flex';
    const headerIconEl = document.getElementById('app-header-icon');
    headerIconEl.innerHTML = appIconHtml(20, currentApp.types?.[0] || currentApp.type, currentApp.icon);
    document.getElementById('app-header-name').textContent = displayAppName(currentApp);
    document.getElementById('app-header-greeting').textContent = getGreeting();
    renderApp();
    repairRenderedText(document.getElementById('screen-app'));
  } catch(e) {
    console.error('[mini-app] enter error:', e);
    const access = document.getElementById('screen-access');
    const appScreen = document.getElementById('screen-app');
    if (access) access.style.display = 'none';
    if (appScreen) appScreen.style.display = 'flex';
    document.getElementById('app-content').innerHTML = `<p style="padding:32px;color:#e55;font-size:13px;text-align:center">Error al cargar: ${esc(e.message)}</p>`;
  }
}

function renderApp() {
  const types = getAppTypes(currentApp);
  const content = document.getElementById('app-content');
  const nav = document.getElementById('bottom-nav');
  if (nav) nav.style.display = 'none';
  try {
    if (!types.length) {
      renderSection(content, 'generic');
      return;
    }
    buildTabs(types);
    buildBottomNav(types);
    const initialIdx = initialToolIndex(types);
    if (initialIdx >= 0) showTab(initialIdx);
    else showToday();
  } catch (e) {
    console.warn('[mini-app] render fallback:', e);
    const fallbackType = types[0] || 'generic';
    try {
      renderSection(content, fallbackType);
    } catch (inner) {
      content.innerHTML = `<div style="padding:24px"><p style="color:#e55;font-size:13px">Error al abrir esta mini-app: ${esc(inner.message || e.message)}</p></div>`;
    }
  }
}

function normalizeText(value) {
  return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function normHex(value) {
  const v = String(value || '').trim().toLowerCase();
  return /^#[0-9a-f]{6}$/.test(v) ? v : '';
}

function extractAppTheme(app = {}) {
  return {
    mode: app.mode,
    accent: app.primaryColor || app.accent,
    accent2: app.secondaryColor || app.accent2,
    bg: app.bg || app.bgColor,
    card: app.card,
    text: app.text,
    muted: app.muted,
    font: app.font,
    primaryColor: app.primaryColor,
    secondaryColor: app.secondaryColor,
  };
}

function hasThemeValue(theme = {}) {
  return ['mode', 'accent', 'accent2', 'bg', 'card', 'text', 'muted', 'font']
    .some(key => !!theme[key]);
}

function isLegacyWarmTheme(theme = {}) {
  const accent = normHex(theme.accent);
  const accent2 = normHex(theme.accent2);
  const bg = normHex(theme.bg);
  const text = normHex(theme.text);
  return (
    (accent === '#c0635c' && accent2 === '#d4856a') ||
    (accent === '#c0635c' && bg === '#fdf8f4') ||
    (text === '#2d1f1a' && normHex(theme.muted) === '#9c7b6e')
  );
}

function isDarkHex(value) {
  const hex = normHex(value);
  if (!hex) return false;
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return ((r * 299 + g * 587 + b * 114) / 1000) < 92;
}

function resolveAppTheme(app = {}, originalTheme = extractAppTheme(app)) {
  const palette = getNichePalette(app);
  const fromTemplate = !!(app._fromTemplate || app.category);
  const explicitTheme = originalTheme || {};
  const genericDarkBg = normHex(explicitTheme.bg) === '#0e0e0e';
  const darkBgForLightNiche = palette.mode === 'light' && isDarkHex(explicitTheme.bg);
  const legacyWarm = isLegacyWarmTheme(explicitTheme);

  if (fromTemplate) {
    const origAccent = explicitTheme.primaryColor || explicitTheme.accent;
    const origAccent2 = explicitTheme.secondaryColor || explicitTheme.accent2;
    // If the template has custom colors AND an explicit dark background, preserve the dark theme
    if (origAccent && isDarkHex(explicitTheme.bg)) {
      return {
        mode: 'dark',
        accent: origAccent,
        accent2: origAccent2 || origAccent,
        bg: explicitTheme.bg,
        card: '#1c1c28',
        text: '#f5f5ff',
        muted: '#9898b0',
        font: palette.font || 'sans',
      };
    }
    return {
      ...palette,
      accent: origAccent || palette.accent,
      accent2: origAccent2 || palette.accent2,
      bg: (genericDarkBg || darkBgForLightNiche) ? palette.bg : (explicitTheme.bg || palette.bg),
    };
  }

  if (isKnownNicheTheme(app)) {
    return palette;
  }

  if (hasThemeValue(explicitTheme) && !legacyWarm) {
    return {
      ...palette,
      ...Object.fromEntries(
        Object.entries(explicitTheme).filter(([key, value]) =>
          value && key !== 'primaryColor' && key !== 'secondaryColor'
        )
      ),
      accent: explicitTheme.accent || palette.accent,
      accent2: explicitTheme.accent2 || palette.accent2,
      bg: (genericDarkBg || darkBgForLightNiche) ? palette.bg : (explicitTheme.bg || palette.bg),
    };
  }

  return palette;
}

function buildTabs(types) {
  const tabsWrap = document.getElementById('top-tabs');
  tabsWrap.style.display = 'block';
  const inner = tabsWrap.querySelector('div');
  inner.innerHTML = types.map((t, i) => `
    <button class="tab-btn ${i===0?'active':''}" onclick="showTab(${i})" id="tab-btn-${i}">
      <span>${typeIcon(t)}</span><span>${typeLabel(t)}</span>
    </button>`).join('');
}

function buildBottomNav(types) {
  const nav = document.getElementById('bottom-nav');
  if (!nav) return;
  const usableTypes = (types || []).filter(Boolean);
  if (!usableTypes.length) {
    nav.style.display = 'none';
    nav.innerHTML = '';
    return;
  }
  const items = [
    { key:'today', label:'Hoy', icon:'local_florist', action:'showToday()' },
    ...usableTypes.map((type, idx) => ({
      key:`type-${idx}`,
      label: navShortLabel(type),
      icon: TYPE_MS_ICONS[type] || 'deployed_code',
      action:`showTab(${idx})`
    })),
    { key:'records', label:'Registros', icon:'receipt_long', action:'showRecords()' }
  ];
  const navRows = items.length > 6 ? 2 : 1;
  nav.style.setProperty('--nav-count', String(items.length));
  nav.style.setProperty('--nav-cols', String(navRows === 2 ? Math.ceil(items.length / 2) : items.length));
  nav.style.display = 'grid';
  nav.innerHTML = items.map(item => `
    <button class="bottom-nav-btn ${item.key==='today'?'active':''}" data-nav="${item.key}" onclick="${item.action}">
      <span class="material-symbols-outlined">${item.icon}</span>
      <span>${esc(item.label)}</span>
    </button>
  `).join('');
}

function setActiveNav(key) {
  document.querySelectorAll('.bottom-nav-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.nav === key));
}

function navShortLabel(type) {
  if (isEnglishLearningApp(currentApp)) {
    return ({
      simulador:'Role',
      roadmap:'Ruta',
      chatbot:'Tutor',
      diagnostico:'Nivel',
      flashcards:'Cards',
      glosario:'Guía',
      planificador:'Plan',
      comparador:'Comparar',
      reto:'Reto',
      diario:'Diario',
      faq:'FAQ'
    })[type] || typeLabel(type);
  }
  return ({
    'skin-scan':'Foto', devocional:'Reflex', checklist:'Lista', tracker:'Track', reto:'Reto', diario:'Diario',
    calculadora:'Calc', planificador:'Plan', generador:'IA', chatbot:'Chat',
    comparador:'Comparar', diagnostico:'Test', roadmap:'Ruta', faq:'FAQ',
    glosario:'Guía', flashcards:'Cards', biblioteca:'Recursos',
    afirmaciones:'Frases', meditacion:'Meditar', bodymap:'Mapa', simulador:'Simular'
  })[type] || typeLabel(type);
}

function getPrimaryActionType(types) {
  const priority = ['bodymap','diagnostico','reto','diario','checklist','tracker','meditacion','chatbot','generador','roadmap'];
  return priority.find(t => types.includes(t)) || types[0];
}

function getSignalProfile(app = currentApp) {
  const text = nicheText(app);
  // Spiritual always takes priority — meditacion espiritual should NOT get body engine
  if (/fe\b|espirit|biblia|oraci|devocional|dios|cristi|manifestacion/.test(text)) {
    return SIGNAL_NICHE_PROFILES.find(profile => profile.id === 'spiritual') || null;
  }
  // Fast-path for clear emotional/body keywords so they don't fall through to learning/nutrition
  if (/emocion|emocional|ansiedad|estres|calma|regulacion|nervioso|somatic|somatico|bienestar|sueno|insomnio|descanso|autoestima|mindful|burnout|tdah|mental|ruptura|gratitud/.test(text)) {
    return SIGNAL_NICHE_PROFILES.find(profile => profile.id === 'emotional') || null;
  }
  return SIGNAL_NICHE_PROFILES.find(profile => profile.test.test(text)) || null;
}

function hasBodyMapExperience(app = currentApp) {
  if (app.disableSignalMap === true || app.disableBodyMapToday === true) return false;
  const signals = app.bodySignals || app.content?.bodySignals || [];
  if (Array.isArray(signals) && signals.length) return true;
  const types = getAppTypes(app);
  if (types.includes('bodymap')) return true;
  if (getSignalProfile(app)) return true;
  return /cuerpo|somatic|somatico|dolor|ansiedad|ciclo|piel|emocion|tension|calma|bienestar|salud|fitness|yoga|respira|medita|burnout|estres|autoestima/.test(
    normalizeText(`${app.name || ''} ${app.niche || ''} ${app.category || ''} ${app.description || ''}`)
  );
}

function isSomaticNiche(app = currentApp) {
  const text = normalizeText(`${app.name || ''} ${app.niche || ''} ${app.category || ''} ${app.description || ''}`);
  if (isPetNiche(app)) return true;
  // Spiritual apps never trigger somatic/body engine even if they mention meditacion
  if (/fe\b|espirit|biblia|oraci|devocional|dios|cristi|manifestacion/.test(text)) return false;
  if (/finanz|dinero|deuda|ahorr|inversion|presupuesto|trading|cripto|negocio|marketing|venta|copy|email|seo|freelance|emprend|lanzamiento|contenido|educaci|estudio|ingles|programacion|lectura|curso|aprendiz|relacion|pareja|crianza|embarazo|comunicacion|familia|amor|ruptura|belleza|skincare|colorimetria|armario|cabello/.test(text)) {
    return /cuerpo|dolor fisico|tension corporal|respiracion|somatic|somatico|salud fisica|fitness|yoga|piel/.test(text);
  }
  return /cuerpo|somatic|somatico|dolor|ansiedad|ciclo|piel|tension|calma|bienestar|salud|fitness|yoga|respira|medita|burnout|estres/.test(text);
}

    all: normalizeText(`${app?.name || ''} ${app?.niche || ''} ${app?.category || ''} ${app?.subcategory || ''} ${app?.description || ''}`)
  };
}

function getForcedPetMapType(app = currentApp) {
  const text = getPetTextParts(app);
  const primaryDog = /adiestr|entrenamiento|canino|perro|cachorro/.test(text.primary);
  const primaryCat = /felino|gato/.test(text.primary);
  const primaryRabbit = /conejo|rabbit/.test(text.primary);
  if (primaryRabbit && !primaryDog && !primaryCat) return 'rabbit';
  if (primaryDog && !primaryCat && !primaryRabbit) return 'dog';
  if (primaryCat && !primaryDog && !primaryRabbit) return 'cat';
  if (/adiestr|entrenamiento canino|canino/.test(text.all)) return 'dog';
  if (/felino/.test(text.all)) return 'cat';
  if (/conejo|rabbit/.test(text.all) && !/perro|gato|canino|felino/.test(text.all)) return 'rabbit';
  return null;
}

function getPetMapOptions() {
  const forced = getForcedPetMapType();
  if (forced) return [forced];
  return ['dog', 'cat', 'rabbit'];
}

function getPetMapType() {
  const forced = getForcedPetMapType();
  if (forced) return forced;
  const text = getPetTextParts().all;
  const saved = localStorage.getItem(`pet_map_type_${currentApp?.id || 'default'}`);
  if (['dog','cat','rabbit'].includes(saved)) return saved;
  if (/perro|cachorro/.test(text)) return 'dog';
  if (/gato/.test(text)) return 'cat';
  return 'dog';
}

function signalIdFromLabel(label, idx) {
  const base = normalizeText(label || `senal-${idx + 1}`).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return base || `senal-${idx + 1}`;
}

function normalizeSignals(signals = []) {
  const xs = [50, 30, 70, 30, 70, 50, 50, 18, 82];
  const ys = [16, 34, 34, 56, 56, 74, 44, 44, 44];
  return signals.map((signal, idx) => {
    const label = signal.label || signal.title || signal.name || `Señal ${idx + 1}`;
    return {
      ...signal,
      id: signal.id || signalIdFromLabel(label, idx),
      label,
      x: Number.isFinite(Number(signal.x)) ? Number(signal.x) : xs[idx % xs.length],
      y: Number.isFinite(Number(signal.y)) ? Number(signal.y) : ys[idx % ys.length],
      icon: signal.icon || ['psychology','task_alt','monitoring','edit_note','flag','hub'][idx % 6],
    };
  });
}

function isWellnessApp(app = currentApp) {
  if (isPetNiche(app) || isEnglishLearningApp(app)) return false;
  const cat = normalizeText(app?.category || '');
  const RICH_CATS = ['bienestar','fitness','deporte','salud','nutricion',
                     'finanzas','negocio','emprendimiento','marketing','productividad',
                     'educacion','idiomas','desarrollo personal'];
  if (RICH_CATS.includes(cat)) return true;
  const hasReto     = Array.isArray(app.retoContent    || app.content?.retoContent)    && (app.retoContent    || app.content?.retoContent).length > 0;
  const hasRoadmap  = Array.isArray(app.roadmapSteps   || app.content?.roadmapSteps)   && (app.roadmapSteps   || app.content?.roadmapSteps).length > 0;
  const hasTracker  = !!(app.trackerHabit || app.content?.trackerHabit);
  const hasAff      = Array.isArray(app.affirmations   || app.content?.affirmations)   && (app.affirmations   || app.content?.affirmations).length  > 0;
  const hasMed      = !!(app.meditationScript || app.content?.meditationScript);
  const hasPlan     = Array.isArray(app.initialTasks   || app.content?.initialTasks)   && (app.initialTasks   || app.content?.initialTasks).length  > 0;
  return hasReto || hasRoadmap || hasTracker || hasPlan || (hasAff && hasMed);
}

    planTasks = raw ? JSON.parse(raw) : seedTasks.map(t => ({text: t, done: false}));
  } catch { planTasks = seedTasks.map(t => ({text: t, done: false})); }
  if (!planTasks.length && seedTasks.length) planTasks = seedTasks.map(t => ({text: t, done: false}));
  const planDone    = planTasks.filter(t => t.done).length;
  const todayPlanTask = planTasks.find(t => !t.done) || null;
  const planIdx     = types.indexOf('planificador');

  // Tracker streak
  let streak = 0;
  try { streak = Number(JSON.parse(localStorage.getItem(`streak_${app.id}`) || '0')); } catch {}

  // Random affirmation
  const randAff = affArr.length ? affArr[Math.floor(Date.now() / 86400000) % affArr.length] : null;

  // Progress values
  const pct = isFitnessMode
    ? Math.round(roadmapCompleted / Math.max(1, roadmapArr.length) * 100)
    : isPlanMode
      ? Math.round(planDone / Math.max(1, planTasks.length) * 100)
      : Math.round(retoDone / Math.max(1, retoDays) * 100);

  // Hero pills (max 2)
  let pills;
  if (isFitnessMode) {
    pills = [
      roadmapArr.length ? `${msIcon('route',14)} Plan de ${roadmapArr.length} pasos` : null,
      trackerHabit      ? `${msIcon('fitness_center',14)} Tracker diario` : null,
      types.length > 1  ? `${msIcon('auto_awesome',14)} ${types.length} herramientas` : null,
    ].filter(Boolean).slice(0, 2);
  } else if (isPlanMode) {
    pills = [
      planTasks.length ? `${msIcon('checklist',14)} ${planTasks.length} pasos del plan` : null,
      types.length > 1 ? `${msIcon('auto_awesome',14)} ${types.length} herramientas` : null,
    ].filter(Boolean).slice(0, 2);
  } else {
    pills = [
      retoDays      ? `${msIcon('local_fire_department',14)} Reto de ${retoDays} días` : null,
      meditSrc      ? `${msIcon('self_improvement',14)} Meditación guiada` : null,
      affArr.length ? `${msIcon('brightness_7',14)} ${affArr.length} afirmaciones` : null,
      types.length > 1 ? `${msIcon('auto_awesome',14)} ${types.length} herramientas` : null,
    ].filter(Boolean).slice(0, 2);
  }

  // Metrics row
  let metric1, metric2, metric3;
  if (isFitnessMode) {
    metric1 = { val: `${roadmapCompleted}/${roadmapArr.length}`, label: 'pasos' };
    metric2 = { val: streak || trackerIdx >= 0 ? `${streak}` : types.length, label: streak || trackerIdx >= 0 ? 'días racha' : 'herramientas' };
    metric3 = { val: `${pct}%`, label: 'progreso' };
  } else if (isPlanMode) {
    metric1 = { val: `${planDone}/${planTasks.length}`, label: 'tareas' };
    metric2 = { val: types.length, label: 'herramientas' };
    metric3 = { val: `${pct}%`, label: 'progreso' };
  } else {
    metric1 = { val: retoDone, label: 'días listos' };
    metric2 = { val: types.length, label: 'herramientas' };
    metric3 = { val: `${pct}%`, label: 'progreso' };
  }

  // Quick section cards (up to 4)
  const quickTypes = types.filter(t => !['bodymap','skin-scan','quiz-embed'].includes(t)).slice(0, 4);
  const quickCards = quickTypes.map((type) => {
    const col = WELLNESS_QUICK_COLORS[type] || '#7c3aed';
    const idx = types.indexOf(type);
    const countLabel = (type === 'reto' && retoDays)              ? `${retoDone}/${retoDays}` :
                       (type === 'roadmap' && roadmapArr.length)   ? `${roadmapCompleted}/${roadmapArr.length}` :
                       (type === 'planificador' && planTasks.length) ? `${planDone}/${planTasks.length}` :
                       (type === 'afirmaciones' && affArr.length)  ? `${affArr.length}` :
                       (type === 'flashcards' && (app.cards||app.content?.cards||[]).length) ? `${(app.cards||app.content?.cards||[]).length}` : '';
    return `
      <button type="button" class="well-quick-card" onclick="showTab(${idx})">
        <div class="well-quick-top" style="background:linear-gradient(135deg,${col},color-mix(in srgb,${col} 58%,#080618))">
          ${msIcon(TYPE_MS_ICONS[type] || 'deployed_code', 38)}
          ${countLabel ? `<span class="well-quick-count">${esc(countLabel)}</span>` : ''}
        </div>
        <div class="well-quick-body">
          <strong>${esc(typeLabel(type))}</strong>
          <span>${esc(toolDescription(type))}</span>
        </div>
      </button>`;
  }).join('');

  // Today card — reto OR roadmap step
  let todayCard = '';
  if (todayReto) {
    todayCard = `
    <div class="well-section-head">
      <h2>Tu práctica de hoy</h2>
      ${retoIdx >= 0 ? `<button type="button" onclick="showTab(${retoIdx})">Ver todo</button>` : ''}

      <div class="well-today-kicker">${msIcon('local_fire_department',13)} ${retoArr.length > 1 ? `Día ${currentRetoDay} de ${retoDays}` : 'Práctica de hoy'}</div>
      <div class="well-today-title">${esc(todayReto.title || 'Práctica de hoy')}</div>

      <div class="well-progress-bar"><div class="well-progress-fill" style="width:${pct}%"></div></div>
      <p style="font-size:11px;color:var(--muted);margin-top:6px;font-weight:700">${retoDone} de ${retoDays} días completados · ${pct}%</p>
      <button class="btn-primary" type="button" onclick="showTab(${retoIdx >= 0 ? retoIdx : primaryIdx})" style="margin-top:14px;border-radius:14px">${msIcon('play_arrow',18)} Comenzar práctica</button>
    </div>`;
  } else if (currentRoadmapStep) {
    const stepNum = currentRoadmapIdx >= 0 ? currentRoadmapIdx + 1 : roadmapArr.length;
    const stepDesc = currentRoadmapStep.description || currentRoadmapStep.desc || '';
    todayCard = `
    <div class="well-section-head">
      <h2>Tu práctica de hoy</h2>
      ${roadmapIdx >= 0 ? `<button type="button" onclick="showTab(${roadmapIdx})">Ver plan</button>` : ''}
    </div>
    <div class="well-today-card">
      <div class="well-today-kicker">${msIcon('route',13)} Paso ${stepNum} de ${roadmapArr.length}</div>
      <div class="well-today-title">${esc(currentRoadmapStep.title || currentRoadmapStep.name || `Paso ${stepNum}`)}</div>
      <div class="well-today-desc">${esc(stepDesc.slice(0, 140))}${stepDesc.length > 140 ? '…' : ''}</div>
      <div class="well-progress-bar"><div class="well-progress-fill" style="width:${pct}%"></div></div>
      <p style="font-size:11px;color:var(--muted);margin-top:6px;font-weight:700">${roadmapCompleted} de ${roadmapArr.length} pasos completados · ${pct}%</p>
      <button class="btn-primary" type="button" onclick="showTab(${roadmapIdx >= 0 ? roadmapIdx : primaryIdx})" style="margin-top:14px;border-radius:14px">${msIcon('play_arrow',18)} Ir al plan</button>
    </div>`;
  } else if (todayPlanTask) {
    const taskNum = planTasks.indexOf(todayPlanTask) + 1;
    todayCard = `
    <div class="well-section-head">
      <h2>Tu tarea de hoy</h2>
      ${planIdx >= 0 ? `<button type="button" onclick="showTab(${planIdx})">Ver todas</button>` : ''}
    </div>
    <div class="well-today-card">
      <div class="well-today-kicker">${msIcon('checklist',13)} Tarea ${taskNum} de ${planTasks.length}</div>
      <div class="well-today-title">${esc(todayPlanTask.text || 'Próxima tarea')}</div>
      <div class="well-progress-bar" style="margin-top:14px"><div class="well-progress-fill" style="width:${pct}%"></div></div>
      <p style="font-size:11px;color:var(--muted);margin-top:6px;font-weight:700">${planDone} de ${planTasks.length} tareas completadas · ${pct}%</p>
      <button class="btn-primary" type="button" onclick="showTab(${planIdx >= 0 ? planIdx : primaryIdx})" style="margin-top:14px;border-radius:14px">${msIcon('play_arrow',18)} Ir al plan</button>
    </div>`;
  }

  const trackerCard = (isFitnessMode && trackerHabit && trackerIdx >= 0) ? `

    <button type="button" class="tool-card" onclick="showTab(${trackerIdx})">

        <span class="tool-sub">${streak > 0 ? `${streak} días de racha` : 'Registra tu entrenamiento de hoy'}</span>
      </span>
      <span class="material-symbols-outlined tool-arrow">arrow_forward</span>
    </button>` : '';

  // Affirmation strip
  const affCard = randAff ? `
    <div class="well-section-head">
      <h2>Afirmación de hoy</h2>
      ${affIdx >= 0 ? `<button type="button" onclick="showTab(${affIdx})">Ver todas</button>` : ''}
    </div>
    <div class="well-aff-strip">
      <div class="well-aff-text">"${esc(randAff)}"</div>
      ${affIdx >= 0 ? `<button class="btn-secondary" type="button" onclick="startVoice(${JSON.stringify(randAff)},null)" style="width:auto;padding:8px 14px;border-radius:999px;font-size:12px">${msIcon('volume_up',14)} Escuchar</button>` : ''}
    </div>` : '';

  // Meditation shortcut
  const medCard = (meditSrc && medIdx >= 0) ? `

    <button type="button" class="tool-card" onclick="showTab(${medIdx})">

      <span style="flex:1">

        <span class="tool-sub">Pausa de ${Math.ceil(meditSrc.split(' ').length / 120)} min para reconectar</span>
      </span>
      <span class="material-symbols-outlined tool-arrow">arrow_forward</span>
    </button>` : '';

  const defaultDesc = isFitnessMode ? 'Tu plan de entrenamiento progresivo.'

                    : 'Tu espacio de bienestar diario.';

  content.innerHTML = `

  content.scrollTop = 0;
}

function bodyEngineZonePosition(signal, index) {
  const key = `${signal?.id || ''} ${signal?.label || ''} ${signal?.title || ''}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (isPetNiche()) {
    const petType = getPetMapType();
    const petNamed = [
      [/oreja|oido|audicion/, petType === 'rabbit' ? [31, 25] : [20, 30]],
      [/cabeza|hocico|ojo|nariz|animo|alerta/, petType === 'rabbit' ? [25, 48] : [16, 42]],
      [/pecho|respir|corazon|energia/, petType === 'rabbit' ? [42, 51] : [42, 45]],
      [/abdomen|vientre|estomago|digest|barriga/, petType === 'rabbit' ? [58, 58] : [57, 56]],
      [/pata|pierna|cojera|movimiento|apoyo|almohadilla/, petType === 'rabbit' ? [61, 78] : [58, 80]],
      [/cola|postura|lenguaje/, petType === 'rabbit' ? [82, 55] : [87, 42]],
      [/lomo|espalda|piel/, petType === 'rabbit' ? [59, 38] : [56, 34]]
    ];
    const petMatch = petNamed.find(([rx]) => rx.test(key));
    if (petMatch) return petMatch[1];
    if (Number.isFinite(Number(signal?.x)) && Number.isFinite(Number(signal?.y))) return [Math.max(8, Math.min(92, Number(signal.x))), Math.max(12, Math.min(88, Number(signal.y)))];
    return (petType === 'rabbit'
      ? [[25,48],[31,25],[42,51],[58,58],[61,78],[82,55]]
      : [[16,42],[20,30],[42,45],[57,56],[58,80],[87,42]])[index] || [55,50];
  }
  const named = [
    [/cabeza|mente|migra|frente|craneo|ruido/, [50, 10.5]],
    [/garganta|cuello|voz|nuca/, [50, 17]],
    [/pecho|corazon|respir|torax|pector/, [50, 26.5]],
    [/hombro|hombros|carga/, [27, 23.5]],
    [/brazo|bicep|codo|mano|muneca/, [22, 35]],
    [/vientre|abdomen|estomago|digest|intestin/, [50, 41.5]],
    [/pelvis|cadera|sexual|utero|seguridad/, [50, 56.5]],
    [/espalda|lumbar|columna|dorsal/, [50, 34]],
    [/glute|sacro/, [50, 60]],
    [/pierna|muslo|rodilla/, [38, 77]],
    [/pantorrilla|tobillo|pie|pies/, [38, 90]]
  ];
  const match = named.find(([rx]) => rx.test(key));
  if (match) return match[1];
  if (Number.isFinite(Number(signal?.x)) && Number.isFinite(Number(signal?.y))) {
    return [
      Math.max(18, Math.min(82, Number(signal.x))),
      Math.max(8, Math.min(92, Number(signal.y) * 0.95))
    ];
  }
  return [[50,10.5],[50,17],[50,26.5],[27,23.5],[50,41.5],[50,56.5],[50,34],[38,77]][index] || [50, 42];
}

function bindSignalMap() {
  const root = document.querySelector('.bodymap-card');
  if (!root) return;
  root.querySelectorAll('[data-signal-id]').forEach(btn => {
    btn.addEventListener('click', () => selectBodySignal(btn.dataset.signalId));
  });
  const first = getBodySignals()[0];
  if (first) setTimeout(() => selectBodySignal(first.id, false), 0);
}

function selectBodySignal(id, focusSheet = true) {
  const signals = getBodySignals();
  const signal = signals.find(s => String(s.id) === String(id)) || signals[0];
  document.querySelectorAll('[data-signal-id]').forEach(btn => btn.classList.toggle('active', String(btn.dataset.signalId) === String(signal?.id || id)));
  const sheet = document.getElementById('signal-sheet');
  if (!sheet || !signal) return;
  sheet.classList.add('open');
  sheet.innerHTML = signalSheetMarkup(signal);
  repairRenderedText(sheet);
  if (focusSheet) sheet.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

      const rabbitGuides = [

        { rx:/cabeza|hocico|ojo|nariz|animo|alerta/, zone:'Cabeza', sensation:['Mirada','Secrecion','Dientes'], emotion:['Alerta','Dolor','Incomodidad'], message:'La cabeza del conejo ayuda a leer ojos, nariz, dientes y animo. Cambios en secrecion, rechinar fuerte de dientes o cabeza ladeada son datos importantes.', reflections:['Hay lagrimeo, moco o cabeza ladeada?','Rechina dientes como dolor, no como ronroneo suave?','Esta mas escondido o menos curioso?'], repairs:{n1:'Observa ojos, nariz, dientes visibles y respuesta al entorno durante 2 minutos.',n2:'Anota comida reciente, heno, agua, cama y cualquier cambio de rutina.',n3:'Si hay cabeza ladeada, no come, dolor o secrecion marcada, contacta al veterinario.'}},

function pickBodyChoice(group, value, btn) {

  wrap.querySelectorAll(`[data-body-group="${group}"]`).forEach(el => el.classList.remove('active'));

  wrap.dataset[group] = value;

function saveBodySignal(id) {
  const signal = getBodySignals().find(s => String(s.id) === String(id));
  const guide = bodySignalGuide(signal);
  const flow = Array.from(document.querySelectorAll('[data-body-flow]')).find(el => String(el.dataset.signalId) === String(id || ''));
  const note = document.getElementById('signal-note')?.value || '';
  const key = `body_records_${currentApp.id}`;
  let records = [];
  try { records = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
  records.unshift({
    id,
    label: signal?.label || id,
    zone: guide.zone,
    sensation: flow?.dataset?.sensation || '',
    intensity: flow?.dataset?.intensity || '',
    emotion: flow?.dataset?.emotion || '',
    note,
    message: guide.message,
    repair: guide.repairs?.n1 || signal?.practice || '',
    at: new Date().toISOString()
  });
  localStorage.setItem(key, JSON.stringify(records.slice(0, 50)));
  showToast('Registro guardado');
}

function getBodyDictionaryEntries() {

    seen.add(key);
    return { signal, guide };

function showMeditationList() {
  stopVoice();
  const types = getAppTypes(currentApp);
  const idx = types.indexOf('meditacion');

  else renderMeditacion(document.getElementById('app-content'));

function togglePracticeVoice(idx) {
  const item = (window._practiceVoiceItems || getPracticeItems())[idx];
  const script = item?.script || item?.text || currentApp.meditationScript || '';
  const btn = document.getElementById('practice-voice-btn');
  const status = document.getElementById('practice-speaking');
  if (!_voiceStopped) {
    stopVoice();
    if (status) status.style.display = 'none';
    if (btn) btn.innerHTML = msIcon('play_arrow',18) + ' Escuchar guía';
    return;
  }
  if (!script.trim()) {
    showToast('No hay guion de audio para esta práctica', 'error');
    return;
  }
  if (status) status.style.display = 'flex';
  if (btn) btn.innerHTML = msIcon('stop',18) + ' Detener audio';
  startVoice(script, () => {
    if (status) status.style.display = 'none';
    if (btn) btn.innerHTML = msIcon('play_arrow',18) + ' Escuchar guía';
  });
}

function getAppTypes(app = currentApp) {
  const base = (app?.types?.length ? app.types : [app?.type]).filter(Boolean);

  if (app?.id === 'skinglow-miniapp' && !types.includes('skin-scan')) {

  if (isEnglishLearningApp(app)) {

  return types;
}

function getEnglishCardsForApp(app = currentApp) {
  const configured = Array.isArray(app.cards || app.content?.cards) ? (app.cards || app.content?.cards) : [];
  const sceneCards = getEnglishRoleplayScenes(app).map(scene => ({
    front: `Role-play: ${scene.title}`,
    back: scene.starter || scene.objective || scene.prompt || 'Practica esta escena con una pregunta por turno.'
  }));
  const all = [...configured, ...getDefaultEnglishCards(), ...sceneCards];
  const seen = new Set();
  return all.filter(card => {
    const front = String(card?.front || card || '').trim();
    const key = normalizeText(front);
    if (!front || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function readableText(value, fallback = '') {
  if (value === null || value === undefined || value === '') return fallback;
  if (typeof value === 'string' || typeof value === 'number') {
    const text = String(value);
    return /^\s*\[object Object\]\s*$/.test(text) ? fallback : text;
  }
  if (Array.isArray(value)) return value.map(item => readableText(item, '')).filter(Boolean).join(', ') || fallback;
  if (typeof value === 'object') {
    const direct = readableText(value.title ?? value.name ?? value.label ?? value.text ?? value.value ?? value.description ?? value.desc, '');
    if (direct) return direct;
    for (const child of Object.values(value)) {
      const nested = readableText(child, '');
      if (nested) return nested;
    }
    return fallback;
  }
  return fallback;
}

  return source.map((item, i) => {
    const fallback = defaults[i % defaults.length];
    if (typeof item === 'string') return { ...fallback, title:item, description:fallback.description };
    return {
      ...fallback,
      ...item,
      title:readableText(item.title ?? item.name, fallback.title),
      description:readableText(item.description ?? item.desc ?? item.instructions, fallback.description),
      phrases:Array.isArray(item.phrases) && item.phrases.length ? item.phrases.map(p => readableText(p)).filter(Boolean) : fallback.phrases,
      practice:readableText(item.practice ?? item.exercise, fallback.practice)

  });

function getAppProgressSummary(types) {
  const id = currentApp?.id || 'demo';
  let completed = 0;
  let total = 0;
  if (types.includes('checklist')) {
    const items = currentApp.initialItems || currentApp.content?.initialItems || [];
    let storedItems = [];
    try { storedItems = JSON.parse(localStorage.getItem(`checklist_${id}`) || '[]'); } catch {}
    if (Array.isArray(storedItems) && storedItems.length) {
      total += storedItems.length;
      completed += storedItems.filter(item => item && item.done).length;
    } else {
      total += items.length;
      completed += items.filter((_, i) => localStorage.getItem(`check_${id}_${i}`) === '1').length;
    }
  }
  if (types.includes('reto')) {
    const days = currentApp.retoContent || currentApp.content?.retoContent || [];
    let retoDone = {};
    try { retoDone = JSON.parse(localStorage.getItem(`reto_${id}`) || '{}'); } catch {}
    total += days.length;
    completed += Object.values(retoDone).filter(Boolean).length;
  }
  if (types.includes('tracker')) {
    let tracker = {};
    try { tracker = JSON.parse(localStorage.getItem(`tracker_${id}`) || '{}'); } catch {}
    const checked = Array.isArray(tracker.checked) ? tracker.checked.length : 0;
    total += currentApp.trackerDays || 0;
    completed += checked;
  }
  if (types.includes('skin-scan')) {
    let scans = [];
    try { scans = JSON.parse(localStorage.getItem(`skin_scan_${id}`) || '[]'); } catch {}
    total += 1;
    completed += scans.length ? 1 : 0;
  }
  if (!total) return { completed:0, total:0, label:'Listo para empezar' };
  return { completed, total, label:`${completed}/${total} completado` };
}

function scoreTextForQuery(text, query) {
  const haystack = normalizeText(text);
  const words = normalizeText(query).split(/\s+/).filter(w => w.length > 3);
  return words.reduce((score, word) => score + (haystack.includes(word) ? 1 : 0), 0);
}

function getRelevantAppSnippets(app = {}, query = '', limit = 5) {
  const snippets = [];
  const add = (label, text) => {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (clean) snippets.push({ text: label ? `${label}: ${clean}` : clean, score: scoreTextForQuery(clean, query) });
  };

  (app.faqItems || []).forEach(item => add(item.q, item.a));
  (app.glossaryTerms || []).forEach(item => add(item.term, item.def));
  (app.retoContent || []).forEach(item => add(item.title, item.instructions || item.reflectionPrompt));
  (app.cards || []).forEach(item => add(item.front, item.back));
  (app.roadmapSteps || []).forEach(step => add('Paso sugerido', typeof step === 'string' ? step : [step.title, step.description].filter(Boolean).join(' - ')));
  (app.roleplayScenes || []).forEach(item => add(item.title, item.objective || item.prompt || item.starter));
  (app.initialItems || []).forEach(item => add('Checklist', item));
  (app.journalPrompts || []).forEach(item => add('Reflexion', item));
  (app.affirmations || []).forEach(item => add('Afirmacion', item));
  (app.calcFields || []).forEach(item => add('Dato importante', `${item.label || item.id}${item.placeholder ? ` (${item.placeholder})` : ''}`));
  add('Habito a seguir', app.trackerHabit);
  add('Contexto', app.generatorPrompt || app.chatbotSystemPrompt || app.description || app.niche);

  return snippets
    .sort((a, b) => b.score - a.score)
    .slice(0, limit)
    .map(item => item.text);
}
