<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mini-App | Luminous Studio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="./app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#2E5BFF", "primary-dim": "#3867fb", "secondary": "#69f6b8",
          "surface": "#0e0e0e", "surface-container-low": "#131313",
          "surface-container": "#1a1a1a", "surface-container-high": "#20201f",
          "surface-container-highest": "#262626", "on-surface": "#ffffff",
          "on-surface-variant": "#adaaaa", "outline-variant": "#484847",
          "error": "#ff6e84",
        },
        fontFamily: { "sans": ["Plus Jakarta Sans"] },
        borderRadius: { "DEFAULT": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
      },
    },
  }
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .fade-in { animation: fadeIn .35s cubic-bezier(.16,1,.3,1); }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .check-item input:checked ~ label { text-decoration: line-through; opacity: .5; }

  /* Gradient utilities */
  .grad-primary { background: linear-gradient(135deg,#2E5BFF,#7c3aed); }
  .grad-green   { background: linear-gradient(135deg,#069e5c,#69f6b8); }
  .grad-orange  { background: linear-gradient(135deg,#f97316,#fbbf24); }
  .grad-pink    { background: linear-gradient(135deg,#ec4899,#a855f7); }
  .grad-teal    { background: linear-gradient(135deg,#0891b2,#22d3ee); }

  /* Stat card */
  .stat-pill { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:14px 10px; text-align:center; }

  /* Progress ring */
  .progress-bar-glow { box-shadow: 0 0 10px rgba(46,91,255,0.5); }

  /* Premium card */
  .pcard { background:#1a1a1a; border:1px solid rgba(255,255,255,0.06); border-radius:16px; }
  .pcard-glow { background:linear-gradient(135deg,rgba(46,91,255,0.08),rgba(124,58,237,0.04)); border:1px solid rgba(46,91,255,0.15); border-radius:16px; }

  /* Smooth toggle */
  .day-btn { transition: all .15s ease; }
  .day-btn.done { background:linear-gradient(135deg,#2E5BFF,#7c3aed); color:#fff; box-shadow:0 2px 8px rgba(46,91,255,0.35); }
  .day-btn.today:not(.done) { background:rgba(46,91,255,0.15); border:1px solid rgba(46,91,255,0.4); color:#7c9fff; }

  /* Flip card */
  .card-face { transition: transform .4s ease, box-shadow .2s; }
  .card-face:hover { box-shadow: 0 8px 24px rgba(46,91,255,0.2); }

  /* Chat bubbles */
  .bubble-bot { background:#1e1e2e; border:1px solid rgba(255,255,255,0.06); }
  .bubble-user { background:linear-gradient(135deg,#2E5BFF,#7c3aed); color:#fff; }

  /* Section header accent */
  .sec-accent { width:3px; height:20px; border-radius:2px; flex-shrink:0; }

  /* Scrollbar */
  ::-webkit-scrollbar { width:3px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#333; border-radius:4px; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen">

<!-- ACCESS SCREEN -->
<div id="screen-access" class="min-h-screen flex items-center justify-center px-4" style="background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(46,91,255,0.12) 0%,transparent 70%)">
  <div class="w-full max-w-sm text-center fade-in">
    <!-- Icon with glow -->
    <div class="relative inline-flex mb-5">
      <div id="access-icon" class="text-6xl w-24 h-24 flex items-center justify-center rounded-3xl grad-primary shadow-2xl" style="box-shadow:0 16px 48px rgba(46,91,255,0.4)">⚡</div>
    </div>
    <h1 id="access-title" class="text-2xl font-extrabold tracking-tight mb-2">Mini-App</h1>
    <p id="access-desc" class="text-on-surface-variant text-sm mb-8 leading-relaxed">Cargando...</p>

    <div id="access-code-section" class="hidden">
      <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-3">Código de acceso</label>
      <input id="access-code-input" type="text" placeholder="Ingresa tu código..."
        class="w-full bg-surface-container border border-outline-variant/30 rounded-2xl px-4 py-3.5 text-center text-sm font-bold focus:ring-2 focus:ring-primary outline-none transition mb-3"/>
      <button onclick="validateAccess()"
        class="w-full py-3.5 grad-primary text-white font-extrabold rounded-2xl hover:opacity-90 transition-opacity shadow-lg" style="box-shadow:0 8px 24px rgba(46,91,255,0.35)">
        Ingresar →
      </button>
      <p id="access-error" class="text-error text-xs mt-2 hidden">Código incorrecto. Verifica con quien te compartió el acceso.</p>
    </div>

    <div id="access-free-btn" class="hidden">
      <button onclick="enterApp()"
        class="w-full py-3.5 grad-primary text-white font-extrabold rounded-2xl hover:opacity-90 transition-opacity" style="box-shadow:0 8px 24px rgba(46,91,255,0.35)">
        Abrir Mini-App →
      </button>
    </div>

    <a href="./dashboard.html" class="block mt-6 text-xs text-on-surface-variant hover:text-primary transition-colors">
      ← Volver al dashboard
    </a>
  </div>
</div>

<!-- APP SCREEN -->
<div id="screen-app" class="hidden min-h-screen">
  <!-- Header -->
  <header class="flex items-center gap-3 px-5 py-3 border-b border-white/5 sticky top-0 z-10" style="background:rgba(14,14,14,0.9);backdrop-filter:blur(20px)">
    <div id="app-icon-header" class="text-xl w-9 h-9 flex items-center justify-center rounded-xl grad-primary shadow-md shrink-0">⚡</div>
    <div class="flex-1 min-w-0">
      <h1 id="app-title-header" class="font-extrabold text-sm truncate leading-tight">Mini-App</h1>
      <p id="app-type-header" class="text-[10px] text-on-surface-variant">Aplicación interactiva</p>
    </div>
    <a href="./dashboard.html" class="w-8 h-8 rounded-xl bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors border border-white/5">
      <span class="material-symbols-outlined text-sm">home</span>
    </a>
  </header>

  <!-- Dynamic content -->
  <div id="app-content" class="px-4 py-5 max-w-lg mx-auto">
    <!-- populated by renderApp() -->
  </div>
</div>

<script>
let currentApp = null;

document.addEventListener('DOMContentLoaded', async () => {
  const id = getParam('id');
  if (!id) { showError('No se especificó una mini-app.'); return; }

  // Try localStorage first, then Supabase as fallback
  let app = MiniApps.get(id);
  if (!app && typeof DB !== 'undefined') {
    try { app = await DB.miniApps.get(id); } catch(e) { console.warn('DB fetch failed', e); }
  }
  if (!app) { showError('Mini-App no encontrada. Verifica el enlace.'); return; }

  // Cache in localStorage for next time
  if (app && !MiniApps.get(id)) MiniApps.save(app);

  currentApp = app;

  // Fill access screen
  document.getElementById('access-icon').textContent = app.icon || '⚡';
  document.getElementById('access-title').textContent = app.name;
  document.getElementById('access-desc').textContent = app.description || (app.niche ? `Nicho: ${app.niche}` : 'Aplicación interactiva');

  if (app.accessCodes && app.accessCodes.length > 0) {
    document.getElementById('access-code-section').classList.remove('hidden');
  } else {
    document.getElementById('access-free-btn').classList.remove('hidden');
  }

  // Update page title
  document.title = `${app.name} | Luminous Studio`;
});

function validateAccess() {
  const code = document.getElementById('access-code-input').value.trim();
  const errEl = document.getElementById('access-error');
  if (MiniApps.validateCode(currentApp.id, code)) {
    errEl.classList.add('hidden');
    enterApp();
  } else {
    errEl.classList.remove('hidden');
    document.getElementById('access-code-input').classList.add('ring-2', 'ring-error');
    setTimeout(() => document.getElementById('access-code-input').classList.remove('ring-2', 'ring-error'), 1500);
  }
}

function enterApp() {
  document.getElementById('screen-access').classList.add('hidden');
  document.getElementById('screen-app').classList.remove('hidden');

  // Header
  document.getElementById('app-icon-header').textContent = currentApp.icon || '⚡';
  document.getElementById('app-title-header').textContent = currentApp.name;
  const typeLabels = {
    devocional:'Devocional', checklist:'Checklist interactivo', tracker:'Tracker de progreso',
    calculadora:'Calculadora', planificador:'Planificador', 'quiz-embed':'Quiz', generador:'Generador IA',
  };
  document.getElementById('app-type-header').textContent = typeLabels[currentApp.type] || 'Aplicación interactiva';

  renderApp();
}

// ── Render by type ────────────────────────────────────────
function renderApp() {
  const content = document.getElementById('app-content');
  // Support both single type (legacy) and types array (multi-section)
  const types = currentApp.types && currentApp.types.length
    ? currentApp.types
    : [currentApp.type].filter(Boolean);

  if (types.length === 0) return renderGeneric(content);

  if (types.length === 1) {
    return renderSection(content, types[0]);
  }

  // Multi-section: render each type as a collapsible section
  const typeLabels = {
    devocional:'Devocional', checklist:'Checklist', tracker:'Tracker de progreso',
    calculadora:'Calculadora', planificador:'Planificador', 'quiz-embed':'Quiz',
    generador:'Generador IA', simulador:'Simulador', chatbot:'Asistente IA',
    reto:'Reto / Challenge', diario:'Diario guiado', comparador:'Comparador',
    diagnostico:'Diagnóstico', roadmap:'Mapa de ruta', temporizador:'Temporizador',
    glosario:'Glosario', faq:'FAQ', biblioteca:'Biblioteca', flashcards:'Flashcards',
    afirmaciones:'Afirmaciones', onboarding:'Onboarding',
  };
  const typeIcons = {
    devocional:'🕊️', checklist:'✅', tracker:'📊', calculadora:'🧮',
    planificador:'📅', 'quiz-embed':'🎯', generador:'✨', simulador:'🔮',
    chatbot:'🤖', reto:'🔥', diario:'📓', comparador:'⚖️', diagnostico:'🩺',
    roadmap:'🗺️', temporizador:'⏱️', glosario:'📖', faq:'💬',
    biblioteca:'📚', flashcards:'🃏', afirmaciones:'🌟', onboarding:'🚀',
  };

  content.innerHTML = `<div class="space-y-3 p-2" id="multi-sections"></div>`;
  const sectionsEl = document.getElementById('multi-sections');

  types.forEach((t, idx) => {
    const section = document.createElement('div');
    section.className = 'rounded-2xl border border-outline-variant/10 overflow-hidden bg-surface-container';
    section.innerHTML = `
      <button onclick="toggleSection(${idx})"
        class="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-surface-container-high transition-colors">
        <div class="flex items-center gap-2">
          <span class="text-xl">${typeIcons[t]||'⚡'}</span>
          <span class="font-bold text-sm">${typeLabels[t]||t}</span>
        </div>
        <span id="sec-chevron-${idx}" class="material-symbols-outlined text-on-surface-variant text-lg transition-transform ${idx===0?'rotate-180':''}">expand_more</span>
      </button>
      <div id="sec-body-${idx}" class="${idx===0?'':'hidden'}">
        <div class="border-t border-outline-variant/10" id="sec-content-${idx}"></div>
      </div>`;
    sectionsEl.appendChild(section);
    renderSection(document.getElementById(`sec-content-${idx}`), t);
  });
}

function toggleSection(idx) {
  const body = document.getElementById(`sec-body-${idx}`);
  const chevron = document.getElementById(`sec-chevron-${idx}`);
  body.classList.toggle('hidden');
  chevron.classList.toggle('rotate-180');
}

function renderSection(el, type) {
  if (type === 'checklist') return renderChecklist(el);
  if (type === 'tracker') return renderTracker(el);
  if (type === 'devocional') return renderDevocional(el);
  if (type === 'planificador') return renderPlanificador(el);
  if (type === 'calculadora') return renderCalculadora(el);
  if (type === 'quiz-embed') return renderQuizEmbed(el);
  if (type === 'generador' || type === 'simulador' || type === 'afirmaciones') return renderGenerador(el);
  if (type === 'chatbot') return renderChatbot(el);
  if (type === 'reto') return renderReto(el);
  if (type === 'diario') return renderDiario(el);
  if (type === 'glosario') return renderGlosario(el);
  if (type === 'faq') return renderFaq(el);
  if (type === 'flashcards') return renderFlashcards(el);
  if (type === 'roadmap') return renderRoadmap(el);
  if (type === 'comparador') return renderComparador(el);
  if (type === 'diagnostico') return renderDiagnostico(el);
  if (type === 'biblioteca') return renderBiblioteca(el);
  renderGeneric(el);
}
  renderGeneric(el);
}

// ── CHATBOT ───────────────────────────────────────────────
function renderChatbot(el) {
  const app = currentApp;
  const botName = app.chatbotName || app.name || 'Asistente';
  const botIcon = app.icon || '🤖';
  const systemPrompt = app.chatbotSystemPrompt || `Eres un asistente experto en ${app.niche || 'el tema de este producto'}. Responde de forma clara, empática y útil. Máximo 3 oraciones por respuesta.`;
  const groqKey = (typeof Settings !== 'undefined' && Settings.getGroqApiKey) ? Settings.getGroqApiKey() : '';
  let messages = []; // {role, text}

  el.innerHTML = `
    <div class="flex flex-col h-full" style="min-height:420px">
      <!-- Header del bot -->
      <div class="flex items-center gap-3 p-4 border-b border-outline-variant/10 mb-2">
        <div class="w-11 h-11 rounded-full bg-primary/10 flex items-center justify-center text-2xl">${botIcon}</div>
        <div>
          <p class="font-bold text-sm">${esc(botName)}</p>
          <p class="text-xs text-secondary flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-secondary inline-block"></span>En línea · IA activa</p>
        </div>
      </div>
      <!-- Mensajes -->
      <div id="chat-messages" class="flex-1 overflow-y-auto px-4 space-y-3 pb-2" style="max-height:340px">
        <div class="flex gap-2 items-end">
          <span class="text-xl shrink-0">${botIcon}</span>
          <div class="bg-surface-container-high rounded-2xl rounded-bl-sm px-4 py-2.5 text-sm max-w-[80%]">
            ${esc(app.chatbotGreeting || `¡Hola! Soy ${botName}. ¿En qué puedo ayudarte hoy?`)}
          </div>
        </div>
      </div>
      <!-- Sugerencias -->
      <div id="chat-suggestions" class="px-4 pb-2 flex flex-wrap gap-2">
        ${(app.chatbotSuggestions || []).map(s => `
          <button onclick="sendSuggestion(this)" class="text-xs px-3 py-1.5 rounded-full border border-primary/30 text-primary hover:bg-primary/10 transition-colors">${esc(s)}</button>
        `).join('')}
      </div>
      <!-- Input -->
      <div class="px-4 pb-4 pt-2 flex gap-2 border-t border-outline-variant/10">
        <input id="chat-input" type="text" placeholder="Escribe tu pregunta..."
          class="flex-1 bg-surface-container border border-outline-variant/20 rounded-full px-4 py-2.5 text-sm outline-none focus:border-primary transition-colors"
          onkeydown="if(event.key==='Enter')sendChatMessage()" maxlength="500"/>
        <button onclick="sendChatMessage()" class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shrink-0 hover:opacity-90 transition-opacity">
          <span class="material-symbols-outlined text-white text-base">send</span>
        </button>
      </div>
    </div>`;

  window.sendSuggestion = (btn) => {
    document.getElementById('chat-input').value = btn.textContent;
    document.getElementById('chat-suggestions').classList.add('hidden');
    sendChatMessage();
  };

  window.sendChatMessage = async () => {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    // Add user message
    appendMsg('user', text);
    messages.push({ role: 'user', content: text });

    // Typing indicator
    const typingId = 'typing-' + Date.now();
    appendMsg('bot', '...', typingId);

    try {
      let reply = '';
      if (groqKey) {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + groqKey },
          body: JSON.stringify({
            model: 'llama-3.1-8b-instant',
            messages: [{ role: 'system', content: systemPrompt }, ...messages],
            max_tokens: 200, temperature: 0.7
          })
        });
        const data = await res.json();
        reply = data.choices?.[0]?.message?.content || 'No pude responder. Intenta de nuevo.';
      } else {
        // Fallback sin API key
        reply = `Soy ${botName}, tu asistente de ${app.niche || 'este tema'}. Para respuestas con IA configura tu API key de Groq en ajustes.`;
      }
      messages.push({ role: 'assistant', content: reply });
      document.getElementById(typingId)?.remove();
      appendMsg('bot', reply);
    } catch(e) {
      document.getElementById(typingId)?.remove();
      appendMsg('bot', 'Hubo un error. Intenta de nuevo.');
    }

    // Scroll to bottom
    const msgs = document.getElementById('chat-messages');
    msgs.scrollTop = msgs.scrollHeight;
  };

  function appendMsg(role, text, id) {
    const msgs = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'flex gap-2 items-end ' + (role === 'user' ? 'flex-row-reverse' : '');
    if (id) div.id = id;
    div.innerHTML = role === 'user'
      ? `<div class="bg-primary text-white rounded-2xl rounded-br-sm px-4 py-2.5 text-sm max-w-[80%]">${esc(text)}</div>`
      : `<span class="text-xl shrink-0">${botIcon}</span><div class="bg-surface-container-high rounded-2xl rounded-bl-sm px-4 py-2.5 text-sm max-w-[80%]">${esc(text)}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }
}

// ── CHECKLIST ─────────────────────────────────────────────
function renderChecklist(el) {
  const storageKey = `app_checklist_${currentApp.id}`;
  let stored = localStorage.getItem(storageKey);
  // Pre-populate with AI-generated items on first open
  if (!stored && currentApp.initialItems?.length) {
    const initial = currentApp.initialItems.map(text => ({ text, done: false }));
    localStorage.setItem(storageKey, JSON.stringify(initial));
    stored = localStorage.getItem(storageKey);
  }
  let items = JSON.parse(stored || '[]');

  function save() { localStorage.setItem(storageKey, JSON.stringify(items)); }

  function draw() {
    const done = items.filter(i => i.done).length;
    const pct = items.length ? Math.round((done / items.length) * 100) : 0;
    el.innerHTML = `
      <div class="fade-in">
        <div class="mb-6">
          <div class="flex justify-between items-center mb-2">
            <p class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Progreso</p>
            <p class="text-xs font-bold text-primary">${done}/${items.length} · ${pct}%</p>
          </div>
          <div class="h-2 bg-surface-container-highest rounded-full overflow-hidden">
            <div class="h-full bg-primary rounded-full transition-all" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="space-y-2 mb-6" id="cl-list">
          ${items.map((item, i) => `
            <label class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-colors ${item.done ? 'bg-surface-container opacity-60' : 'bg-surface-container hover:bg-surface-container-high'}">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheck(${i})" class="w-4 h-4 rounded accent-primary cursor-pointer"/>
              <span class="text-sm flex-1 ${item.done ? 'line-through' : ''}">${esc(item.text)}</span>
              <button onclick="removeItem(${i})" class="text-on-surface-variant/40 hover:text-error transition-colors text-lg leading-none">×</button>
            </label>`).join('')}
          ${items.length === 0 ? '<p class="text-center text-on-surface-variant text-sm py-6">Agrega tu primer ítem ⬇️</p>' : ''}
        </div>
        <div class="flex gap-2">
          <input id="new-item-input" type="text" placeholder="Nuevo ítem..." maxlength="100"
            class="flex-1 bg-surface-container border border-outline-variant/30 rounded-xl px-4 py-2.5 text-sm focus:ring-1 focus:ring-primary outline-none"
            onkeydown="if(event.key==='Enter')addItem()"/>
          <button onclick="addItem()" class="px-4 py-2.5 bg-primary text-white text-xs font-bold rounded-xl hover:opacity-90 transition-opacity">Agregar</button>
        </div>
      </div>`;
  }

  window.toggleCheck = (i) => { items[i].done = !items[i].done; save(); draw(); };
  window.removeItem = (i) => { items.splice(i, 1); save(); draw(); };
  window.addItem = () => {
    const inp = document.getElementById('new-item-input');
    const text = inp.value.trim();
    if (!text) return;
    items.push({ text, done: false });
    save();
    draw();
  };
  draw();
}

// ── TRACKER ───────────────────────────────────────────────
function renderTracker(el) {
  const storageKey = `app_tracker_${currentApp.id}`;
  const defaultDays = currentApp.trackerDays || 30;
  let data = JSON.parse(localStorage.getItem(storageKey) || `{"days":${defaultDays},"checked":[]}`);

  function save() { localStorage.setItem(storageKey, JSON.stringify(data)); }

  const days = data.days || defaultDays;
  const checked = new Set(data.checked || []);
  const today = new Date().toISOString().split('T')[0];
  const streak = calcStreak(checked, today);

  function draw() {
    el.innerHTML = `
      <div class="fade-in">
        <div class="grid grid-cols-3 gap-3 mb-6">
          <div class="bg-surface-container rounded-2xl p-4 text-center">
            <p class="text-2xl font-extrabold text-primary">${streak}</p>
            <p class="text-[10px] text-on-surface-variant uppercase tracking-wider">Racha</p>
          </div>
          <div class="bg-surface-container rounded-2xl p-4 text-center">
            <p class="text-2xl font-extrabold text-secondary">${checked.size}</p>
            <p class="text-[10px] text-on-surface-variant uppercase tracking-wider">Días</p>
          </div>
          <div class="bg-surface-container rounded-2xl p-4 text-center">
            <p class="text-2xl font-extrabold text-on-surface">${Math.round((checked.size/days)*100)}%</p>
            <p class="text-[10px] text-on-surface-variant uppercase tracking-wider">Logrado</p>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-1.5 mb-4">
          ${Array.from({length:days}, (_,i) => {
            const d = dateOffset(i);
            const done = checked.has(d);
            const isToday = d === today;
            return `<button onclick="toggleDay('${d}')"
              class="aspect-square rounded-lg text-[10px] font-bold transition-all ${done ? 'bg-primary text-white' : isToday ? 'bg-primary/20 text-primary border border-primary/40' : 'bg-surface-container text-on-surface-variant hover:bg-surface-container-high'}"
              title="${d}">${i+1}</button>`;
          }).join('')}
        </div>
        <button onclick="toggleDay('${today}')"
          class="w-full py-3 ${checked.has(today) ? 'bg-secondary/20 text-secondary border border-secondary/30' : 'bg-primary text-white'} font-extrabold rounded-xl transition-all">
          ${checked.has(today) ? '✓ Día completado' : 'Marcar hoy como completado'}
        </button>
      </div>`;
  }

  window.toggleDay = (d) => {
    if (checked.has(d)) checked.delete(d); else checked.add(d);
    data.checked = [...checked];
    save();
    draw();
  };
  draw();
}

function calcStreak(checked, today) {
  let streak = 0;
  let d = new Date(today);
  while (true) {
    const key = d.toISOString().split('T')[0];
    if (checked.has(key)) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function dateOffset(daysFromStart) {
  const start = new Date();
  start.setDate(start.getDate() - start.getDay()); // start of week
  // Actually start from today - (days-1)
  const d = new Date();
  d.setDate(d.getDate() - (29 - daysFromStart));
  return d.toISOString().split('T')[0];
}

function renderCalculadora(el) {
  // Use AI-generated fields if available, otherwise fall back to generic
  const fields = currentApp.calcFields?.length ? currentApp.calcFields : [
    { id: 'a', label: 'Valor A', placeholder: '0' },
    { id: 'b', label: 'Valor B', placeholder: '0' },
  ];
  const resultLabel = currentApp.calcResultLabel || 'Resultado';
  const hasCustomFormula = !!currentApp.calcFormula;

  el.innerHTML = `
    <div class="fade-in space-y-4">
      <div class="bg-surface-container rounded-2xl p-5 border border-outline-variant/10">
        <div class="text-3xl text-center mb-3">${esc(currentApp.icon || '🧮')}</div>
        <h2 class="text-base font-extrabold text-center mb-1">${esc(currentApp.name)}</h2>
        <p class="text-xs text-on-surface-variant text-center mb-5">${esc(currentApp.description || '')}</p>
        <div class="space-y-3">
          ${fields.map(f => `
          <div>
            <label class="text-xs font-bold text-on-surface-variant block mb-1.5">${esc(f.label)}</label>
            <input type="number" id="calc-${f.id}" placeholder="${esc(f.placeholder || '0')}"
              class="w-full bg-surface-container-high border border-outline-variant/20 rounded-xl px-4 py-2.5 text-sm focus:ring-1 focus:ring-primary outline-none" oninput="calcResult()"/>
          </div>`).join('')}
          ${!hasCustomFormula ? `
          <div class="flex gap-2 flex-wrap">
            ${['Suma','Resta','Multiplica','Divide','Porcentaje'].map(op => `
              <button onclick="setOp('${op}')" id="op-${op}"
                class="px-3 py-1.5 rounded-xl text-xs font-bold bg-surface-container-high text-on-surface-variant hover:bg-primary/10 hover:text-primary transition-all">
                ${op}
              </button>`).join('')}
          </div>` : ''}
          <div id="calc-result" class="p-4 bg-primary/10 rounded-xl text-center border border-primary/20 hidden">
            <p class="text-[10px] text-on-surface-variant uppercase tracking-wider mb-1">${esc(resultLabel)}</p>
            <p class="text-3xl font-extrabold text-primary" id="calc-value">—</p>
          </div>
          <button onclick="calcResult()" class="w-full py-2.5 bg-primary text-white text-xs font-bold rounded-xl hover:opacity-90 transition-opacity">
            Calcular
          </button>
        </div>
      </div>
    </div>`;

  let currentOp = 'Suma';
  window.setOp = (op) => {
    currentOp = op;
    document.querySelectorAll('[id^="op-"]').forEach(b => b.classList.remove('bg-primary','text-white'));
    document.getElementById(`op-${op}`)?.classList.add('bg-primary','text-white');
    calcResult();
  };
  window.calcResult = () => {
    // Build values object from all fields
    const vals = {};
    fields.forEach(f => { vals[f.id] = parseFloat(document.getElementById(`calc-${f.id}`)?.value) || 0; });
    let res;
    if (hasCustomFormula) {
      try {
        const fn = new Function(...Object.keys(vals), `return (${currentApp.calcFormula})`);
        const raw = fn(...Object.values(vals));
        res = typeof raw === 'number' ? (Number.isInteger(raw) ? raw : raw.toFixed(2)) : raw;
      } catch { res = 'Error en fórmula'; }
    } else {
      const { a = 0, b = 0 } = vals;
      if (currentOp === 'Suma') res = a + b;
      else if (currentOp === 'Resta') res = a - b;
      else if (currentOp === 'Multiplica') res = a * b;
      else if (currentOp === 'Divide') res = b !== 0 ? (a / b).toFixed(4) : '∞';
      else if (currentOp === 'Porcentaje') res = ((a * b) / 100).toFixed(2);
    }
    document.getElementById('calc-result').classList.remove('hidden');
    document.getElementById('calc-value').textContent = res;
  };
  if (!hasCustomFormula) window.setOp('Suma');
}

// ── PLANIFICADOR ──────────────────────────────────────────
function renderPlanificador(el) {
  const storageKey = `app_plan_${currentApp.id}`;
  let stored = localStorage.getItem(storageKey);
  // Pre-populate with AI-generated tasks on first open
  if (!stored && currentApp.initialTasks?.length) {
    const initial = currentApp.initialTasks.map(text => ({ id: crypto.randomUUID(), text, status: 'todo' }));
    localStorage.setItem(storageKey, JSON.stringify(initial));
    stored = localStorage.getItem(storageKey);
  }
  let tasks = JSON.parse(stored || '[]');
  function save() { localStorage.setItem(storageKey, JSON.stringify(tasks)); }

  function draw() {
    const todo = tasks.filter(t => t.status === 'todo');
    const doing = tasks.filter(t => t.status === 'doing');
    const done = tasks.filter(t => t.status === 'done');

    const col = (title, color, items, status) => `
      <div class="bg-surface-container rounded-2xl p-4 border border-outline-variant/10">
        <h3 class="text-xs font-extrabold ${color} uppercase tracking-wider mb-3">${title} <span class="opacity-60">(${items.length})</span></h3>
        <div class="space-y-2 min-h-[60px]">
          ${items.map(t => `
            <div class="p-2.5 rounded-xl bg-surface-container-high text-xs flex items-start gap-2 group">
              <span class="flex-1">${esc(t.text)}</span>
              <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                ${status !== 'doing' ? `<button onclick="moveTo('${t.id}','doing')" class="text-primary hover:opacity-80" title="En progreso">→</button>` : ''}
                ${status !== 'done' ? `<button onclick="moveTo('${t.id}','done')" class="text-secondary hover:opacity-80" title="Listo">✓</button>` : ''}
                <button onclick="removeTask('${t.id}')" class="text-error hover:opacity-80" title="Eliminar">×</button>
              </div>
            </div>`).join('') || '<p class="text-[10px] text-on-surface-variant/40">Vacío</p>'}
        </div>
        <div class="mt-3 flex gap-1">
          <input placeholder="Nueva tarea..." id="inp-${status}" maxlength="80"
            class="flex-1 bg-surface-container-highest border border-outline-variant/20 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-primary outline-none"
            onkeydown="if(event.key==='Enter')addTask('${status}')"/>
          <button onclick="addTask('${status}')" class="px-2.5 py-1.5 bg-primary text-white text-xs font-bold rounded-lg hover:opacity-90">+</button>
        </div>
      </div>`;

    el.innerHTML = `
      <div class="fade-in">
        <h2 class="text-base font-extrabold mb-4">${esc(currentApp.name)}</h2>
        <div class="space-y-4">
          ${col('Por hacer','text-on-surface-variant', todo, 'todo')}
          ${col('En progreso','text-primary', doing, 'doing')}
          ${col('Completado','text-secondary', done, 'done')}
        </div>
      </div>`;
  }

  window.addTask = (status) => {
    const inp = document.getElementById(`inp-${status}`);
    const text = inp?.value?.trim();
    if (!text) return;
    tasks.push({ id: crypto.randomUUID(), text, status });
    save(); draw();
  };
  window.moveTo = (id, status) => {
    const t = tasks.find(t => t.id === id);
    if (t) { t.status = status; save(); draw(); }
  };
  window.removeTask = (id) => {
    tasks = tasks.filter(t => t.id !== id); save(); draw();
  };
  draw();
}

function renderGenerador(el) {
  const groqKey = typeof Settings !== 'undefined' ? Settings.getGroqApiKey() : null;
  const inputLabel = currentApp.generatorPrompt ? (currentApp.inputLabel || '¿Qué quieres generar?') : 'Tu solicitud';
  const inputPlaceholder = currentApp.inputPlaceholder || 'Describe lo que necesitas...';

  el.innerHTML = `
    <div class="fade-in space-y-4">
      <div class="bg-surface-container rounded-2xl p-5 border border-outline-variant/10">
        <div class="text-3xl text-center mb-3">${esc(currentApp.icon || '✨')}</div>

        <div class="space-y-3">
          <label class="text-xs font-bold text-on-surface-variant block">${esc(inputLabel)}</label>
          <textarea id="gen-input" rows="3" placeholder="${esc(inputPlaceholder)}"
            class="w-full bg-surface-container-high border border-outline-variant/20 rounded-xl p-3 text-sm focus:ring-1 focus:ring-primary outline-none resize-none placeholder:text-on-surface-variant/40"></textarea>
          <button onclick="runGenerador()" class="w-full py-2.5 bg-primary text-white text-xs font-bold rounded-xl hover:opacity-90 transition-opacity">
            ✨ Generar
          </button>
        </div>
      </div>
      <div id="gen-result" class="hidden bg-surface-container rounded-2xl p-5 border border-outline-variant/10">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Resultado</h3>
          <button onclick="copyResult()" class="text-[10px] px-3 py-1 rounded-full bg-primary/10 text-primary font-bold hover:bg-primary/20 transition-colors">Copiar</button>
        </div>
        <div id="gen-output" class="text-sm text-on-surface whitespace-pre-wrap leading-relaxed"></div>
      </div>
    </div>`;

  window.runGenerador = async () => {
    const input = document.getElementById('gen-input').value.trim();
    if (!input) return;
    const btn = el.querySelector('button');
    btn.disabled = true; btn.textContent = '⏳ Generando...';
    try {
      const basePrompt = currentApp.generatorPrompt || `Genera contenido útil y específico basado en: [input]`;
      const userPrompt = basePrompt.replace('[input]', input).replace('[Input]', input);
      let result = '';
      if (groqKey) {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${groqKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'llama-3.3-70b-versatile', max_tokens: 800, messages: [{ role: 'user', content: userPrompt }] }),
        });
        if (res.ok) { const d = await res.json(); result = d.choices?.[0]?.message?.content || ''; }
      }
      document.getElementById('gen-output').textContent = result || 'No se pudo generar contenido. Verifica tu API key de Groq en Configuración.';
      document.getElementById('gen-result').classList.remove('hidden');
    } catch(e) {
      document.getElementById('gen-output').textContent = 'Error: ' + e.message;
      document.getElementById('gen-result').classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.textContent = '✨ Generar';
    }
  };
  window.copyResult = () => {
    const text = document.getElementById('gen-output').textContent;
    navigator.clipboard.writeText(text).then(() => showToast?.('Copiado al portapapeles'));
  };
}

      <p class="text-[10px] text-on-surface-variant">${terms.length} términos</p>
      <div id="glosario-list" class="space-y-2">
        ${terms.length ? terms.map((t,i)=>`
          <div class="glosario-item pcard p-4 hover:border-primary/20 transition-colors cursor-pointer" onclick="this.querySelector('.glos-def').classList.toggle('hidden')">
            <div class="flex items-start gap-3">
              <div class="w-7 h-7 rounded-lg grad-teal flex items-center justify-center text-xs font-extrabold shrink-0">${String.fromCharCode(65+i%26)}</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold">${esc(t.term||t)}</p>
                ${t.def ? `<p class="glos-def text-xs text-on-surface-variant mt-1 ${i>0?'hidden':''}">${esc(t.def)}</p>` : ''}
              </div>
            </div>
          </div>`).join('') : `<div class="pcard p-8 text-center"><p class="text-on-surface-variant text-sm">Este glosario está vacío.</p></div>`}
      </div>
    </div>`;
  window.filterGlosario = () => {
    const q = document.getElementById('glosario-search')?.value.toLowerCase() || '';
    document.querySelectorAll('.glosario-item').forEach(item => {
      item.style.display = item.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };
}

// ── FAQ ───────────────────────────────────────────────────
function renderFaq(el) {
  const faqs = currentApp.faqItems || currentApp.initialItems?.map(q=>({q,a:''})) || [];
  el.innerHTML = `
    <div class="fade-in p-4 space-y-2">
      ${faqs.length ? faqs.map((f,i)=>`
        <div class="pcard overflow-hidden">
          <button onclick="toggleFaq(${i})" class="w-full flex items-center justify-between px-4 py-3.5 text-left hover:bg-surface-container-high transition-colors">
            <div class="flex items-center gap-3 pr-3">
              <div class="w-6 h-6 rounded-lg bg-primary/10 flex items-center justify-center shrink-0">
                <span class="text-primary text-xs font-extrabold">${i+1}</span>
              </div>
              <span class="text-sm font-semibold">${esc(f.q||f)}</span>
            </div>
            <span id="faq-icon-${i}" class="material-symbols-outlined text-primary text-base shrink-0 transition-transform">expand_more</span>
          </button>
          <div id="faq-body-${i}" class="hidden px-4 pb-4 text-sm text-on-surface-variant border-t border-outline-variant/10 pt-3 leading-relaxed">${esc(f.a||'Respuesta próximamente.')}</div>
        </div>`).join('') : `<div class="pcard p-8 text-center"><p class="text-on-surface-variant text-sm">No hay preguntas frecuentes aún.</p></div>`}
    </div>`;
  window.toggleFaq = (i) => {
    const body = document.getElementById(`faq-body-${i}`);
    const icon = document.getElementById(`faq-icon-${i}`);
    body.classList.toggle('hidden');
    icon.style.transform = body.classList.contains('hidden') ? '' : 'rotate(180deg)';
  };
}

// ── FLASHCARDS ────────────────────────────────────────────
function renderFlashcards(el) {
  const cards = currentApp.cards || currentApp.initialItems?.map(t=>({front:t,back:''})) || [];
  let idx = 0, flipped = false, known = 0, unknown = 0;
  function render() {
    if (!cards.length) { el.innerHTML=`<div class="pcard p-8 text-center m-4"><p class="text-on-surface-variant text-sm">No hay flashcards configuradas.</p></div>`; return; }
    const card = cards[idx];
    el.innerHTML = `
      <div class="fade-in p-4 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex gap-3 text-xs">
            <span class="text-secondary font-bold">✓ ${known}</span>
            <span class="text-error font-bold">✗ ${unknown}</span>
          </div>
          <p class="text-xs text-on-surface-variant font-bold">${idx+1} / ${cards.length}</p>
        </div>
        <div class="h-1 bg-surface-container-high rounded-full overflow-hidden">
          <div class="h-full grad-primary rounded-full transition-all" style="width:${Math.round((idx/cards.length)*100)}%"></div>
        </div>
        <div onclick="flipCard()" class="card-face cursor-pointer pcard min-h-[180px] flex flex-col items-center justify-center p-6 text-center hover:border-primary/30 transition-all" style="${flipped?'background:linear-gradient(135deg,rgba(46,91,255,0.08),rgba(124,58,237,0.05));border-color:rgba(46,91,255,0.2)':''}">
          <span class="text-[10px] font-extrabold uppercase tracking-widest mb-3 ${flipped?'text-primary':'text-on-surface-variant'}">${flipped?'RESPUESTA':'PREGUNTA'}</span>
          <p class="text-base font-semibold leading-snug">${esc(flipped?(card?.back||'Sin respuesta'):(card?.front||card||''))}</p>
          <p class="text-[10px] text-on-surface-variant mt-4 flex items-center gap-1"><span class="material-symbols-outlined text-sm">touch_app</span>Toca para ${flipped?'ver pregunta':'ver respuesta'}</p>
        </div>
        <div class="flex gap-2">
          <button onclick="prevCard()" class="w-10 h-10 pcard rounded-xl flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">‹</button>
          <button onclick="markCard('no')" class="flex-1 py-2.5 rounded-xl bg-error/10 border border-error/20 text-error text-xs font-extrabold hover:bg-error/20 transition-colors">✗ No sabía</button>
          <button onclick="markCard('yes')" class="flex-1 py-2.5 rounded-xl bg-secondary/10 border border-secondary/20 text-secondary text-xs font-extrabold hover:bg-secondary/20 transition-colors">✓ Lo sabía</button>
          <button onclick="nextCard()" class="w-10 h-10 pcard rounded-xl flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">›</button>
        </div>
      </div>`;
  }
  window.flipCard = () => { flipped=!flipped; render(); };
  window.nextCard = () => { idx=(idx+1)%cards.length; flipped=false; render(); };
  window.prevCard = () => { idx=(idx-1+cards.length)%cards.length; flipped=false; render(); };
  window.markCard = (r) => { if(r==='yes')known++;else unknown++; flipped=false; idx=(idx+1)%cards.length; render(); };
  render();
}

// ── ROADMAP ───────────────────────────────────────────────
function renderRoadmap(el) {
  const steps = currentApp.roadmapSteps || currentApp.initialTasks || currentApp.initialItems || [];
  const storageKey = `app_roadmap_${currentApp.id}`;
  let done = {};
  try { done = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch {}

  function render() {
    if (!steps.length) { el.innerHTML=`<div class="pcard p-8 text-center m-4"><p class="text-on-surface-variant text-sm">No hay pasos configurados.</p></div>`; return; }
    const total = steps.length, completed = Object.values(done).filter(Boolean).length;
    const pct = total ? Math.round(completed/total*100) : 0;
    el.innerHTML = `
      <div class="fade-in p-4 space-y-4">
        <div class="pcard-glow p-4">
          <div class="flex items-center justify-between mb-2">
            <p class="text-sm font-extrabold">Tu Roadmap</p>
            <span class="text-xs font-bold text-primary">${completed}/${total} etapas</span>
          </div>
          <div class="h-2 bg-surface-container-high rounded-full overflow-hidden">
            <div class="h-full rounded-full transition-all" style="width:${pct}%;background:linear-gradient(90deg,#2E5BFF,#7c3aed)"></div>
          </div>
        </div>
        <div class="relative pl-8">
          ${steps.map((s,i) => `
            <div class="relative pb-5 last:pb-0">
              <div class="absolute -left-8 top-0 flex flex-col items-center" style="height:100%">
                <button onclick="toggleRoadmap(${i})"
                  class="w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 font-extrabold text-xs transition-all z-10
                  ${done[i] ? 'border-transparent text-white shadow-lg' : 'bg-surface-container border-outline-variant/40 text-on-surface-variant hover:border-primary'}"
                  style="${done[i]?'background:linear-gradient(135deg,#2E5BFF,#7c3aed);box-shadow:0 2px 8px rgba(46,91,255,0.4)':''}">
                  ${done[i] ? '✓' : `<span class="text-[10px]">${i+1}</span>`}
                </button>
                ${i<steps.length-1 ? `<div class="w-px flex-1 mt-1 transition-colors" style="${done[i]?'background:rgba(46,91,255,0.3)':'background:rgba(255,255,255,0.07)'}"></div>` : ''}
              </div>
              <div class="pcard p-3 ml-2 hover:border-primary/20 transition-colors cursor-pointer" onclick="toggleRoadmap(${i})">
                <p class="text-sm font-semibold ${done[i]?'line-through text-on-surface-variant':''} transition-all">${esc(s)}</p>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  }
  window.toggleRoadmap = (i) => { done[i]=!done[i]; localStorage.setItem(storageKey, JSON.stringify(done)); render(); };
  render();
}

// ── COMPARADOR ────────────────────────────────────────────
function renderComparador(el) {
  const opts = currentApp.compareOptions || currentApp.initialItems?.map(t=>({name:t,pros:[],cons:[]})) || [];
  if (!opts.length) {
    el.innerHTML = `<p class="text-xs text-on-surface-variant text-center py-8 p-4">No hay opciones para comparar.</p>`;
    return;
  }
  el.innerHTML = `
    <div class="p-4 space-y-3">
      ${opts.map(o=>`
        <div class="p-4 bg-surface-container rounded-2xl border border-outline-variant/10">
          <p class="font-bold text-sm mb-2">${esc(o.name||o)}</p>
          ${(o.pros||[]).length ? `<div class="mb-2">${o.pros.map(p=>`<p class="text-xs text-tertiary flex items-start gap-1.5"><span>✓</span>${esc(p)}</p>`).join('')}</div>` : ''}
          ${(o.cons||[]).length ? `<div>${o.cons.map(c=>`<p class="text-xs text-error/70 flex items-start gap-1.5"><span>✗</span>${esc(c)}</p>`).join('')}</div>` : ''}
        </div>`).join('')}
    </div>`;
}

// ── DIAGNÓSTICO ───────────────────────────────────────────
function renderDiagnostico(el) {
  const questions = currentApp.diagQuestions || currentApp.questions || currentApp.initialItems?.map(q=>({q,opts:['Sí','No','A veces','No sé']})) || [];
  let answers = {}, step = 0;

  function renderQuestion() {
    if (!questions.length) { el.innerHTML=`<div class="pcard p-8 text-center m-4"><p class="text-on-surface-variant text-sm">No hay preguntas.</p></div>`; return; }
    if (step >= questions.length) return renderResult();
    const qObj = questions[step];
    const q = qObj.q || qObj;
    const opts = qObj.opts || ['Sí','No','A veces','No sé'];
    const pct = Math.round((step/questions.length)*100);
    el.innerHTML = `
      <div class="fade-in p-4 space-y-4">
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-on-surface-variant">Pregunta ${step+1} de ${questions.length}</span>
            <span class="text-xs font-bold text-primary">${pct}%</span>
          </div>
          <div class="h-1.5 bg-surface-container-high rounded-full overflow-hidden">
            <div class="h-full grad-primary rounded-full transition-all" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="pcard p-5">
          <p class="text-base font-extrabold leading-snug">${esc(q)}</p>
        </div>
        <div class="space-y-2">
          ${opts.map((o,i)=>`
            <button onclick="answerDiag(${i})"
              class="w-full text-left px-4 py-3.5 pcard rounded-2xl text-sm font-semibold hover:border-primary/40 hover:bg-primary/5 hover:text-primary transition-all flex items-center gap-3">
              <span class="w-6 h-6 rounded-lg bg-surface-container-high flex items-center justify-center text-xs font-extrabold shrink-0">${String.fromCharCode(65+i)}</span>
              ${esc(o)}
            </button>`).join('')}
        </div>
      </div>`;
  }
  function renderResult() {
    const total = Object.values(answers).length;
    el.innerHTML = `
      <div class="fade-in p-4 text-center space-y-4">
        <div class="w-20 h-20 rounded-3xl grad-primary mx-auto flex items-center justify-center text-4xl shadow-xl" style="box-shadow:0 12px 32px rgba(46,91,255,0.35)">📊</div>
        <p class="font-extrabold text-xl">Diagnóstico completado</p>
        <p class="text-sm text-on-surface-variant">Respondiste ${total} preguntas sobre ${esc(currentApp.niche||'tu nicho')}.</p>
        <button onclick="step=0;answers={};renderQuestion()" class="w-full py-3 grad-primary text-white rounded-2xl text-sm font-extrabold hover:opacity-90 transition-opacity" style="box-shadow:0 4px 16px rgba(46,91,255,0.3)">
          Repetir diagnóstico
        </button>
      </div>`;
  }
  window.answerDiag = (i) => { answers[step]=i; step++; renderQuestion(); };
  renderQuestion();
}

// ── BIBLIOTECA ────────────────────────────────────────────
function renderBiblioteca(el) {
  const resources = currentApp.resources || currentApp.initialItems?.map(t=>({title:t,url:'',type:'link'})) || [];
  el.innerHTML = `
    <div class="p-4 space-y-2">
      ${resources.length ? resources.map(r=>`
        <div class="flex items-center gap-3 p-3 bg-surface-container rounded-xl border border-outline-variant/10">
          <span class="text-xl shrink-0">${r.type==='video'?'🎬':r.type==='pdf'?'📄':r.type==='audio'?'🎧':'🔗'}</span>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-semibold truncate">${esc(r.title||r)}</p>
            ${r.desc ? `<p class="text-xs text-on-surface-variant truncate">${esc(r.desc)}</p>` : ''}
          </div>
          ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener"
            class="shrink-0 px-3 py-1.5 bg-primary/10 text-primary rounded-lg text-xs font-bold hover:bg-primary/20 transition-colors">
            Abrir →</a>` : ''}
        </div>`).join('') : `<p class="text-xs text-on-surface-variant text-center py-8">Biblioteca vacía.</p>`}
    </div>`;
}

// ── GENERIC ───────────────────────────────────────────────
function renderGeneric(el) {
  el.innerHTML = `
    <div class="fade-in text-center py-16">
      <div class="text-6xl mb-4">${esc(currentApp.icon || '⚡')}</div>
      <h2 class="text-xl font-extrabold mb-2">${esc(currentApp.name)}</h2>
      <p class="text-on-surface-variant text-sm mb-2">${esc(currentApp.description || '')}</p>
      <p class="text-xs text-on-surface-variant/50">Tipo: ${esc(currentApp.type)} · Nicho: ${esc(currentApp.niche)}</p>
      <div class="mt-8 p-4 bg-primary/5 border border-primary/20 rounded-2xl text-left">
        <p class="text-xs text-primary font-bold mb-1">¿Quieres personalizar esta mini-app?</p>
        <p class="text-xs text-on-surface-variant">Próximamente podrás añadir contenido, secciones y personalización avanzada desde el editor de mini-apps.</p>
      </div>
    </div>`;
}

// ── Error screen ──────────────────────────────────────────
function showError(msg) {
  document.getElementById('screen-access').innerHTML = `
    <div class="text-center fade-in">
      <div class="text-5xl mb-4">⚠️</div>
      <h1 class="text-xl font-extrabold mb-2">Algo salió mal</h1>
      <p class="text-on-surface-variant text-sm mb-6">${esc(msg)}</p>
      <a href="./dashboard.html" class="px-5 py-2.5 bg-primary text-white rounded-xl text-sm font-bold">← Volver</a>
    </div>`;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
