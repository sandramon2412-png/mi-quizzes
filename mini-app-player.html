function compactLine(value, max = 220) {
  const text = cleanText(value).replace(/\s+/g, ' ').trim();
  return text.length > max ? `${text.slice(0, max - 1)}...` : text;
}

function collectAppContextLines(app = currentApp) {
  const lines = [];
  const add = (label, value, max = 220) => {
    const text = compactLine(value, max);
    if (text) lines.push(`${label}: ${text}`);
  };
  const addList = (label, items, formatter, limit = 6) => {
    const values = (items || []).map(formatter).map(item => compactLine(item, 180)).filter(Boolean).slice(0, limit);
    if (values.length) lines.push(`${label}: ${values.join(' | ')}`);
  };

  add('Nombre', app.name);
  add('Nicho', app.niche || app.category || app.subcategory);
  add('Descripcion', app.description);
  add('Objetivo de hoy', app.todayPrompt);
  add('Herramientas', appToolsList(app).map(type => `${typeLabel(type)} (${toolDescription(type)})`).join('; '), 900);
  add('Prompt del generador', app.generatorPrompt, 260);
  add('Mensaje inicial del chat', app.chatbotGreeting, 220);
  addList('Senales del mapa', app.bodySignals || app.content?.bodySignals, item =>
    [item.label || item.title, item.meaning, item.prompt, item.practice].filter(Boolean).join(' - ')
  );
  addList('Practicas', app.practiceItems || app.content?.practiceItems || app.meditationLibrary, item =>
    [item.title, item.description || item.type, item.script].filter(Boolean).join(' - ')
  );
  addList('Reto', app.retoContent || app.content?.retoContent, item =>
    [`Dia ${item.day || ''}`.trim(), item.title, item.instructions || item.reflectionPrompt].filter(Boolean).join(' - ')
  );
  addList('FAQ', app.faqItems || app.content?.faqItems, item =>
    [item.q, item.a].filter(Boolean).join(' - ')
  );
  addList('Tarjetas', app.cards || app.content?.cards, item =>
    [item.front, item.back].filter(Boolean).join(' - ')
  );
  addList('Roadmap', app.roadmapSteps || app.content?.roadmapSteps, item =>
    typeof item === 'string' ? item : [item.title, item.description].filter(Boolean).join(' - ')
  );
  addList('Escenas role-play', app.roleplayScenes || app.content?.roleplayScenes, item =>
    [item.title, item.level, item.collection, item.objective || item.prompt].filter(Boolean).join(' - ')
  );
  addList('Checklist', app.initialItems || app.content?.initialItems, item =>
    typeof item === 'string' ? item : [item.text, item.title, item.description].filter(Boolean).join(' - ')
  );
  return lines;
}

function nutritionFallback(question, topic) {
  const q = normalizeText(question);
  const context = normalizeText(`${topic} ${currentApp?.name || ''}`);
  if (!/diabet|cocina|nutric|alimenta|receta|azucar|gluc/.test(context)) return '';
  if (/desayun/.test(q)) {
    return 'Para un desayuno mas estable, combina proteina + fibra + una porcion medida de carbohidrato: por ejemplo huevos con vegetales y una tortilla integral, yogur griego natural con nueces y frutos rojos, o avena en porcion pequena con chia. Evita jugos, pan dulce y cereales azucarados porque elevan rapido la glucosa.';
  }
  if (/comer|receta|ingred|plato|cena|almuerz/.test(q)) {
    return 'Arma el plato asi: medio plato de verduras sin almidon, un cuarto de proteina magra y un cuarto de carbohidrato de bajo indice glucemico. Sazona con hierbas, limon, ajo o especias en vez de salsas azucaradas, y mide la porcion de carbohidratos para poder ajustar mejor.';
  }
  if (/azucar|glucosa|carbo|insulina|indice/.test(q)) {
    return 'Para cuidar la glucosa, revisa tres cosas: cantidad total de carbohidratos, indice glucemico del alimento y combinacion con proteina/fibra. La app incluye esos datos porque ayudan a estimar mejor el impacto de una comida.';
  }
  return '';
}

function smartLocalAIResponse(input, mode = 'generator', systemPrompt = '') {
  const topic = currentApp?.niche || currentApp?.name || 'este tema';
  const cleanInput = String(input || '').trim();
  const specific = nutritionFallback(cleanInput, topic);
  const snippets = getRelevantAppSnippets(currentApp, cleanInput, specific ? 3 : 5);

  if (mode === 'chat') {
    const cfg = chatSpecialistConfig(currentApp);
    const text = nicheText(currentApp);
    const parts = [
      specific || `Como ${cfg.role}, te respondo sobre "${cleanInput || topic}" con enfoque practico y dentro de esta mini-app.`
    ];
    if (systemPrompt && /fuera del nicho|reconduce/i.test(systemPrompt) && cleanInput && !snippets.length) {
      parts.push(`Para mantenerlo util, lo aterrizo al objetivo de ${currentApp?.name || 'esta experiencia'} y a las herramientas disponibles aqui.`);
    }
    if (snippets.length) parts.push(`Datos de esta mini-app:\n${snippets.map((s, i) => `${i + 1}. ${s}`).join('\n')}`);
    if (/mascota|perro|gato|conejo|animal|veterin|canino|felino|cachorro/.test(text)) {
      parts.push('Siguiente paso: observa frecuencia, duracion, apetito, energia y cambios de conducta. Si notas dificultad respiratoria, dolor intenso, decaimiento marcado, sangre, vomitos repetidos o empeora rapido, consulta con veterinario.');
    } else if (/salud|diabet|nutric|bienestar|cuerpo|ansiedad|terapia/.test(text)) {
      parts.push('Toma esto como orientacion educativa y practica; si hay sintomas intensos, medicacion, diagnostico o riesgo fisico, confirma con un profesional.');
    } else {
      parts.push('Siguiente paso: elige una accion pequena, medible y posible para aplicar hoy dentro de esta herramienta.');
    }
    return parts.join('\n\n');
  }

  return [
    `Respuesta para ${topic}:`,
    specific || `Solicitud: ${cleanInput || 'sin detalle'}.`,
    snippets.length ? `\nDatos de esta app:\n${snippets.map((s, i) => `${i + 1}. ${s}`).join('\n')}` : '',
    '\nSiguiente paso: convierte esto en una acci\u00f3n concreta y medible para hoy.'
  ].filter(Boolean).join('\n');
}

async function callCreatorAI({ messages, systemPrompt, maxTokens = 700, mode = 'generator', temperature = 0.55 }) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 25000);
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/creator-ai-proxy`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
      signal: controller.signal,
      body: JSON.stringify({ contentType: 'miniapp', contentId: currentApp.id, messages, systemPrompt, maxTokens, temperature })
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok || data?.error) {
      throw new Error(data?.error?.message || `Error ${r.status}`);
    }
    const content = data.content || data?.message || data?.choices?.[0]?.message?.content;
    if (!content) throw new Error('La IA no devolvió contenido.');
    return { content, fallback: false };
  } catch (e) {
    console.warn('[miniapp-ai] usando fallback local:', e.message);
    const userText = [...(messages || [])].reverse().find(m => m.role === 'user')?.content || messages?.map(m => m.content).join('\n') || '';
    return { content: mode === 'chat' ? smartLocalAIResponse(userText, 'chat', systemPrompt) : smartLocalAIResponse(userText, mode), fallback: true, error: e.message };
  } finally {
    clearTimeout(timeout);
  }
}

  const preview = () => document.getElementById('skin-scan-preview');

  function cameraErrorMessage(error) {
    const name = String(error?.name || '');
    if (!window.isSecureContext) {
      return 'La camara solo funciona en HTTPS o localhost. Usa Tomar/Subir foto por ahora.';
    }
    if (/NotAllowed|Permission|Security/i.test(name)) {
      return 'Permiso de camara bloqueado. Activalo en el candado del navegador o usa Tomar/Subir foto.';
    }
    if (/NotFound|DevicesNotFound/i.test(name)) {
      return 'No encontre una camara disponible en este dispositivo. Usa Tomar/Subir foto.';
    }
    if (/NotReadable|TrackStart|Abort/i.test(name)) {
      return 'La camara esta ocupada por otra app o el navegador no pudo leerla. Cierra Zoom/otras apps o usa Tomar/Subir foto.';
    }
    return 'Este navegador no permitio abrir camara en vivo. Usa Tomar/Subir foto; en celular suele abrir camara o galeria.';
  }

  function stopCamera() {
    try { cameraStream?.getTracks?.().forEach(track => track.stop()); } catch {}
    cameraStream = null;
    media()?.classList.remove('has-camera');
    if (video()) video().srcObject = null;
    if (captureBtn()) captureBtn().style.display = 'none';
  }

  function setPreview(dataUrl) {
    stopCamera();
    if (preview()) preview().src = dataUrl;
    media()?.classList.add('has-preview');
    localStorage.setItem(`skin_scan_latest_photo_${app.id}`, dataUrl);
  }

  function clamp(n, min = 12, max = 96) {
    return Math.max(min, Math.min(max, Math.round(n)));
  }

  function loadImage(dataUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  async function readImageMetrics(dataUrl) {
    const img = await loadImage(dataUrl);
    const canvas = document.createElement('canvas');
    const maxW = 180;
    const ratio = img.width ? img.height / img.width : 1.25;
    canvas.width = maxW;
    canvas.height = Math.max(120, Math.round(maxW * ratio));
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const sampleRegion = (x1, y1, x2, y2) => {
      const sx = Math.max(0, Math.floor(canvas.width * x1));
      const ex = Math.min(canvas.width, Math.ceil(canvas.width * x2));
      const sy = Math.max(0, Math.floor(canvas.height * y1));
      const ey = Math.min(canvas.height, Math.ceil(canvas.height * y2));
      let r = 0, g = 0, b = 0, lum = 0, lum2 = 0, count = 0;
      for (let y = sy; y < ey; y += 2) {
        for (let x = sx; x < ex; x += 2) {
          const i = (y * canvas.width + x) * 4;
          const rr = pixels[i], gg = pixels[i + 1], bb = pixels[i + 2];
          const l = rr * .2126 + gg * .7152 + bb * .0722;
          r += rr; g += gg; b += bb; lum += l; lum2 += l * l; count++;
        }
      }
      if (!count) count = 1;
      r /= count; g /= count; b /= count; lum /= count;
      const variance = Math.max(0, lum2 / count - lum * lum);
      const contrast = Math.sqrt(variance);
      const redExcess = Math.max(0, r - ((g + b) / 2));
      const warmth = Math.max(0, (r + g) / 2 - b);
      return {
        r, g, b, lum, contrast, redExcess, warmth,
        redScore: clamp(28 + redExcess * 1.65, 10, 92),
        brightness: clamp((lum / 255) * 100, 16, 96),
        evenness: clamp(100 - contrast * 1.18, 18, 96),
        texture: clamp(100 - contrast * 1.42, 12, 96),
      };
    };
    const global = sampleRegion(0, 0, 1, 1);
    const center = sampleRegion(.20, .12, .80, .86);
    const leftSide = sampleRegion(.05, .18, .45, .82);
    const rightSide = sampleRegion(.55, .18, .95, .82);
    const zones = [
      { id:'forehead', label:'Frente', icon:'face_3', ...sampleRegion(.30, .16, .70, .34) },
      { id:'left-cheek', label:'Mejilla izquierda', icon:'sentiment_satisfied', ...sampleRegion(.18, .38, .44, .64) },
      { id:'right-cheek', label:'Mejilla derecha', icon:'sentiment_satisfied', ...sampleRegion(.56, .38, .82, .64) },
      { id:'nose', label:'Zona T / nariz', icon:'filter_center_focus', ...sampleRegion(.42, .34, .58, .62) },
      { id:'chin', label:'Menton', icon:'face', ...sampleRegion(.34, .64, .66, .84) },
    ].map(zone => ({
      id: zone.id,
      label: zone.label,
      icon: zone.icon,
      redScore: clamp(zone.redScore),
      brightness: clamp(zone.brightness),
      evenness: clamp(zone.evenness),
      texture: clamp(zone.texture),
      contrast: Math.round(zone.contrast),
    }));
    const r = global.r, g = global.g, b = global.b, lum = global.lum;
    const contrast = global.contrast;
    const redExcess = global.redExcess;
    const redScore = clamp(28 + redExcess * 1.65, 10, 92);
    const brightness = clamp((lum / 255) * 100, 16, 96);
    const evenness = clamp(100 - contrast * 1.18, 18, 96);
    const calm = clamp(100 - redScore * .58 + evenness * .18, 18, 96);
    const glow = clamp(brightness * .58 + evenness * .28, 18, 96);
    const texture = clamp(evenness * .82 + (100 - redScore) * .12, 18, 96);
    const lightBalance = clamp(100 - Math.abs(leftSide.lum - rightSide.lum) * .7, 18, 100);
    const focusScore = clamp(center.contrast * 2.3, 18, 98);
    const exposureScore = clamp(100 - Math.abs(62 - brightness) * 1.35, 18, 100);
    const qualityScore = clamp(lightBalance * .30 + focusScore * .28 + exposureScore * .42, 18, 100);
    const thumb = canvas.toDataURL('image/jpeg', .72);
    return {
      redScore, brightness, evenness, calm, glow, texture,
      lightBalance, focusScore, exposureScore, qualityScore,
      zones,
      imageInfo: { width: img.width, height: img.height, sampledWidth: canvas.width, sampledHeight: canvas.height },
      thumb
    };
  }

  function buildInsights(metrics) {
    const insights = [];
    if (metrics.redScore > 52) {
      insights.push({ icon:'local_fire_department', title:'Senal de sensibilidad', text:'Se ve una tendencia de rojez o contraste calido. Hoy conviene rutina corta: limpieza suave, hidratante reparadora y pausa de activos fuertes.' });
    } else {
      insights.push({ icon:'spa', title:'Calma visual estable', text:'No aparece una rojez dominante en esta lectura. Mantener constancia puede darte datos mas claros al comparar con otra foto.' });
    }
    if (metrics.glow < 56) {
      insights.push({ icon:'water_drop', title:'Luminosidad baja', text:'La foto sugiere poca luminosidad o luz irregular. Revisa hidratacion, descanso y aplicacion constante de protector solar.' });
    } else {
      insights.push({ icon:'wb_sunny', title:'Buen punto de luz', text:'La lectura muestra una base luminosa. Conserva el protector solar como paso fijo para sostener tono y textura.' });
    }
    if (metrics.texture < 58) {
      insights.push({ icon:'texture', title:'Textura a observar', text:'Puede haber contraste de textura, brotes o sombras. No cambies todo: registra zona, producto reciente y sensacion.' });
    } else {
      insights.push({ icon:'check_circle', title:'Textura sin alerta fuerte', text:'La textura se ve suficientemente uniforme para seguir con una rutina simple y medir cambios por varios dias.' });
    }
    return insights;
  }

  function buildSkinScanPlan(metrics) {
    if (metrics.redScore > 52) {
      return {

        ],
        next: 'Si la rojez viene con ardor, dolor, herida o alergia visible, esta app no reemplaza dermatologia.'
      };
    }
    if (metrics.glow < 56) {
      return {
        title: 'Plan glow e hidratacion',
        steps: [
          { icon:'water_drop', label:'Manana', text:'Usa hidratante ligera antes del protector solar y toma una foto con la misma luz para comparar.' },

          { icon:'spa', label:'Rutina', text:'Mantén limpieza suave, hidratante y protector. Agrega activos solo si la piel no esta sensible.' },
          { icon:'photo_camera', label:'Comparacion', text:'Repite foto en 3 dias con la misma luz para saber si mejora o si hay que ajustar.' }
        ],

        { icon:'calendar_month', label:'Constancia', text:'Repite lectura semanal. Cambiar menos y medir mas suele dar mejores decisiones.' }
      ],
      next: 'Tu foco ahora es sostener rutina, medir cambios y no sabotear una piel que se ve estable.'
    };

  function levelFromScore(score, inverse = false) {
    const value = inverse ? 100 - Number(score || 0) : Number(score || 0);
    if (value >= 68) return 'alto';
    if (value >= 45) return 'medio';
    return 'bajo';
  }

  function dominantZoneSignal(zone) {
    if (zone.redScore > 58) return { signal:'rojez aparente', level:levelFromScore(zone.redScore), explanation:'Esta zona muestra mas calidez/rojez relativa que el resto de la foto.' };
    if (zone.brightness < 45) return { signal:'opacidad o sombra', level:levelFromScore(100 - zone.brightness), explanation:'La zona se ve con menos luz; conviene repetir foto con luz frontal antes de sacar conclusiones.' };
    if (zone.texture < 58) return { signal:'textura visual', level:levelFromScore(100 - zone.texture), explanation:'Hay mas contraste fino; puede ser textura, sombra, maquillaje o calidad de luz.' };
    return { signal:'zona estable', level:'bajo', explanation:'No aparece una alerta visual fuerte en esta lectura.' };
  }

  function getSkinScanQuizContext() {
    const quizId = currentApp.embeddedQuizId || currentApp.quizId || 'skinglow-skin-quiz';
    let quiz = null;
    try { quiz = window.getSkinGlowQuiz?.(quizId) || window.Quizzes?.get?.(quizId) || null; } catch {}
    let answers = [];
    try { answers = window.Session?.getAnswers?.() || []; } catch {}
    const mappedAnswers = (answers || []).slice(0, 8).map(answer => {
      const q = quiz?.questions?.find(item => item.id === answer.questionId);
      const opt = q?.options?.[answer.optionIndex];
      return { question: q?.text || q?.q || answer.questionId, answer: opt?.text || opt || answer.optionIndex };
    }).filter(item => item.question);
    let profile = null;
    try {
      if (quiz && mappedAnswers.length && typeof calculateProfile === 'function') profile = calculateProfile(quiz, answers);
    } catch {}
    return {
      quizId,
      quizTitle: quiz?.title || 'SkinGlow Skin Quiz',
      profileName: profile?.name || '',
      profileDescription: profile?.description || '',
      answers: mappedAnswers
    };
  }

  function buildLocalDeepAnalysis(metrics, quizContext = {}) {
    const zoneSignals = (metrics.zones || []).map(zone => {
      const signal = dominantZoneSignal(zone);
      return {
        zone: zone.label,
        signal: signal.signal,
        level: signal.level,
        explanation: signal.explanation
      };
    });
    const qualityNotes = [];
    if (metrics.exposureScore < 56) qualityNotes.push('La luz no es ideal; repite con luz natural frontal para una comparacion mas confiable.');
    if (metrics.lightBalance < 62) qualityNotes.push('Hay diferencia de luz entre lados del rostro; puede alterar rojez y textura aparente.');
    if (metrics.focusScore < 52) qualityNotes.push('La foto parece tener poco contraste fino; evita movimiento y limpia el lente.');
    if (!qualityNotes.length) qualityNotes.push('La foto tiene calidad suficiente para una lectura educativa inicial.');

    const main = metrics.redScore > 58
      ? 'Calmar barrera y validar rojez visible'
      : metrics.glow < 56
        ? 'Mejorar hidratacion y luminosidad'
        : metrics.texture < 58
          ? 'Observar textura por zonas'
          : 'Mantener rutina estable y comparar';

    const quizLine = quizContext.profileName
      ? `Al cruzarlo con el quiz, el perfil "${quizContext.profileName}" puede ayudar a priorizar mejor la rutina.`
      : 'Para personalizar mas, conviene cruzar esta lectura con el quiz de habitos, productos y objetivo.';

    return {
      source: 'analisis-local-avanzado',
      headline: main,
      confidence: Math.round((metrics.qualityScore || 60) * .78),
      photoQuality: {
        score: metrics.qualityScore || 60,
        label: metrics.qualityScore > 72 ? 'buena' : metrics.qualityScore > 52 ? 'aceptable' : 'baja',
        notes: qualityNotes
      },
      visibleSignals: zoneSignals,
      interpretation: `${main}. La lectura combina color, balance de luz, contraste y variacion por zonas. ${quizLine}`,
      questions: [
        'Hubo ardor, picor o tirantez despues de limpiar?',
        'Que producto nuevo usaste en los ultimos 7 dias?',
        'La senal cambia con sol, ciclo, estres, comida o maquillaje?'
      ],
      routine: buildSkinScanPlan(metrics).steps.reduce((acc, step, index) => {
        if (index === 0) acc.morning.push(step.text);
        else if (index === 1) acc.night.push(step.text);
        else acc.avoid.push(step.text);
        return acc;
      }, { morning: [], night: [], avoid: [] }),
      redFlags: [
        'Consulta dermatologia si hay dolor, herida, secrecion, alergia fuerte o brotes persistentes.',
        'No mezcles acidos, retinoides y exfoliantes si la piel esta ardiendo o irritada.'
      ],
      nextStep: metrics.redScore > 58 ? 'Hoy usa rutina minima: limpieza suave, hidratante reparadora y protector solar.' : 'Guarda esta foto y repite en 3 dias con la misma luz para comparar.',
      disclaimer: 'Lectura educativa de senales visibles. No diagnostica enfermedades ni reemplaza dermatologia.'
    };
  }

  function normalizeVisionAnalysis(raw, fallback) {
    const analysis = raw && typeof raw === 'object' ? raw : {};
    return {
      ...fallback,
      ...analysis,
      photoQuality: { ...(fallback.photoQuality || {}), ...(analysis.photoQuality || {}) },
      routine: { ...(fallback.routine || {}), ...(analysis.routine || {}) },
      visibleSignals: Array.isArray(analysis.visibleSignals) && analysis.visibleSignals.length ? analysis.visibleSignals : fallback.visibleSignals,
      questions: Array.isArray(analysis.questions) && analysis.questions.length ? analysis.questions : fallback.questions,
      redFlags: Array.isArray(analysis.redFlags) && analysis.redFlags.length ? analysis.redFlags : fallback.redFlags,
    };
  }

  async function resizeDataUrlForVision(dataUrl, maxSide = 960) {
    const img = await loadImage(dataUrl);
    const scale = Math.min(1, maxSide / Math.max(img.width || maxSide, img.height || maxSide));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round((img.width || maxSide) * scale));
    canvas.height = Math.max(1, Math.round((img.height || maxSide) * scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', .82);
  }

  async function requestVisionSkinAnalysis(dataUrl, metrics, quizContext) {
    const image = await resizeDataUrlForVision(dataUrl);
    const response = await fetch('./api/skin-vision-analysis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image, metrics, quizContext })
    });
    if (!response.ok) {
      let message = 'Vision endpoint unavailable';
      try { message = (await response.json())?.error || message; } catch {}
      throw new Error(message);
    }
    const data = await response.json();
    return data.analysis;
  }

  async function runAnalysis(dataUrl) {
    if (!dataUrl) {
      setStatus('warning', 'Primero sube una foto o captura una imagen con la camara.');
      return;
    }
    setStatus('auto_awesome', 'Analizando luz, rojez aparente, textura y uniformidad...');
    try {
      const metrics = await readImageMetrics(dataUrl);
      const insights = buildInsights(metrics);
      const plan = buildSkinScanPlan(metrics);
      const priority = metrics.redScore > 52 ? 'Calmar barrera y pausar activos' : metrics.glow < 56 ? 'Hidratacion y luminosidad' : metrics.texture < 58 ? 'Registrar textura por zonas' : 'Mantener rutina estable';
      currentReading = {
        date: new Date().toLocaleDateString('es-ES', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }),
        priority,
        metrics: {
          calm: metrics.calm,
          glow: metrics.glow,
          texture: metrics.texture,
          redScore: metrics.redScore,
          brightness: metrics.brightness,
          evenness: metrics.evenness,
          lightBalance: metrics.lightBalance,
          focusScore: metrics.focusScore,
          exposureScore: metrics.exposureScore,
          qualityScore: metrics.qualityScore,
          zones: metrics.zones,
          imageInfo: metrics.imageInfo
        },
        insights,
        plan,
        photo: metrics.thumb
      };
      const result = document.getElementById('skin-scan-result');
      result.classList.add('show');
      result.innerHTML = `
        <p class="signal-label">${msIcon('analytics',14)} Lectura preliminar</p>
        <h2 style="font-size:24px;line-height:1.1;margin:0 0 8px;color:var(--text)">${esc(priority)}</h2>
        <p style="font-size:12px;line-height:1.55;color:var(--muted);margin-bottom:10px">Usa esto como orientacion educativa. Si hay dolor, heridas, alergia fuerte o brotes persistentes, consulta dermatologia.</p>
        <div class="skin-scan-score">
          <div><strong>${metrics.calm}%</strong><span>calma</span></div>
          <div><strong>${metrics.glow}%</strong><span>glow</span></div>
          <div><strong>${metrics.texture}%</strong><span>textura</span></div>
        </div>
        <div class="skin-scan-insights">
          ${insights.map(item => `
            <div class="skin-scan-insight">
              <span class="material-symbols-outlined">${esc(item.icon)}</span>
              <span class="insight-copy"><strong>${esc(item.title)}</strong><span>${esc(item.text)}</span></span>
            </div>`).join('')}

          <h3>${esc(plan.title)}</h3>
          ${plan.steps.map(step => `
            <div class="skin-scan-step">
              <span class="material-symbols-outlined">${esc(step.icon)}</span>
              <span><strong>${esc(step.label)}</strong><span>${esc(step.text)}</span></span>
            </div>`).join('')}
          <div class="skin-scan-next">${msIcon('tips_and_updates',15)} ${esc(plan.next)}</div>

        <div class="skin-scan-proof" aria-label="Que reviso el escaneo">
          <div class="skin-scan-proof-row">
            <span class="material-symbols-outlined">fact_check</span>
            <span><strong>Lectura cruzable con el quiz</strong><span>El escaneo observa color, luz y contraste visual; el quiz agrega habitos, productos, objetivo y sensibilidad para personalizar mejor.</span></span>
          </div>
          <div class="skin-scan-proof-row">
            <span class="material-symbols-outlined">lock</span>
            <span><strong>Privado y educativo</strong><span>La foto queda solo en este dispositivo demo. En produccion se podria conectar a almacenamiento privado y politicas de consentimiento.</span></span>
          </div>
        </div>
        <div id="skin-scan-deep" class="skin-scan-deep"></div>
        <div class="skin-scan-result-actions">
          <button class="btn-primary" type="button" onclick="saveSkinScanReading()">${msIcon('save',15)} Guardar</button>
          <button class="btn-secondary" type="button" onclick="goToSkinScanQuiz()">${msIcon('quiz',15)} Cruzar con quiz</button>
          <button class="btn-primary" type="button" onclick="runDeepSkinVision()">${msIcon('neurology',15)} IA profunda</button>
          <button class="btn-secondary" type="button" onclick="goToSkinScanReto()">${msIcon('local_fire_department',15)} Ir a rutina</button>
          <button class="btn-secondary" type="button" onclick="goToSkinScanDiario()">${msIcon('edit_note',15)} Diario</button>
          <button class="btn-secondary" type="button" onclick="rerunSkinScan()">${msIcon('refresh',15)} Releer</button>
        </div>`;
      setStatus('task_alt', 'Escaneo listo. Guarda la lectura o continua con tu rutina de hoy.');
      result.scrollIntoView({ behavior:'smooth', block:'nearest' });
      return currentReading;
    } catch (error) {
      console.warn('skin scan failed:', error);
      setStatus('warning', 'No pude leer esa imagen. Intenta con otra foto mas clara.');
      return null;
    }
  }

  window.handleSkinScanFile = () => {
    const file = document.getElementById('skin-scan-file')?.files?.[0];
    if (!file) return;
    if (!/^image\//.test(file.type || '')) {
      setStatus('warning', 'Elige una imagen para poder hacer la lectura visual.');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || '');
      setPreview(dataUrl);
      runAnalysis(dataUrl);
    };
    reader.readAsDataURL(file);
  };

  window.startSkinScanCamera = async () => {
    try {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus('warning', 'La camara no esta disponible en este navegador. Usa Tomar/Subir foto.');
        return;
      }
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      video().srcObject = cameraStream;
      media()?.classList.remove('has-preview');
      media()?.classList.add('has-camera');
      captureBtn().style.display = 'inline-flex';
      setStatus('photo_camera', 'Camara activa. Centra el rostro con luz natural y toca Capturar.');
    } catch (error) {
      console.warn('skin camera failed:', error);
      setStatus('lock', cameraErrorMessage(error));
    }
  };

  window.captureSkinScanCamera = () => {
    const v = video();
    if (!v || !v.videoWidth) {
      setStatus('warning', 'La camara aun no esta lista. Espera un segundo e intenta otra vez.');
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = v.videoWidth;
    canvas.height = v.videoHeight;
    canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', .86);
    setPreview(dataUrl);
    runAnalysis(dataUrl);
  };

  window.loadSkinScanDemoPhoto = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 720;
    canvas.height = 900;
    const ctx = canvas.getContext('2d');
    let seed = 5127;
    const rand = () => {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };

    const bg = ctx.createLinearGradient(0, 0, 720, 900);
    bg.addColorStop(0, '#f7d9ca');
    bg.addColorStop(.36, '#eab49d');
    bg.addColorStop(.72, '#c98378');
    bg.addColorStop(1, '#8b5f62');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 720, 900);

    const warmth = ctx.createRadialGradient(500, 470, 40, 500, 470, 430);
    warmth.addColorStop(0, 'rgba(198,76,113,.18)');
    warmth.addColorStop(.5, 'rgba(198,76,113,.08)');
    warmth.addColorStop(1, 'rgba(198,76,113,0)');
    ctx.fillStyle = warmth;
    ctx.fillRect(0, 0, 720, 900);

    const light = ctx.createRadialGradient(230, 120, 20, 230, 120, 420);
    light.addColorStop(0, 'rgba(255,255,255,.34)');
    light.addColorStop(.42, 'rgba(255,247,238,.14)');
    light.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, 720, 900);

    ctx.globalCompositeOperation = 'soft-light';
    for (let i = 0; i < 1500; i++) {
      const x = rand() * 720;
      const y = rand() * 900;
      const r = .45 + rand() * 1.35;
      const alpha = .06 + rand() * .08;
      ctx.fillStyle = rand() > .62 ? `rgba(80,42,48,${alpha})` : `rgba(255,246,238,${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = 'rgba(112,64,93,.10)';
    for (let i = 0; i < 95; i++) {
      const x = 130 + rand() * 470;
      const y = 170 + rand() * 540;
      const r = .8 + rand() * 1.9;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 7; i++) {
      const y = 190 + i * 86;
      ctx.beginPath();
      ctx.moveTo(90, y);
      ctx.bezierCurveTo(250, y - 42, 430, y + 34, 650, y - 18);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath();
    ctx.ellipse(262, 164, 185, 66, -.24, 0, Math.PI * 2);
    ctx.fill();

    const vignette = ctx.createRadialGradient(360, 430, 160, 360, 430, 560);
    vignette.addColorStop(0, 'rgba(255,255,255,0)');
    vignette.addColorStop(.64, 'rgba(35,21,28,.06)');
    vignette.addColorStop(1, 'rgba(35,21,28,.28)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, 720, 900);

    const dataUrl = canvas.toDataURL('image/jpeg', .88);
    setPreview(dataUrl);
    runAnalysis(dataUrl);
  };

  window.rerunSkinScan = () => {
    const dataUrl = preview()?.src || localStorage.getItem(`skin_scan_latest_photo_${app.id}`);
    runAnalysis(dataUrl);
  };

  window.runDeepSkinVision = async () => {
    const dataUrl = preview()?.src || localStorage.getItem(`skin_scan_latest_photo_${app.id}`);
    if (!dataUrl) {
      setStatus('warning', 'Primero sube una foto o usa la foto demo para activar el analisis profundo.');
      return;
    }

    setStatus('neurology', 'Preparando analisis profundo por zonas...');
    let reading = currentReading;
    if (!reading) reading = await runAnalysis(dataUrl);
    if (!reading) return;

    let deepEl = document.getElementById('skin-scan-deep');
    if (!deepEl) {
      const result = document.getElementById('skin-scan-result');
      if (result) {
        const holder = document.createElement('div');
        holder.id = 'skin-scan-deep';
        holder.className = 'skin-scan-deep';
        result.appendChild(holder);
        deepEl = holder;
      }
    }
    if (deepEl) {
      deepEl.classList.add('show');
      deepEl.innerHTML = `<p class="signal-label">${msIcon('neurology',14)} Analizando imagen, calidad de luz y zonas visibles...</p>`;
    }

    const quizContext = getSkinScanQuizContext();
    const metrics = reading.metrics || {};
    const fallback = buildLocalDeepAnalysis(metrics, quizContext);
    let analysis = fallback;
    let modeNote = 'Modo local avanzado. En produccion se puede conectar a IA de vision real con clave privada.';

    try {
      const remote = await requestVisionSkinAnalysis(dataUrl, metrics, quizContext);
      analysis = normalizeVisionAnalysis(remote, fallback);
      analysis.source = analysis.source || 'openai-vision';
      modeNote = 'Analisis generado con IA de vision conectada.';
      setStatus('task_alt', 'Analisis profundo listo con IA de vision.');
    } catch (error) {
      console.warn('skin vision fallback:', error);
      setStatus('neurology', 'Analisis profundo listo en modo local avanzado. En produccion se conecta a IA de vision real.');
    }

    currentReading.deep = analysis;
    if (deepEl) {
      deepEl.classList.add('show');
      deepEl.innerHTML = renderDeepSkinAnalysis(analysis, modeNote);
      deepEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
  };

  window.clearSkinScanPhoto = () => {
    stopCamera();
    localStorage.removeItem(`skin_scan_latest_photo_${app.id}`);
    currentReading = null;
    if (preview()) preview().removeAttribute('src');
    media()?.classList.remove('has-preview', 'has-camera');
    const result = document.getElementById('skin-scan-result');
    if (result) {
      result.classList.remove('show');
      result.innerHTML = '';
    }
    const deep = document.getElementById('skin-scan-deep');
    if (deep) {
      deep.classList.remove('show');
      deep.innerHTML = '';
    }
    setStatus('delete', 'Foto borrada de este dispositivo. Puedes subir otra cuando quieras.');
  };

  window.saveSkinScanReading = () => {
    if (!currentReading) {
      showToast('Primero realiza una lectura', 'error');
      return;
    }
    history = [currentReading, ...history.filter(item => item.date !== currentReading.date)].slice(0, 8);
    localStorage.setItem(historyKey, JSON.stringify(history));
    showToast('Lectura guardada');
    renderSkinScan(el);
  };

  window.goToSkinScanReto = () => {
    const idx = getAppTypes(currentApp).indexOf('reto');
    if (idx >= 0) showTab(idx);
  };
  window.goToSkinScanQuiz = () => {
    const quizId = currentApp.embeddedQuizId || currentApp.quizId || 'skinglow-skin-quiz';
    window.location.href = `./quiz.html?quiz=${encodeURIComponent(quizId)}&from=skin-scan`;
  };
  window.goToSkinScanDiario = () => {
    const idx = getAppTypes(currentApp).indexOf('diario');
    if (idx >= 0) showTab(idx);
  };

  const latestPhoto = localStorage.getItem(`skin_scan_latest_photo_${app.id}`);
  if (latestPhoto) setPreview(latestPhoto);
}

// â”€â”€ RETO (guided day-by-day, like Código Cuerpo) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderReto(el) {
  const app = currentApp;
  const storageKey = `reto_${app.id}`;
  let done = {};
  try { done = JSON.parse(localStorage.getItem(storageKey)||'{}'); } catch {}

  const configuredDays = app.retoContent || app.content?.retoContent || [];
  const days = (Array.isArray(configuredDays) && configuredDays.length) ? configuredDays : (isEnglishLearningApp(app) ? getDefaultEnglishReto() : []);
  const totalDays = app.retoDays || days.length || 7;
  const completed = Object.values(done).filter(Boolean).length;
  const pct = totalDays ? Math.round(completed/totalDays*100) : 0;

  // If no guided content, show simple grid
  if (!days.length) {
    el.innerHTML = sectionHdr(app.icon||sectionIcon('reto'), app.name, `Reto ${totalDays} días · ${completed} completados`) +
    `<div class="fade-up" style="padding:20px">
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:13px;font-weight:700">${completed}/${totalDays} días</span>
          <span style="font-size:12px;color:var(--accent);font-weight:700">${pct}%</span>
        </div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
        ${Array.from({length:totalDays},(_,i)=>{
          const done2=done[i+1];
          return `<button onclick="toggleSimpleDay(${i+1})" style="aspect-ratio:1;border-radius:10px;border:none;font-size:11px;font-weight:800;cursor:pointer;transition:all .15s;background:${done2?'var(--accent)':'var(--card)'};color:${done2?'#fff':'var(--muted)'};${done2?'box-shadow:0 2px 8px rgba(0,0,0,0.2)':''}">${i+1}</button>`;
        }).join('')}
      </div>
    </div>`;
    window.toggleSimpleDay = (d) => { done[d]=!done[d]; localStorage.setItem(storageKey,JSON.stringify(done)); renderReto(el); };
    return;
  }

  // Guided content
  el.innerHTML = sectionHdr(app.icon||sectionIcon('reto'), app.name, app.description||`Reto ${totalDays} días`) +
  `<div class="fade-up" style="padding:20px">
    <div class="stat-row">
      <div class="stat-pill"><div class="stat-val">${completed}</div><div class="stat-lbl">Completados</div></div>
      <div class="stat-pill"><div class="stat-val">${totalDays-completed}</div><div class="stat-lbl">Restantes</div></div>
      <div class="stat-pill"><div class="stat-val">${pct}%</div><div class="stat-lbl">Progreso</div></div>
    </div>
    <div class="prog-wrap" style="margin-bottom:20px"><div class="prog-bar" style="width:${pct}%"></div></div>
    ${days.map((day,i) => {
      const isDone = !!done[i+1];
      const storageNote = `reto_note_${app.id}_${i+1}`;
      const savedNote = localStorage.getItem(storageNote)||'';
      return `<div class="day-card ${isDone?'completed':''}" id="day-card-${i+1}">
        <div class="day-card-header" onclick="toggleDayCard(${i+1})">
          <div class="day-num ${isDone?'done':''}">${isDone?msIcon('check',16):i+1}</div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:700;${isDone?'color:var(--muted);text-decoration:line-through':''}">${dayIconHtml(day.icon)}${esc(day.title||`Día ${i+1}`)}</div>
          </div>
          <span style="font-size:20px;color:var(--muted);transition:transform .2s" id="day-chevron-${i+1}">${isDone?msIcon('check',18):'›'}</span>
        </div>
        <div id="day-body-${i+1}" class="day-card-body" style="display:none">
          ${day.quote?`<div class="quote-box" style="margin:16px 0">${esc(day.quote)}</div>`:''}
          ${day.instructions?`<p style="font-size:13px;line-height:1.7;margin-bottom:16px;color:var(--text)">${esc(day.instructions)}</p>`:''}
          ${day.reflectionPrompt?`
            <p style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">Tu reflexión</p>
            <textarea class="input" style="width:100%" rows="4" placeholder="${esc(day.reflectionPrompt)}"
              onblur="saveNote(${i+1},this.value)">${esc(savedNote)}</textarea>
          `:''}
          <div style="margin-top:16px">
            ${isDone
              ? `<button class="btn-done" onclick="markDay(${i+1},false)">${msIcon('check_circle',16)} Completado — Desmarcar</button>`
              : `<button class="btn-primary" onclick="markDay(${i+1},true)">Marcar como completado ${msIcon('check',16)}</button>`
            }
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  window.toggleDayCard = (n) => {
    const body = document.getElementById(`day-body-${n}`);
    const chev = document.getElementById(`day-chevron-${n}`);
    const isOpen = body.style.display !== 'none';
    body.style.display = isOpen ? 'none' : 'block';
    if (!done[n]) chev.textContent = isOpen ? '›' : '‹';
  };
  window.saveNote = (n, val) => { localStorage.setItem(`reto_note_${app.id}_${n}`, val); };
  window.markDay = (n, val) => {
    done[n] = val;
    localStorage.setItem(storageKey, JSON.stringify(done));
    renderReto(el);
    if (val) showToast(`¡Día ${n} completado!`);
  };
}
// â”€â”€ CHECKLIST â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderChecklist(el) {
  const storageKey = `checklist_${currentApp.id}`;
  const seedItems = (currentApp.initialItems?.length ? currentApp.initialItems : (isEnglishLearningApp(currentApp) ? getDefaultEnglishTasks() : []));
  const seedVersion = currentApp.contentVersion || currentApp.demoContentVersion || '';
  const versionKey = `${storageKey}_version`;
  if (seedItems.length && seedVersion && localStorage.getItem(versionKey) !== String(seedVersion)) {
    localStorage.setItem(storageKey, JSON.stringify(seedItems.map(t=>({text:t,done:false}))));
    localStorage.setItem(versionKey, String(seedVersion));
  } else if (!localStorage.getItem(storageKey) && seedItems.length) {
    localStorage.setItem(storageKey, JSON.stringify(seedItems.map(t=>({text:t,done:false}))));
    if (seedVersion) localStorage.setItem(versionKey, String(seedVersion));
  }
  let items = JSON.parse(localStorage.getItem(storageKey)||'[]');
  if (!items.length && seedItems.length) items = seedItems.map(t=>({text:t,done:false}));
  function save() { localStorage.setItem(storageKey,JSON.stringify(items)); }
  function draw() {
    const done=items.filter(i=>i.done).length, pct=items.length?Math.round(done/items.length*100):0;
    el.innerHTML=sectionHdr(currentApp.icon||sectionIcon('checklist'), currentApp.name, `${done}/${items.length} completados`) +
    `<div class="fade-up" style="padding:20px">
      <div style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:13px;font-weight:700">${done}/${items.length} completados</span>
          <span style="font-size:12px;color:var(--accent);font-weight:700">${pct}%</span>
        </div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
      </div>
      <div class="card" style="padding:8px 16px;margin-bottom:16px">
        ${items.map((item,i)=>`
          <div class="check-row">
            <div class="check-circle ${item.done?'done':''}" onclick="toggleCheck(${i})">
              ${item.done?'<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2" fill="none"/></svg>':''}
            </div>
            <span style="flex:1;font-size:13px;${item.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(item.text)}</span>
            <button onclick="removeItem(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1">×</button>
          </div>`).join('')}
        ${items.length===0?'<p style="text-align:center;color:var(--muted);padding:24px;font-size:13px">Agrega tu primer ítem</p>':''}
      </div>
      <div style="display:flex;gap:8px">
        <input id="new-check-item" class="input" style="flex:1" placeholder="Agregar ítem..." maxlength="100"
          onkeydown="if(event.key==='Enter')addCheckItem()"/>
        <button class="btn-secondary" onclick="addCheckItem()">+ Agregar</button>
      </div>
    </div>`;
  }
  window.toggleCheck=(i)=>{items[i].done=!items[i].done;save();draw();};
  window.removeItem=(i)=>{items.splice(i,1);save();draw();};
  window.addCheckItem=()=>{const inp=document.getElementById('new-check-item');const t=inp.value.trim();if(!t)return;items.push({text:t,done:false});save();draw();};
  draw();
}

// â”€â”€ TRACKER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderTracker(el) {
  const storageKey = `tracker_${currentApp.id}`;
  const days = currentApp.trackerDays || 30;
  let data = JSON.parse(localStorage.getItem(storageKey)||`{"checked":[]}`);
  const checked = new Set(data.checked||[]);
  const today = new Date().toISOString().split('T')[0];
  function save() { data.checked=[...checked]; localStorage.setItem(storageKey,JSON.stringify(data)); }
  function streak() {
    let s=0,d=new Date(today);
    while(checked.has(d.toISOString().split('T')[0])){s++;d.setDate(d.getDate()-1);}
    return s;
  }
  function draw() {
    const todayDone=checked.has(today);
    const s=streak(), pct=days?Math.round(checked.size/days*100):0;
    el.innerHTML=sectionHdr(currentApp.icon||sectionIcon('tracker'), currentApp.name, currentApp.description||`Hábito de ${days} días`) +
    `<div class="fade-up" style="padding:20px">
      <div class="stat-row">
        <div class="stat-pill"><div class="stat-val">${s}</div><div class="stat-lbl">${msIcon('local_fire_department',14)} Racha</div></div>
        <div class="stat-pill"><div class="stat-val">${checked.size}</div><div class="stat-lbl">Días</div></div>
        <div class="stat-pill"><div class="stat-val">${pct}%</div><div class="stat-lbl">Logrado</div></div>
      </div>
      ${currentApp.trackerHabit?`<div class="quote-box" style="margin-bottom:16px">"${esc(currentApp.trackerHabit)}"</div>`:''}
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px">
        ${Array.from({length:days},(_,i)=>{
          const d=new Date();d.setDate(d.getDate()-(days-1-i));
          const key=d.toISOString().split('T')[0];
          const isToday=key===today, done=checked.has(key);
          return `<button onclick="toggleTrackerDay('${key}')" class="tracker-dot" title="${key}" style="aspect-ratio:1;border-radius:9px;border:${isToday?'2px solid var(--accent)':'1px solid var(--border)'};font-size:10px;font-weight:800;cursor:pointer;background:${done?'var(--accent)':'var(--card)'};color:${done?'#fff':isToday?'var(--accent)':'var(--muted)'};${done?'box-shadow:0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent)':''}">${i+1}</button>`;
        }).join('')}
      </div>
      <button onclick="toggleTrackerDay('${today}')" class="${todayDone?'btn-done':'btn-primary'}">
        ${todayDone?msIcon('check_circle',16)+' Hoy completado — Desmarcar':'Marcar hoy como completado '+msIcon('check',16)}
      </button>
    </div>`;
  }
  window.toggleTrackerDay=(key)=>{if(checked.has(key))checked.delete(key);else checked.add(key);save();if(!checked.has(key)||key===today)draw();else{showToast('¡Día marcado!');draw();}};
  draw();
}

// â”€â”€ PLANIFICADOR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderPlanificador(el) {
  const storageKey=`plan_${currentApp.id}`;
  const seedTasks = (currentApp.initialTasks?.length ? currentApp.initialTasks : (isEnglishLearningApp(currentApp) ? getDefaultEnglishTasks() : []));
  if(!localStorage.getItem(storageKey)&&seedTasks.length){
    localStorage.setItem(storageKey,JSON.stringify(seedTasks.map(t=>({text:t,done:false}))));
  }
  let tasks=JSON.parse(localStorage.getItem(storageKey)||'[]');
  if (!tasks.length && seedTasks.length) tasks = seedTasks.map(t=>({text:t,done:false}));
  function save(){localStorage.setItem(storageKey,JSON.stringify(tasks));}
  function draw(){
    const done=tasks.filter(t=>t.done).length, pct=tasks.length?Math.round(done/tasks.length*100):0;
    el.innerHTML=sectionHdr(currentApp.icon||sectionIcon('planificador'), currentApp.name, currentApp.description||`${done}/${tasks.length} completadas`) +
    `<div class="fade-up" style="padding:20px">
      ${tasks.length>0?`<div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:12px;font-weight:700;color:var(--muted)">${done}/${tasks.length} completadas</span>
          <span style="font-size:12px;color:var(--accent);font-weight:800">${pct}%</span>
        </div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
      </div>`:''}
      <div class="card" style="padding:8px 16px;margin-bottom:16px">
        ${tasks.map((t,i)=>`
          <div class="check-row">
            <div class="check-circle ${t.done?'done':''}" onclick="toggleTask(${i})">
              ${t.done?'<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2" fill="none"/></svg>':''}
            </div>
            <span style="flex:1;font-size:13px;line-height:1.4;${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.text)}</span>
            <button onclick="removeTask(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px">×</button>
          </div>`).join('')}
        ${tasks.length===0?'<p style="text-align:center;color:var(--muted);padding:24px;font-size:13px">Agrega tu primera tarea</p>':''}
      </div>
      <div style="display:flex;gap:8px">
        <input id="new-task" class="input" style="flex:1" placeholder="Nueva tarea..." maxlength="200" onkeydown="if(event.key==='Enter')addTask()"/>
        <button class="btn-secondary" onclick="addTask()">+ Agregar</button>
      </div>
    </div>`;
  }
  window.toggleTask=(i)=>{tasks[i].done=!tasks[i].done;save();draw();};
  window.removeTask=(i)=>{tasks.splice(i,1);save();draw();};
  window.addTask=()=>{const inp=document.getElementById('new-task');const t=inp.value.trim();if(!t)return;tasks.push({text:t,done:false});save();inp.value='';draw();};
  draw();
}

// â”€â”€ CALCULADORA â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderCalculadora(el) {
  const calcConfig = getCalcConfig(currentApp);
  const fields=calcConfig.fields || [];
  el.innerHTML=sectionHdr(currentApp.icon||sectionIcon('calculadora'), currentApp.name, currentApp.description||'Calcula tu resultado') +
  `<div class="fade-up" style="padding:20px">
    <div class="soft-note" style="margin:0 0 14px">Esta calculadora mide una carga orientativa con los valores que escribes. No es un diagnóstico; te ayuda a elegir qué hacer después.</div>
    <div class="card" style="padding:20px;margin-bottom:12px">
      ${fields.map(f=>`
        <div style="margin-bottom:16px">
          <p style="font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">${esc(f.label||f.id)}</p>
          <input id="calc-${f.id}" type="number" class="input" style="width:100%;font-size:16px;font-weight:700" placeholder="${esc(f.placeholder||'0')}"/>
        </div>`).join('')}
      <button class="btn-primary" onclick="calcResult()">${msIcon('calculate',16)} Calcular</button>
    </div>
    <div id="calc-result" class="card-dark" style="padding:24px;text-align:center;display:none">
      <p style="font-size:11px;opacity:.8;margin-bottom:4px;color:#fff">${esc(calcConfig.label || currentApp.calcResultLabel || 'Tu resultado')}</p>
      <p id="calc-result-val" style="font-size:42px;font-weight:900;color:#fff;line-height:1.1"></p>
      ${calcConfig.unit?`<p style="font-size:14px;opacity:.75;color:#fff;margin-top:4px">${esc(calcConfig.unit)}</p>`:''}
      <div style="height:1px;background:rgba(255,255,255,.18);margin:18px 0"></div>
      <p id="calc-result-title" style="font-size:17px;font-weight:900;color:#fff;margin-bottom:8px"></p>
      <p id="calc-result-copy" style="font-size:13px;line-height:1.65;color:#fff;opacity:.88;margin-bottom:10px"></p>
      <p id="calc-result-action" style="font-size:12px;line-height:1.55;color:#fff;opacity:.75"></p>
    </div>
  </div>`;
  window.calcResult=()=>{
    try{
      const vals={};fields.forEach(f=>{vals[f.id]=parseFloat(document.getElementById(`calc-${f.id}`)?.value||0);});
      const formula=String(calcConfig.formula || currentApp.calcFormula || fields.map(f=>f.id).join('+') || '0');
      let res;
      if (/^[\d\s+\-*/().a-zA-Z_]+$/.test(formula)) {
        const expr = formula.replace(/\b[a-zA-Z_]\w*\b/g, name => Object.prototype.hasOwnProperty.call(vals, name) ? `vals.${name}` : '0');
        res = Function('vals', `return (${expr});`)(vals);
      } else {
        res = Object.values(vals).reduce((sum, n) => sum + (Number(n) || 0), 0);
      }
      const resEl=document.getElementById('calc-result');
      const safeRes = Number.isFinite(res) ? res : 0;
      const reading = getCalcInterpretation(safeRes, currentApp);
      document.getElementById('calc-result-val').textContent=Number.isInteger(safeRes)?safeRes:safeRes.toFixed(2);
      document.getElementById('calc-result-title').textContent = reading.title;
      document.getElementById('calc-result-copy').textContent = reading.copy;
      document.getElementById('calc-result-action').textContent = reading.action;
      resEl.style.display='block';
      resEl.scrollIntoView({behavior:'smooth',block:'nearest'});
    }catch(e){showToast('Error en cálculo','error');}
  };
}

  window.inspireEnglishReply = () => {

    showToast('Escuchando... habla en inglés');
    rec.onresult = event => {
      const transcript = event.results?.[0]?.[0]?.transcript || '';
      if (input) {
        input.value = transcript;
        input.focus();
      }
    };
    rec.onerror = () => showToast('No pude escuchar el micrófono. Revisa permisos del navegador.', 'error');
    try { rec.start(); } catch { showToast('El micrófono ya está activo o no pudo iniciar.', 'error'); }
  };
  window.sendEnglishRoleplay = async () => {
    const input = document.getElementById('roleplay-input');
    const text = input?.value.trim();
    if (!text) return;
    input.value = '';
    appendRoleMsg('user', text);
    messages.push({role:'user', content:text});
    const tid = `rp-${Date.now()}`;
    appendRoleMsg('bot', '...', tid);
    const scene = customScene || scenes[activeIndex] || scenes[0];
    const systemPrompt = [
      'Eres un tutor de inglés para hispanohablantes.',
      `Escenario: ${scene.title}. Objetivo: ${scene.objective || scene.prompt || ''}.`,
      'Haz role-play realista. Responde principalmente en inglés sencillo.',
      'Después de cada respuesta del usuario, corrige máximo 1 error y da una frase más natural.',
      'Pregunta una sola cosa por turno. Mantén respuestas cortas y útiles.'
    ].join(' ');
    try {
      const ai = await callCreatorAI({systemPrompt, messages:messages.slice(-8), maxTokens:260, mode:'chat', temperature:0.35});
      const reply = ai.content;
      document.getElementById(tid)?.remove();
      messages.push({role:'assistant', content:reply});
      appendRoleMsg('bot', reply);
      if (ai.fallback) showToast('Modo prueba: respuesta local porque la IA no respondió.');
    } catch (e) {
      document.getElementById(tid)?.remove();
      const reply = 'Good start. Try this natural version: “I would like to practice this situation.” Now answer this: What do you need in this scene?';
      messages.push({role:'assistant', content:reply});
      appendRoleMsg('bot', reply);
    }
  };

  if (activeIndex >= 0 && scenes[activeIndex]) drawScene(scenes[activeIndex]);
  else drawList();
}

// â”€â”€ FLASHCARDS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderFlashcards(el) {
  const configured=currentApp.cards||currentApp.content?.cards||[];
  const generatedKey=`generated_cards_${currentApp.id}`;
  let generatedCards=[];
  try { generatedCards=JSON.parse(localStorage.getItem(generatedKey)||'[]'); } catch {}
  generatedCards=Array.isArray(generatedCards)?generatedCards.filter(Boolean):[];
  const baseCards=isEnglishLearningApp(currentApp)
    ? getEnglishCardsForApp(currentApp)
    : ((Array.isArray(configured) && configured.length)
      ? configured
      : (currentApp.initialItems?.length ? currentApp.initialItems.map(t=>({front:t,back:''})) : []));
  let cards=[...baseCards, ...generatedCards];
  let idx=0,flipped=false,known=0,unknown=0,answerMode='es';
  const shuffle = arr => arr.map(v=>({v,sort:Math.random()})).sort((a,b)=>a.sort-b.sort).map(item=>item.v);
  const cardText = (card, side) => side === 'back'
    ? readableText(card?.back ?? card?.answer ?? card?.definition, 'Sin respuesta')
    : readableText(card?.front ?? card?.term ?? card?.question ?? card, '');
  const answerTarget = (card) => answerMode === 'en' ? cardText(card, 'front') : cardText(card, 'back');
  const answerPrompt = (card) => answerMode === 'en' ? cardText(card, 'back') : cardText(card, 'front');
  const scoreCardAnswer = (answer, expected) => {
    const a = normalizeText(answer).replace(/[^a-z0-9ñ\s]/g,' ').replace(/\s+/g,' ').trim();
    const e = normalizeText(expected).replace(/[^a-z0-9ñ\s]/g,' ').replace(/\s+/g,' ').trim();
    if (!a || !e) return 0;
    if (a.length > 4 && (e.includes(a) || a.includes(e))) return 1;
    const stop = new Set('the a an and or to in of is are am i you we they it this that for with como que para por una uno el la los las de del y o en es soy estoy esta este un al me mi tu te se si no do does did have has had would could please'.split(' '));
    const aw = a.split(' ').filter(w => w.length > 2 && !stop.has(w));
    const ew = e.split(' ').filter(w => w.length > 2 && !stop.has(w));
    if (!aw.length || !ew.length) return 0;
    const eSet = new Set(ew);
    const overlap = aw.filter(w => eSet.has(w)).length;
    return Math.max(overlap / Math.max(1, Math.min(ew.length, aw.length)), overlap / Math.max(1, ew.length));
  };
  const pronunciationScore = (spoken, expected, confidence = 0) => {
    const similarity = scoreCardAnswer(spoken, expected);
    return Math.round(Math.min(1, similarity * 0.82 + Math.max(0, confidence || 0) * 0.18) * 100);
  };
  const listenBtn = (side, label) => `
    <button type="button" onclick="event.stopPropagation();speakFC('${side}',this)" style="margin-top:16px;border:1px solid var(--border);background:color-mix(in srgb,var(--accent) 9%,var(--card));color:var(--accent);border-radius:999px;padding:9px 12px;font:inherit;font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">
      ${msIcon('volume_up',15)} ${label}
    </button>`;
  const localGeneratedCards = topic => {
    const t = cleanText(topic || 'conversación diaria').trim();
    if (isEnglishLearningApp(currentApp)) {
      return [
        {front:`I need to practice ${t}.`, back:`Necesito practicar ${t}. Frase base para explicar tu objetivo.`},
        {front:`Could you help me with ${t}?`, back:`¿Podrías ayudarme con ${t}? Pregunta educada y natural.`},
        {front:`Let me try again.`, back:'Déjame intentarlo otra vez. Útil cuando te corriges sin bloquearte.'},
        {front:`What is the best way to say this?`, back:'¿Cuál es la mejor forma de decir esto? Sirve para pedir corrección.'},
        {front:`I’m not sure, but I think...`, back:'No estoy seguro/a, pero creo que... Te ayuda a responder aunque no tengas certeza.'},
        {front:`Can you give me an example?`, back:'¿Puedes darme un ejemplo? Muy útil para aprender con contexto.'}
      ];
    }
    return [
      {front:`Concepto clave: ${t}`, back:`Explica ${t} con tus palabras y escribe un ejemplo real.`},
      {front:`Pregunta sobre ${t}`, back:`¿Qué parte de ${t} necesito practicar o aclarar hoy?`},
      {front:'Acción pequeña', back:`Elige una acción de 10 minutos relacionada con ${t}.`},
      {front:'Señal de avance', back:`¿Cómo sabré que mejoré en ${t}? Define una evidencia.`}
    ];
  };
  const parseGeneratedCards = raw => {
    const text = cleanText(raw || '').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
    const candidates = [text];
    const objMatch = text.match(/\{[\s\S]*\}/);
    const arrMatch = text.match(/\[[\s\S]*\]/);
    if (objMatch) candidates.push(objMatch[0]);
    if (arrMatch) candidates.push(arrMatch[0]);
    for (const candidate of candidates) {
      try {
        const parsed = JSON.parse(candidate);
        const list = Array.isArray(parsed) ? parsed : (parsed.cards || parsed.flashcards || parsed.items || []);
        const normalized = list.map(item => ({
          front:readableText(item.front ?? item.term ?? item.question ?? item.q, ''),
          back:readableText(item.back ?? item.answer ?? item.definition ?? item.a, '')
        })).filter(item => item.front && item.back);
        if (normalized.length) return normalized;
      } catch {}
    }
    return [];
  };
  function draw(){
    if(!cards.length){el.innerHTML=`<p style="text-align:center;padding:40px;color:var(--muted)">No hay flashcards.</p>`;return;}
    const card=cards[idx];
    const frontText = cardText(card, 'front');
    const backText = cardText(card, 'back');
    const modeIsEnglish = answerMode === 'en';
    const modeBtn = (mode, label) => `
      <button type="button" onclick="setFCAnswerMode('${mode}')" style="flex:1;border:1px solid ${answerMode===mode?'var(--accent)':'var(--border)'};background:${answerMode===mode?'var(--btn)':'var(--card)'};color:${answerMode===mode?'#fff':'var(--text)'};border-radius:999px;padding:9px 10px;font:inherit;font-size:12px;font-weight:900;cursor:pointer">${label}</button>`;
    el.innerHTML=sectionHdr(currentApp.icon||sectionIcon('flashcards'), currentApp.name, `${idx+1} de ${cards.length} tarjetas`) +
    `<div class="fade-up" style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px">
        <span style="font-size:13px;color:var(--muted);font-weight:700">${idx+1} / ${cards.length}</span>
        <span style="font-size:12px;display:flex;align-items:center;gap:10px">
          ${isEnglishLearningApp(currentApp)?`<button type="button" onclick="shuffleFC()" style="border:1px solid var(--border);background:var(--card);color:var(--accent);border-radius:999px;padding:5px 9px;font:inherit;font-size:11px;font-weight:900">${msIcon('shuffle',13)} Barajar</button>`:''}
          <span style="color:var(--success);font-weight:800">${msIcon('check',14)} ${known}</span>
          <span style="color:#e55;font-weight:800">${msIcon('close',14)} ${unknown}</span>
        </span>
      </div>
      <div class="prog-wrap" style="margin-bottom:16px"><div class="prog-bar" style="width:${Math.round(idx/cards.length*100)}%"></div></div>
      <div class="card" style="padding:14px 15px;margin-bottom:14px;border-radius:20px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 18%,var(--border))">
        <p style="font-size:12px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">${msIcon('auto_awesome',15)} Generar nuevas cards</p>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="fc-gen-topic" class="input" style="flex:1;min-width:0" type="text" placeholder="${isEnglishLearningApp(currentApp)?'Ej: entrevista, viajes, verbos, restaurante':'Tema para nuevas tarjetas'}"/>
          <button id="fc-gen-btn" type="button" onclick="generateFC()" style="width:auto;border:none;border-radius:15px;background:var(--btn);color:#fff;padding:12px 13px;font:inherit;font-size:12px;font-weight:900;display:inline-flex;align-items:center;gap:5px;cursor:pointer">${msIcon('add',15)} Crear</button>
        </div>
        <p style="font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px">Se agregan a esta app y quedan guardadas en este navegador.</p>
