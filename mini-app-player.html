      <div class="flip-card" onclick="flipFC()" style="min-height:200px;cursor:pointer;margin-bottom:16px">
        <div class="flip-inner ${flipped?'flipped':''}" style="min-height:200px">
          <div class="flip-face" style="border-radius:var(--radius)">
            <p style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:12px">Pregunta</p>
            <p class="serif" style="font-size:17px;font-weight:600;line-height:1.4">${esc(frontText)}</p>
            ${listenBtn('front', isEnglishLearningApp(currentApp) ? 'Escuchar frase' : 'Escuchar')}
            <p style="font-size:11px;color:var(--accent);margin-top:20px;font-weight:700">${msIcon('touch_app',14)} Toca para ver respuesta</p>
          </div>
          <div class="flip-face back" style="border-radius:var(--radius)">
            <p style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:12px">Respuesta</p>
            <p class="serif" style="font-size:17px;font-weight:600;line-height:1.4">${esc(backText)}</p>
            ${listenBtn('back', 'Escuchar respuesta')}
          </div>
        </div>
      </div>
      <div class="card" style="padding:14px 15px;margin-bottom:14px;border-radius:20px">
        <p style="font-size:12px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px">${msIcon('edit_note',15)} Practicar respuesta</p>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          ${modeBtn('es','Responder en español')}
          ${modeBtn('en','Responder en inglés')}
        </div>
        <div style="border:1px dashed var(--border);border-radius:16px;padding:11px 12px;margin-bottom:10px;background:var(--card2)">
          <p style="font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">${modeIsEnglish?'Pista en español':'Frase en inglés'}</p>
          <p style="font-size:13px;color:var(--text);line-height:1.45">${esc(answerPrompt(card))}</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="fc-answer-input" class="input" style="flex:1;min-width:0" type="text" placeholder="${modeIsEnglish?'Escribe la frase en inglés...':'Escribe la respuesta en español...'}" onkeydown="if(event.key==='Enter')checkFCAnswer()"/>
          <button type="button" onclick="checkFCAnswer()" style="width:auto;border:none;border-radius:15px;background:var(--btn);color:#fff;padding:12px 13px;font:inherit;font-size:12px;font-weight:900;display:inline-flex;align-items:center;gap:5px;cursor:pointer">${msIcon('check_circle',15)} Revisar</button>
        </div>
        <div id="fc-answer-feedback" style="display:none;margin-top:10px;border-radius:15px;padding:10px 12px;font-size:12px;line-height:1.5"></div>
      </div>
      ${isEnglishLearningApp(currentApp)?`
      <div class="card" style="padding:14px 15px;margin-bottom:14px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 8%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--accent) 18%,var(--border))">
        <p style="font-size:12px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px">${msIcon('record_voice_over',15)} Pronunciación</p>
        <div style="border:1px dashed var(--border);border-radius:16px;padding:11px 12px;margin-bottom:10px;background:var(--card)">
          <p style="font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Lee en voz alta</p>
          <p style="font-size:14px;color:var(--text);line-height:1.45;font-weight:800">${esc(frontText)}</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button id="fc-pronounce-btn" type="button" onclick="startFCPronunciation()" style="flex:1;min-width:145px;border:none;border-radius:16px;background:var(--btn);color:#fff;padding:12px 13px;font:inherit;font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">${msIcon('mic',16)} Hablar y calificar</button>
          <button type="button" onclick="speakFC('front',this)" style="border:1px solid var(--border);background:var(--card);color:var(--accent);border-radius:16px;padding:12px 13px;font:inherit;font-size:12px;font-weight:900;display:inline-flex;align-items:center;gap:6px;cursor:pointer">${msIcon('volume_up',15)} Modelo</button>
        </div>
        <div id="fc-pronunciation-feedback" style="display:none;margin-top:10px;border-radius:15px;padding:10px 12px;font-size:12px;line-height:1.5"></div>
      </div>`:''}
      <div style="display:flex;gap:8px">
        <button onclick="prevFC()" class="btn-secondary" style="width:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px">‹</button>
        <button onclick="markFC('no')" style="flex:1;padding:12px;border-radius:50px;border:2px solid #e55;background:transparent;color:#e55;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s">${msIcon('close',14)} No sabía</button>
        <button onclick="markFC('yes')" style="flex:1;padding:12px;border-radius:50px;border:2px solid var(--success);background:transparent;color:var(--success);font-weight:800;font-size:13px;cursor:pointer;transition:all .15s">${msIcon('check',14)} Lo sabía</button>
        <button onclick="nextFC()" class="btn-secondary" style="width:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px">›</button>
      </div>
    </div>`;
  }
  window.flipFC=()=>{flipped=!flipped;draw();};
  window.nextFC=()=>{flipped=false;idx=(idx+1)%cards.length;draw();};
  window.prevFC=()=>{flipped=false;idx=(idx-1+cards.length)%cards.length;draw();};
  window.markFC=(r)=>{if(r==='yes')known++;else unknown++;flipped=false;idx=(idx+1)%cards.length;draw();};
  window.shuffleFC=()=>{cards=shuffle(cards);idx=0;flipped=false;draw();showToast('Tarjetas mezcladas');};
  window.setFCAnswerMode=(mode)=>{answerMode=mode==='en'?'en':'es';draw();};
  window.checkFCAnswer=()=>{
    const input=document.getElementById('fc-answer-input');
    const feedback=document.getElementById('fc-answer-feedback');
    const answer=input?.value.trim() || '';
    if(!answer){showToast('Escribe tu respuesta primero','error');return;}
    const expected=answerTarget(cards[idx]);
    const score=scoreCardAnswer(answer, expected);
    const good=score>=0.62;
    const close=score>=0.35;
    if(feedback){
      feedback.style.display='block';
      feedback.style.background=good?'color-mix(in srgb,var(--success) 12%,var(--card))':close?'color-mix(in srgb,var(--accent) 10%,var(--card))':'color-mix(in srgb,#e55 10%,var(--card))';
      feedback.style.border=`1px solid ${good?'color-mix(in srgb,var(--success) 28%,var(--border))':close?'color-mix(in srgb,var(--accent) 24%,var(--border))':'color-mix(in srgb,#e55 22%,var(--border))'}`;
      feedback.style.color='var(--text)';
      feedback.innerHTML=good
        ? `<strong style="color:var(--success)">Bien.</strong> Tu respuesta coincide bastante.`
        : close
          ? `<strong style="color:var(--accent)">Casi.</strong> Vas bien, pero revisa la frase esperada:<br><span style="color:var(--muted)">${esc(expected)}</span>`
          : `<strong style="color:#e55">Revisa.</strong> Respuesta esperada:<br><span style="color:var(--muted)">${esc(expected)}</span>`;
    }
  };
  window.speakFC=(side,btn)=>{
    const card=cards[idx];
    const text=cardText(card, side);
    if(!text){showToast('No hay texto para reproducir','error');return;}
    speakButtonText(text, btn);
  };
  window.startFCPronunciation=async()=>{
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const feedback=document.getElementById('fc-pronunciation-feedback');
    const btn=document.getElementById('fc-pronounce-btn');
    const expected=cardText(cards[idx], 'front');
    const resetBtn=()=>{if(btn){btn.disabled=false;btn.innerHTML=msIcon('mic',16)+' Hablar y calificar';}};
    const showPronunciationError=(title, body)=>{
      if(feedback){
        feedback.style.display='block';
        feedback.style.background='color-mix(in srgb,#e55 10%,var(--card))';
        feedback.style.border='1px solid color-mix(in srgb,#e55 22%,var(--border))';
        feedback.style.color='var(--text)';
        feedback.innerHTML=`<strong style="color:#e55">${esc(title)}</strong> ${esc(body)}`;
      }
    };
    if (!SpeechRecognition) {
      showPronunciationError('Reconocimiento no disponible.', 'Este navegador no permite calificar pronunciación aquí. Prueba en Chrome o Edge.');
      return;
    }
    if(!expected){showToast('No hay frase para pronunciar','error');return;}
    stopVoice();
    if(btn){btn.disabled=true;btn.innerHTML=msIcon('settings_voice',16)+' Permiso...';}
    if (navigator.mediaDevices?.getUserMedia) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
        stream.getTracks().forEach(track=>track.stop());
      } catch(err) {
        resetBtn();
        const name = err?.name || '';
        if (/NotAllowed|Permission/i.test(name)) showPronunciationError('Permiso de micrófono bloqueado.', 'Activa el micrófono para esta página y vuelve a intentar.');
        else if (/NotFound|DevicesNotFound/i.test(name)) showPronunciationError('No encontré micrófono.', 'Conecta o activa un micrófono en tu equipo.');
        else if (/NotReadable|TrackStart/i.test(name)) showPronunciationError('El micrófono está ocupado.', 'Cierra otra app que esté usando el micrófono e intenta otra vez.');
        else showPronunciationError('No pude activar el micrófono.', 'Revisa permisos del navegador y vuelve a intentar.');
        return;
      }
    }
    const rec=new SpeechRecognition();
    rec.lang='en-US';
    rec.interimResults=false;
    rec.maxAlternatives=1;
    if(btn){btn.disabled=true;btn.innerHTML=msIcon('graphic_eq',16)+' Escuchando...';}
    if(feedback){
      feedback.style.display='block';
      feedback.style.background='color-mix(in srgb,var(--accent) 8%,var(--card))';
      feedback.style.border='1px solid color-mix(in srgb,var(--accent) 20%,var(--border))';
      feedback.style.color='var(--text)';
      feedback.innerHTML='Habla claro en inglés. Te escucho...';
    }
    let gotResult=false;
    let gotError=false;
    rec.onresult=event=>{
      gotResult=true;
      const result=event.results?.[0]?.[0];
      const transcript=cleanText(result?.transcript || '');
      const confidence=Number(result?.confidence || 0);
      const pct=pronunciationScore(transcript, expected, confidence);
      const good=pct>=78;
      const close=pct>=52;
      if(feedback){
        feedback.style.background=good?'color-mix(in srgb,var(--success) 12%,var(--card))':close?'color-mix(in srgb,var(--accent) 10%,var(--card))':'color-mix(in srgb,#e55 10%,var(--card))';
        feedback.style.border=`1px solid ${good?'color-mix(in srgb,var(--success) 28%,var(--border))':close?'color-mix(in srgb,var(--accent) 24%,var(--border))':'color-mix(in srgb,#e55 22%,var(--border))'}`;
        feedback.innerHTML=`
          <strong style="color:${good?'var(--success)':close?'var(--accent)':'#e55'}">${good?'Muy bien':close?'Casi':'Intenta otra vez'} · ${pct}%</strong><br>
          <span style="color:var(--muted)">Te entendí:</span> ${esc(transcript || 'No pude captar la frase.')}<br>
          <span style="color:var(--muted)">Modelo:</span> ${esc(expected)}
        `;
      }
    };
    rec.onerror=event=>{
      gotError=true;
      const error=event?.error || '';
      if (error === 'no-speech') showPronunciationError('No detecté voz.', 'Intenta hablar un poco más fuerte y cerca del micrófono.');
      else if (error === 'audio-capture') showPronunciationError('No hay entrada de audio.', 'El navegador no encontró un micrófono activo.');
      else if (error === 'not-allowed' || error === 'service-not-allowed') showPronunciationError('Servicio de voz bloqueado.', 'El micrófono puede estar permitido, pero este navegador no dejó usar reconocimiento de voz. Abre este mismo link en Chrome o Edge normal.');
      else if (error === 'network') showPronunciationError('Servicio de voz no disponible.', 'El micrófono sí puede estar activo, pero el navegador interno no tiene acceso al servicio que convierte voz a texto. Para calificar pronunciación, abre este mismo link en Chrome o Edge normal con internet.');
      else if (error === 'aborted') showPronunciationError('Escucha cancelada.', 'Vuelve a tocar Hablar y calificar.');
      else showPronunciationError('No pude escuchar.', `Error del navegador: ${error || 'desconocido'}.`);
    };
    rec.onend=()=>{
      resetBtn();
      if(!gotResult && !gotError && feedback){
        showPronunciationError('No recibí audio.', 'Intenta de nuevo hablando después de tocar el botón.');
      }
    };
    try { rec.start(); } catch { resetBtn(); showToast('El micrófono ya está activo o no pudo iniciar.','error'); }
  };
  window.generateFC=async()=>{
    const input=document.getElementById('fc-gen-topic');
    const btn=document.getElementById('fc-gen-btn');
    const topic=input?.value.trim() || (isEnglishLearningApp(currentApp) ? 'daily conversation' : (currentApp.niche || currentApp.name || 'tema principal'));
    if(btn){btn.disabled=true;btn.innerHTML=msIcon('hourglass_top',15)+' Creando...';}
    const systemPrompt = isEnglishLearningApp(currentApp)
      ? 'Eres un profesor de inglés para hispanohablantes. Devuelve SOLO JSON válido con esta forma exacta: {"cards":[{"front":"frase en inglés","back":"traducción o explicación breve en español"}]}. Crea tarjetas útiles, naturales y cortas. No uses markdown.'
      : 'Eres un creador de tarjetas de estudio. Devuelve SOLO JSON válido con esta forma exacta: {"cards":[{"front":"pregunta o concepto","back":"respuesta breve"}]}. No uses markdown.';
    const userPrompt = `Crea 6 flashcards nuevas sobre: ${topic}. App: ${displayAppName(currentApp)}. Nicho: ${currentApp.niche || currentApp.category || ''}.`;
    try {
      const ai=await callCreatorAI({systemPrompt,messages:[{role:'user',content:userPrompt}],maxTokens:650,mode:'flashcards',temperature:0.45});
      let fresh=parseGeneratedCards(ai.content);
      if(!fresh.length) fresh=localGeneratedCards(topic);
      const existing=new Set(cards.map(card=>normalizeText(cardText(card,'front'))));
      fresh=fresh.filter(card=>!existing.has(normalizeText(card.front))).slice(0,8);
      if(!fresh.length){showToast('No encontré tarjetas nuevas distintas. Prueba otro tema.','error');return;}
      generatedCards=[...generatedCards,...fresh];
      localStorage.setItem(generatedKey,JSON.stringify(generatedCards));
      cards=[...cards,...fresh];
      idx=Math.max(0,cards.length-fresh.length);
      flipped=false;
      if(input) input.value='';
      draw();
      showToast(`${fresh.length} cards nuevas agregadas`);
    } catch(e) {
      const fresh=localGeneratedCards(topic);
      generatedCards=[...generatedCards,...fresh];
      localStorage.setItem(generatedKey,JSON.stringify(generatedCards));
      cards=[...cards,...fresh];
      idx=Math.max(0,cards.length-fresh.length);
      flipped=false;
      draw();
      showToast('Agregué cards locales de ejemplo');
    } finally {
      const currentBtn=document.getElementById('fc-gen-btn');
      if(currentBtn){currentBtn.disabled=false;currentBtn.innerHTML=msIcon('add',15)+' Crear';}
    }
  };
  draw();
}

// â”€â”€ GLOSARIO â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderGlosario(el) {
  const configured=currentApp.glossaryTerms||currentApp.content?.glossaryTerms||[];
  const terms=(Array.isArray(configured) && configured.length)
    ? configured
    : (currentApp.initialItems?.length ? currentApp.initialItems.map(t=>({term:t,def:''})) : (isEnglishLearningApp(currentApp) ? getDefaultEnglishGlossary() : []));
  el.innerHTML=sectionHdr(currentApp.icon||sectionIcon('glosario'), currentApp.name||'Glosario', `${terms.length} términos`) +
  `<div class="fade-up" style="padding:20px">
    <div style="position:relative;margin-bottom:16px">
      <input id="glos-q" class="input" style="width:100%;padding-left:40px" oninput="filterGlos()" placeholder="Buscar término..."/>
      <span class="material-symbols-outlined" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px">search</span>
    </div>
    <div id="glos-list">
      ${terms.map((t,i)=>`
        <div class="glos-item card" style="margin-bottom:8px;overflow:hidden">
          <div onclick="toggleGlos(${i})" style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer">
            <div style="width:32px;height:32px;border-radius:8px;background:var(--btn);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0">${(t.term||t).charAt(0).toUpperCase()}</div>
            <p style="font-weight:700;font-size:13px;flex:1">${esc(t.term||t)}</p>
            <span id="glos-chev-${i}" style="color:var(--muted);font-size:18px;transition:transform .2s">+</span>
          </div>
          <div id="glos-def-${i}" style="display:none;padding:0 16px 14px 60px;font-size:13px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border)">${esc(t.def||'Definición próximamente.')}</div>
        </div>`).join('')}
      ${terms.length===0?'<p style="text-align:center;padding:40px;color:var(--muted);font-size:13px">Sin términos configurados.</p>':''}
    </div>
  </div>`;
  window.filterGlos=()=>{const q=document.getElementById('glos-q')?.value.toLowerCase()||'';document.querySelectorAll('.glos-item').forEach(item=>item.style.display=item.textContent.toLowerCase().includes(q)?'':'none');};
  window.toggleGlos=(i)=>{
    const d=document.getElementById(`glos-def-${i}`),c=document.getElementById(`glos-chev-${i}`);
    const open=d.style.display!=='none';d.style.display=open?'none':'block';
    c.textContent=open?'+':'âˆ’';c.style.transform=open?'rotate(0)':'rotate(45deg)';
  };
}

// â”€â”€ ROADMAP â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderRoadmap(el) {
  const steps=(currentApp.roadmapSteps && currentApp.roadmapSteps.length)
    ? currentApp.roadmapSteps
    : (isEnglishLearningApp(currentApp) ? getDefaultEnglishRoadmap() : (currentApp.initialTasks||currentApp.initialItems||[]));
  if (isEnglishLearningApp(currentApp)) {
    renderEnglishRoadmap(el);
    return;
  }
  const storageKey=`roadmap_${currentApp.id}`;
  let done=JSON.parse(localStorage.getItem(storageKey)||'{}');
  function draw(){
    const completed=Object.values(done).filter(Boolean).length,total=steps.length;
    const pct=total?Math.round(completed/total*100):0;
    el.innerHTML=sectionHdr(currentApp.icon||sectionIcon('roadmap'), currentApp.name||'Tu Roadmap', `${completed}/${total} pasos completados`) +
    `<div class="fade-up" style="padding:20px">
      <div style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:12px;font-weight:700;color:var(--muted)">Progreso</span>
          <span style="font-size:12px;color:var(--accent);font-weight:800">${pct}%</span>
        </div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
      </div>
      <div style="position:relative;padding-left:36px">
        ${steps.map((s,i)=>{
          const title = typeof s === 'string' ? s : (s.title || s.name || `Paso ${i + 1}`);
          const desc = typeof s === 'string' ? '' : (s.description || s.desc || s.instructions || '');
          return `
          <div style="position:relative;padding-bottom:16px">
            <div style="position:absolute;left:-36px;top:0;display:flex;flex-direction:column;align-items:center;height:100%">
              <button onclick="toggleRM(${i})" style="width:30px;height:30px;border-radius:50%;border:2px solid ${done[i]?'transparent':'var(--border)'};display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:800;flex-shrink:0;transition:all .2s;background:${done[i]?'var(--btn)':'var(--card)'};color:${done[i]?'#fff':'var(--muted)'};${done[i]?'box-shadow:0 3px 10px rgba(0,0,0,0.2)':''}">
                ${done[i]?msIcon('check',14):`<span style="font-size:11px">${i+1}</span>`}
              </button>
              ${i<steps.length-1?`<div style="width:2px;flex:1;margin-top:4px;border-radius:2px;background:${done[i]?'var(--accent)':'var(--border)'}"></div>`:''}
            </div>
            <div class="card" style="padding:14px 16px;cursor:pointer;transition:border-color .2s;border:1.5px solid ${done[i]?'var(--accent)':'var(--border)'}" onclick="toggleRM(${i})">
              <p style="font-size:13px;font-weight:${done[i]?'600':'700'};line-height:1.4;${done[i]?'text-decoration:line-through;color:var(--muted)':''}">${esc(title)}</p>
              ${desc ? `<p style="font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px">${esc(desc)}</p>` : ''}
            </div>
          </div>`;
        }).join('')}
        ${steps.length===0?'<p style="text-align:center;padding:40px;color:var(--muted);font-size:13px">Sin pasos configurados.</p>':''}
      </div>
    </div>`;
  }
  window.toggleRM=(i)=>{done[i]=!done[i];localStorage.setItem(storageKey,JSON.stringify(done));draw();if(done[i])showToast('Paso completado');};
  draw();
}

function renderEnglishRoadmap(el) {
  const modules = getEnglishRoadmapModules(currentApp);
  const storageKey=`roadmap_${currentApp.id}`;

      <div>

          return `

// â”€â”€ DIAGNÃ“STICO â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderDiagnostico(el) {
  const questions=getDiagnosticQuestions(currentApp);
  let answers={},step=0;
  const scoreAnswer = (qObj, idx) => {
    const opts = qObj.opts || ['Sí','No','A veces','No sé'];
    const label = normalizeText(opts[idx] || '');
    if (/^si$|siempre|mucho|alto|claro|lista|listo/.test(label)) return 2;
    if (/a veces|medio|parcial|algo/.test(label)) return 1;
    if (/^no$|nunca|no se|bajo/.test(label)) return 0;
    return Math.max(0, (opts.length - 1 - idx) / Math.max(1, opts.length - 1)) * 2;
  };
  const buildAnalysis = () => {
    const total = questions.length;
    const max = total * 2;
    const score = questions.reduce((sum, qObj, i) => sum + scoreAnswer(qObj, answers[i] ?? 0), 0);
    const pct = Math.round((score / Math.max(1, max)) * 100);
    const emotional = /emocion|emocional|cuerpo|somatic|nervioso|regulacion|ansiedad|estres|calma|bienestar/.test(nicheText(currentApp));
    if (isEnglishLearningApp(currentApp)) {
      const selected = questions.map((qObj, i) => {
        const opts = qObj.opts || [];
        return normalizeText(opts[answers[i]] || '');
      }).join(' ');
      const priority = /listening|audio|oir|escuchar/.test(selected) ? 'Listening'
        : /vocab|palabra|chunk|frase/.test(selected) ? 'Vocabulario'
        : /gramat/.test(selected) ? 'Gramática'
        : 'Speaking';
      const level = pct >= 75 ? 'Intermedio en progreso' : pct >= 45 ? 'Pre-Intermedio' : 'Principiante';
      const focusPlan = {
        Speaking:'10 minutos diarios de role-play: responde en voz alta, acepta corrección y repite la frase corregida 3 veces.',
        Listening:'5 minutos diarios con audio corto: una vez sin subtítulos, una con subtítulos y una repitiendo frases.',
        Vocabulario:'Aprende chunks completos, no palabras sueltas. Usa 10 flashcards y crea una frase propia con 3 de ellas.',
        Gramática:'Practica una regla por vez con ejemplos reales. No estudies teoría antes de intentar decir frases.'
      }[priority];
      return {
        pct,
        title:`Nivel sugerido: ${level}`,
        copy:`Tu prioridad ahora es ${priority}. La solución no es abrir todas las herramientas a la vez: usa una ruta corta de práctica diaria y mide si puedes responder con menos pausa.`,
        action:`Plan recomendado: ${focusPlan} Luego entra a Ruta y completa el módulo correspondiente.`
      };
    }
    if (emotional) {
      if (pct >= 75) return {
        pct,
        title:'Base de regulación sólida',
        copy:'Tus respuestas muestran que ya puedes nombrar señales internas y usar recursos de calma. La app te puede servir para sostener constancia y detectar patrones antes de que suban de intensidad.',
        action:'Siguiente paso: usa Mapa para registrar zona, emoción y práctica que funcionó hoy.'
      };
      if (pct >= 45) return {
        pct,
        title:'Regulación en proceso',
        copy:'Hay conciencia, pero algunas señales todavía necesitan más estructura. Lo importante ahora es no quedarte solo en entender: convierte cada señal en pausa, nombre y una acción amable.',
        action:'Siguiente paso: abre Meditar y elige una práctica breve antes de volver al Diario.'
      };
      return {
        pct,
        title:'Prioridad: bajar carga antes de decidir',
        copy:'Tus respuestas indican que quizá estás intentando resolver desde tensión o confusión. Primero regula el cuerpo; después decide. No necesitas hacerlo perfecto, solo bajar un poco la intensidad.',
        action:'Siguiente paso: haz una respiración guiada, registra dónde aparece la señal y pide apoyo si la intensidad se mantiene alta.'
      };
    }
    if (pct >= 75) return { pct, title:'Buen avance', copy:'Tus respuestas muestran claridad y un punto de partida bastante ordenado.', action:'Siguiente paso: registra una acción pequeña para sostener el progreso.' };
    if (pct >= 45) return { pct, title:'Avance intermedio', copy:'Hay partes claras y otras que necesitan seguimiento. La app debe ayudarte a convertir dudas en pasos concretos.', action:'Siguiente paso: elige una herramienta y completa una acción hoy.' };
    return { pct, title:'Necesita más estructura', copy:'Tus respuestas muestran que el punto de partida aún está poco claro. Empieza por lo más simple y medible.', action:'Siguiente paso: usa Diario o Checklist para ordenar lo primero.' };
  };
  function drawQ(){
    if(!questions.length){el.innerHTML=`<p style="text-align:center;padding:40px;color:var(--muted)">Sin preguntas.</p>`;return;}
    if(step>=questions.length){return drawResult();}
    const qObj=questions[step],q=qObj.q||qObj,opts=qObj.opts||['Sí','No','A veces','No sé'];
    const pct=Math.round(step/questions.length*100);
    el.innerHTML=sectionHdr(currentApp.icon||sectionIcon('diagnostico'), currentApp.name, `Pregunta ${step+1} de ${questions.length}`) +
    `<div class="fade-up" style="padding:20px">
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:12px;color:var(--muted)">Progreso</span>
          <span style="font-size:12px;color:var(--accent);font-weight:700">${pct}%</span>
        </div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
      </div>
      <div class="card" style="padding:20px;margin-bottom:16px">
        <p class="serif" style="font-size:17px;font-weight:600;line-height:1.4">${esc(q)}</p>
      </div>
      ${opts.map((o,i)=>`
        <button onclick="answerDiag(${i})" class="quiz-opt">
          <span class="opt-letter">${String.fromCharCode(65+i)}</span>
          ${esc(o)}
        </button>`).join('')}
    </div>`;
  }
  function drawResult(){
    const total=questions.length;
    const analysis = buildAnalysis();
    const answerList = questions.map((qObj, i) => {
      const opts = qObj.opts || ['Sí','No','A veces','No sé'];
      return { q:qObj.q || qObj, a:opts[answers[i]] || 'Sin respuesta' };
    });
    el.innerHTML=`<div class="fade-up" style="padding:20px">
      ${sectionHdr('workspace_premium', 'Diagnóstico completado', `${total} preguntas respondidas`)}
      <div class="card" style="padding:24px;text-align:center;margin-bottom:16px">
        <div style="margin-bottom:12px">${appIconHtml(56, 'diagnostico', currentApp.icon)}</div>
        <h2 class="serif" style="font-size:22px;font-weight:700;margin-bottom:8px;color:var(--text)">${esc(displayAppName(currentApp))}</h2>
        <p style="font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px">${esc(currentApp.diagResultText||'Hemos analizado tus respuestas. Aquí está tu lectura personalizada.')}</p>
        <div class="stat-row" style="justify-content:center">
          <div class="stat-pill"><div class="stat-val">${total}</div><div class="stat-lbl">Preguntas</div></div>
          <div class="stat-pill"><div class="stat-val">${analysis.pct}%</div><div class="stat-lbl">Claridad</div></div>
        </div>
      </div>
      <div class="card-dark" style="padding:22px;margin-bottom:16px">
        <p style="font-size:11px;opacity:.78;color:#fff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Lectura</p>
        <h3 class="serif" style="font-size:22px;color:#fff;margin-bottom:10px">${esc(analysis.title)}</h3>
        <p style="font-size:13px;color:#fff;opacity:.88;line-height:1.7;margin-bottom:12px">${esc(analysis.copy)}</p>
        <p style="font-size:12px;color:#fff;opacity:.75;line-height:1.55">${esc(analysis.action)}</p>
      </div>
      <div class="card" style="padding:18px;margin-bottom:16px">
        <p class="signal-label">${msIcon('fact_check',14)} Tus respuestas</p>
        <div class="body-guide-list">
          ${answerList.map(item => `<span><strong>${esc(item.q)}</strong><br>${esc(item.a)}</span>`).join('')}
        </div>
      </div>
      ${currentApp.diagCta?`<div class="card-dark" style="padding:20px;text-align:center;margin-bottom:16px">
        <p style="font-size:13px;color:#fff;opacity:.85;line-height:1.6;margin-bottom:12px">${esc(currentApp.diagCta)}</p>
        ${currentApp.diagCtaUrl?`<a href="${esc(currentApp.diagCtaUrl)}" target="_blank" style="display:inline-block;padding:12px 24px;background:#fff;color:var(--accent);border-radius:50px;font-weight:800;font-size:13px;text-decoration:none">Ver más →</a>`:''}
      </div>`:''}
      <button class="btn-primary" onclick="resetDiagnostic()">${msIcon('restart_alt',16)} Repetir diagnóstico</button>
    </div>`;
    repairRenderedText(el);
  }
  window.answerDiag=(i)=>{answers[step]=i;step++;drawQ();};
  window.resetDiagnostic=()=>{answers={};step=0;drawQ();};
  drawQ();
}

function renderMeditacion(el) {
  const app = currentApp;

        `).join('')}

  }
  const script = app.meditationScript || app.content?.meditationScript || `Cierra los ojos y respira profundamente. Inhala contando hasta 4... mantén contando hasta 4... exhala contando hasta 6. Repite este ciclo a tu propio ritmo. Permite que tu mente se calme y tu cuerpo se relaje con cada respiración.`;
  const durationMin = parseInt(app.meditationDuration || app.content?.meditationDuration || 10);
  const bellFreq = app.bellFreq || 440;
  let timerInterval = null, secondsLeft = durationMin * 60;
  let medPlaying = false, medVoiceOn = true;
  window.speakCurrentMeditation = () => speakShort(script);

  function fmt(s){ return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }

  function drawMed() {
    el.innerHTML = sectionHdr(app.icon||sectionIcon('meditacion'), app.name, app.description||`Meditación · ${durationMin} min`) +
    `<div class="fade-up" style="padding:20px">
      <div class="card" style="padding:28px;text-align:center;margin-bottom:16px">
        <div id="med-timer" class="med-timer">${fmt(durationMin*60)}</div>
        <div id="med-speaking" style="display:none" class="speaking-wrap">
          <div class="speaking-bars">
            <span style="height:10px"></span><span style="height:16px"></span><span style="height:12px"></span><span style="height:8px"></span>
          </div>
          <span style="font-size:11px;color:var(--accent);font-weight:700;margin-left:6px">Voz guiada activa...</span>
        </div>
        <div class="med-ctrl-row">
          <button id="med-play-btn" class="med-play" onclick="medTogglePlay()">${msIcon('play_arrow',28)}</button>
          <button id="med-stop-btn" class="med-stop" onclick="medStopAll()" style="display:none">â– </button>

        <p style="font-size:11px;color:var(--muted);margin-top:14px">La campana suena al inicio y al finalizar</p>

      medPlaying = false;
      document.getElementById('med-play-btn').innerHTML = msIcon('play_arrow',28);

      // Play / Resume
      medPlaying = true;
      document.getElementById('med-play-btn').innerHTML = msIcon('pause',28);
      document.getElementById('med-stop-btn').style.display = 'flex';
      if (!timerInterval) {
        // First start — ring bell
        playBell(bellFreq, 2.5);
        if (medVoiceOn && script) {
          setTimeout(() => {
            startVoice(script, () => {
              document.getElementById('med-speaking') && (document.getElementById('med-speaking').style.display = 'none');
            });
            document.getElementById('med-speaking') && (document.getElementById('med-speaking').style.display = 'flex');
          }, 1300);
        }
      } else if (medVoiceOn) {
        resumeVoice();
        document.getElementById('med-speaking').style.display = 'flex';
      }
      timerInterval = setInterval(() => {
        secondsLeft--;
        const td = document.getElementById('med-timer');
        if (td) td.textContent = fmt(secondsLeft);
        if (secondsLeft <= 0) {
          clearInterval(timerInterval); timerInterval = null;
          medPlaying = false;
          stopVoice();
          playBell(528, 3.5);
          document.getElementById('med-speaking') && (document.getElementById('med-speaking').style.display = 'none');

          showToast('Meditación completada. Gracias por este tiempo');
        }
      }, 1000);
    }
  };

  window.medStopAll = () => {
    clearInterval(timerInterval); timerInterval = null;
    stopVoice(); medPlaying = false; secondsLeft = durationMin * 60;
    document.getElementById('med-play-btn').innerHTML = msIcon('play_arrow',28);
    document.getElementById('med-stop-btn').style.display = 'none';
    document.getElementById('med-speaking').style.display = 'none';
    document.getElementById('med-timer').textContent = fmt(durationMin*60);

  window.medToggleVoice = () => {

  };

  drawMed();

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// AUDIO ENGINE — Campana (Web Audio API) + Voz guiada (TTS)
// Inspirado en Código Cuerpo y LittleStar
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
let _audioCtx = null;
function _getAudioCtx() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    return _audioCtx;
  } catch(e) { return null; }
}

function playBell(freq=440, duration=2.5) {
  const ctx = _getAudioCtx();
  if (!ctx) { console.warn('AudioContext not available'); return; }
  const _doPlay = () => {
    const now = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.7, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.start(now); osc.stop(now + duration);
    // Armónico suave
    const osc2 = ctx.createOscillator(), gain2 = ctx.createGain();
    osc2.connect(gain2); gain2.connect(ctx.destination);
    osc2.type = 'sine'; osc2.frequency.setValueAtTime(freq * 2.01, now);
    gain2.gain.setValueAtTime(0.25, now);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.75);
    osc2.start(now); osc2.stop(now + duration);
  };
  ctx.state === 'suspended' ? ctx.resume().then(_doPlay).catch(()=>{}) : _doPlay();
}

// â”€â”€ TTS (Text-to-Speech) chunked — fix Chrome que corta textos largos â”€â”€
let _voiceQueue = [], _voiceIdx = 0, _voiceStopped = true, _voicePaused = false, _lastUtterance = null;
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => hydrateVoicePanel();
}

function voiceSettings() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('ls_voice_settings') || '{}'); } catch {}
  const useSaved = saved.version === 2;
  const defaultRate = 0.76;
  const defaultPitch = 0.96;
  return {
    name: useSaved ? (saved.name || '') : '',
    lang: useSaved ? (saved.lang || 'es-MX') : (currentApp?.lang || 'es-MX'),
    rate: Number(useSaved ? (saved.rate || defaultRate) : defaultRate),
    pitch: Number(useSaved ? (saved.pitch || defaultPitch) : defaultPitch)
  };
}

function spanishVoices() {
  const all = window.speechSynthesis?.getVoices() || [];
  const es = all.filter(v => /^es/i.test(v.lang));
  const voices = es.length ? es : all;
  return voices.slice().sort((a, b) => _voiceQualityScore(b) - _voiceQualityScore(a));
}

function _voiceQualityScore(v) {
  const name = `${v?.name || ''} ${v?.lang || ''}`.toLowerCase();
  let score = 0;
  if (/neural|natural|online|premium|enhanced|cloud|google|microsoft|edge/i.test(name)) score += 35;
  if (/dalia|sabina|monica|paulina|helena|elvira|laura|lucia|sofia|valentina|ximena|camila/i.test(name)) score += 25;
  if (/es-(mx|co|us|ar|cl|pe|es)/i.test(v?.lang || '')) score += 15;
  if (/es-(mx|co|us|ar|cl|pe)/i.test(v?.lang || '')) score += 8;
  if (!v?.localService) score += 10;
  if (/desktop|compact|legacy|eloquence|espeak|festival|pico/i.test(name)) score -= 25;
  return score;
}

function hydrateVoicePanel() {
  const select = document.getElementById('voice-select');
  if (!select) return;
  const voices = spanishVoices();
  const settings = voiceSettings();
  select.innerHTML = voices.map((v, i) => {
    const quality = _voiceQualityScore(v);
    const label = quality >= 45 ? 'recomendada' : (v.localService ? 'local' : 'online');
    return `<option value="${i}">${esc(v.name)} - ${esc(v.lang)} - ${label}</option>`;
  }).join('');
  const selectedIndex = voices.findIndex(v => v.name === settings.name && v.lang === settings.lang);
  select.value = String(selectedIndex >= 0 ? selectedIndex : 0);
  const rate = document.getElementById('voice-rate');
  const pitch = document.getElementById('voice-pitch');
  if (rate) rate.value = String(settings.rate);
  if (pitch) pitch.value = String(settings.pitch);
}

function openVoicePanel() {
  hydrateVoicePanel();
  document.getElementById('voice-panel')?.classList.add('open');
}

function closeVoicePanel() {
  document.getElementById('voice-panel')?.classList.remove('open');
}

function saveVoiceSettings() {
  const voices = spanishVoices();
  const select = document.getElementById('voice-select');
  const chosen = voices[Number(select?.value || 0)] || voices[0];
  const settings = {
    version: 2,
    name: chosen?.name || '',
    lang: chosen?.lang || 'es-MX',
    rate: Number(document.getElementById('voice-rate')?.value || 0.76),
    pitch: Number(document.getElementById('voice-pitch')?.value || 0.96)
  };
  localStorage.setItem('ls_voice_settings', JSON.stringify(settings));
  if (currentApp) {
    currentApp.voiceName = settings.name;
    currentApp.voiceLang = settings.lang;
    currentApp.voiceRate = settings.rate;
    currentApp.voicePitch = settings.pitch;
  }
}

function testSelectedVoice() {
  saveVoiceSettings();
  speakShort('Hola, esta es una prueba de voz para tu mini app. Puedes cambiarla hasta encontrar una que suene más amable.');
}

function _bestVoice(lang) {
  const all = window.speechSynthesis?.getVoices() || [];
  const settings = voiceSettings();
  const prefix = (lang || 'es').split('-')[0];
  // Only use saved voice if its language matches what we're requesting
  const savedVoice = all.find(v => v.name === settings.name && v.lang === settings.lang && v.lang.startsWith(prefix));
  if (savedVoice) return savedVoice;
  const matches = all.filter(v => v.lang.startsWith(prefix));
  if (!matches.length) return null;
  const ranked = matches.slice().sort((a, b) => _voiceQualityScore(b) - _voiceQualityScore(a));
  if (prefix === 'en') {
    return ranked.find(v => /natural|neural|online|enhanced|premium|cloud/i.test(v.name))
        || ranked.find(v => /samantha|ava|allison|victoria|karen|serena|moira|tessa|daniel|alex|siri/i.test(v.name))
        || ranked.find(v => /google.*english|google.*us|google.*uk/i.test(normalizeText(v.name || '')))
        || ranked.find(v => /^en-(US|GB|AU|CA)/i.test(v.lang))
        || ranked.find(v => !v.localService)
        || ranked[0];
  }
  return ranked.find(v => /natural|neural|online|enhanced|premium|cloud/i.test(v.name))
      || ranked.find(v => /dalia|sabina|monica|paulina|helena|elvira|laura|lucia|sofia|valentina|ximena|camila|alvaro/i.test(v.name))
      || ranked.find(v => /google.*espanol|google.*spanish/i.test(normalizeText(v.name || '')))
      || ranked.find(v => /^es-(MX|CO|US|AR|CL|PE)/i.test(v.lang))
      || ranked.find(v => v.lang === lang)
      || ranked.find(v => !v.localService)
      || ranked[0];
}

function _cleanForTTS(text) {
  return cleanText(text).replace(/[()[\]{}]/g,'').replace(/[—–]/g,', ')
    .replace(/\.{2,}/g,', ').replace(/[*_#]+/g,'')
    .replace(/\s{2,}/g,' ').trim();
}

function ttsLangForText(text, fallbackLang) {
  // English apps always use English — saved Spanish voice settings don't apply
  if (isEnglishLearningApp(currentApp)) {
    return currentApp?.voiceLang || 'en-US';
  }
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('ls_voice_settings') || '{}'); } catch {}
  if (saved.version === 2 && saved.lang) return saved.lang;
  const clean = normalizeText(text);
  const soundsEnglish = /\b(i|you|we|they|what|where|when|could|would|please|hello|thanks|interview|coffee|airport|hotel|work|job|english)\b/.test(clean);
  if (soundsEnglish) return 'en-US';
  return fallbackLang || 'es-MX';
}

function _splitForTTS(text) {
  return text.split(/\n+/).flatMap(line => {
    line = _cleanForTTS(line.trim());
    if (!line) return [];
    if (line.length <= 220) return [line];
    return line.split(/(?<=[.!?…,])\s+/).filter(s => s.trim().length > 0);
  });
}

function startVoice(text, onDone) {
  if (!window.speechSynthesis) { showToast('Activa el audio en tu navegador'); return; }
  if (!_voiceStopped || window.speechSynthesis.speaking || window.speechSynthesis.pending) stopVoice();
  _voiceQueue = _splitForTTS(text); _voiceIdx = 0;
  if (!_voiceQueue.length) { showToast('No hay texto para reproducir', 'error'); return; }
  _voiceStopped = false; _voicePaused = false;
  let started = false;
  const begin = () => {
    if (started || _voiceStopped) return;
    started = true;
    try { window.speechSynthesis.resume(); } catch {}
    _speakNext(onDone);
  };
  begin();
  if (window.speechSynthesis.getVoices().length === 0) {
    const previousHandler = window.speechSynthesis.onvoiceschanged;
    window.speechSynthesis.onvoiceschanged = () => {
      if (typeof previousHandler === 'function') previousHandler();
      hydrateVoicePanel();
    };
  }
}

function _speakNext(onDone) {
  if (_voiceStopped || _voicePaused) return;
  if (_voiceIdx >= _voiceQueue.length) { if (onDone) onDone(); return; }
  const u = new SpeechSynthesisUtterance(_voiceQueue[_voiceIdx++]);
  const settings = voiceSettings();
  const ttsLang = ttsLangForText(u.text, settings.lang || 'es-MX');
  const best = _bestVoice(ttsLang);
  if (best) {
    // Requested voice is available — use it
    u.voice = best;
    u.lang  = ttsLang;
    u.rate  = ttsLang.startsWith('en') ? Math.max(settings.rate, 0.92) : settings.rate;
  } else {
    // No voice for the requested language — fall back to any available voice
    // Don't force u.lang to avoid "language-unavailable" error on devices without that language pack
    const fallback = _bestVoice(settings.lang || 'es-MX') || (window.speechSynthesis?.getVoices()||[])[0];
    if (fallback) u.voice = fallback;
    u.rate = settings.rate;
  }
  u.pitch = settings.pitch;
  u.volume = 1;
  u.onend = () => { if (!_voiceStopped && !_voicePaused) setTimeout(() => _speakNext(onDone), 350); };
  u.onerror = (e) => { if (e.error !== 'interrupted') setTimeout(() => _speakNext(onDone), 150); };
  window.speechSynthesis.speak(u);
}

function pauseVoice() { _voicePaused = true; window.speechSynthesis?.pause(); }
function resumeVoice() { _voicePaused = false; window.speechSynthesis?.resume(); _speakNext(); }
function stopVoice() {
  _voiceStopped = true; _voicePaused = false; _voiceQueue = []; _voiceIdx = 0;
  window.speechSynthesis?.cancel();
}

// Speak a short text (e.g. chatbot reply, affirmation)
function speakShort(text) {
  if (!window.speechSynthesis) { showToast('Activa el audio en tu navegador'); return; }
  if (!_voiceStopped || window.speechSynthesis.speaking || window.speechSynthesis.pending) stopVoice();
  const clean = _cleanForTTS(String(text||''));
  if (!clean) { showToast('No hay texto para reproducir', 'error'); return; }
  _voiceStopped = false;
  let started = false;
  const speakNow = () => {
    if (started) return;
    started = true;
    const u = new SpeechSynthesisUtterance(clean);
    const settings = voiceSettings();
    const ttsLang = ttsLangForText(clean, settings.lang || 'es-MX');
    const best = _bestVoice(ttsLang);
    if (best) {
      u.voice = best;
      u.lang  = ttsLang;
      u.rate  = ttsLang.startsWith('en') ? Math.max(settings.rate, 0.92) : settings.rate;
    } else {
      const fallback = _bestVoice(settings.lang || 'es-MX') || (window.speechSynthesis?.getVoices()||[])[0];
      if (fallback) u.voice = fallback;
      u.rate = settings.rate;
    }
    u.pitch = settings.pitch;
    u.volume = 1;
    u.onend = () => { _voiceStopped = true; };
    u.onerror = (e) => { if (e.error !== 'interrupted') { _voiceStopped = true; } };
    _lastUtterance = u;
    try { window.speechSynthesis.resume(); } catch {}
    window.speechSynthesis.speak(u);
  };
  speakNow();
  if (window.speechSynthesis.getVoices().length === 0) {
    const previousHandler = window.speechSynthesis.onvoiceschanged;
    window.speechSynthesis.onvoiceschanged = () => {
      if (typeof previousHandler === 'function') previousHandler();
      hydrateVoicePanel();
    };
  }
}

function speakButtonText(text, btn) {
  const button = btn || (typeof event !== 'undefined' ? event.currentTarget : null);
  if (!_voiceStopped) {
    stopVoice();
    if (button) button.innerHTML = msIcon('volume_up',15) + ' Escuchar';
    return;
  }
  if (button) button.innerHTML = msIcon('stop',15) + ' Detener';
  speakShort(text);
  const reset = () => {
    if (button && _voiceStopped) button.innerHTML = msIcon('volume_up',15) + ' Escuchar';
    else if (button) setTimeout(reset, 300);
  };
  setTimeout(reset, 500);
}

// â”€â”€ Utils â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function showError(msg) {
  document.getElementById('screen-access').innerHTML=`<div style="text-align:center;padding:40px">
    <div style="margin-bottom:16px;color:var(--warn)">${msIcon('warning',48)}</div>
    <p style="font-weight:700;font-size:18px;margin-bottom:8px">Algo salió mal</p>
    <p style="color:var(--muted);font-size:13px;margin-bottom:24px">${esc(msg)}</p>
    <a href="./dashboard.html?tab=miniapps" style="padding:12px 24px;background:var(--btn);color:#fff;border-radius:50px;text-decoration:none;font-weight:700;font-size:14px">&larr; Volver</a>
  </div>`;
}

function showToast(msg,type='success') {
  let t=document.getElementById('toast-el');
  if(!t){t=document.createElement('div');t.id='toast-el';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:50px;font-size:13px;font-weight:700;z-index:9999;white-space:nowrap;transition:opacity .3s;pointer-events:none';document.body.appendChild(t);}
  t.textContent=cleanText(msg);
  t.style.background=type==='error'?'#e55':'var(--btn)';
  t.style.color='#fff';t.style.opacity='1';
  clearTimeout(t._to);t._to=setTimeout(()=>t.style.opacity='0',2500);
}

function cleanText(s) {
  let out = String(s || '');
  for (let i = 0; i < 3; i++) {
    const decoded = decodeMojibakeOnce(out);
    if (decoded === out) break;
    out = decoded;
  }
  out = out.replace(/\S*[ÃÂâ]\S*/g, token => {
    let fixed = token;
    for (let i = 0; i < 3; i++) {
      const decoded = decodeMojibakeOnce(fixed);
      if (decoded === fixed) break;
      fixed = decoded;
    }
    return fixed;
  });
  return out.replace(/\uFFFD/g, '')
    .replace(/Ã‚¿|¿/g, '¿')
    .replace(/Ã‚¡|¡/g, '¡')
    .replace(/Ã‚·|·/g, '·')
    .replace(/â†’/g, '→')
    .replace(/â†/g, '←')
    .replace(/âœ“/g, '✓')
    .replace(/…/g, '…')
    .replace(/—/g, '—')
    .replace(/–/g, '–')
    .replace(/•/g, '•')
    .replace(/“|â€�/g, '"')
    .replace(/‘|’/g, "'")
    .replace(/›/g, '›')
    .replace(/‹/g, '‹')
    .replace(/â†º/g, '↺')
    .replace(/â– /g, '■')
    .replace(/âˆ’/g, '−')
    .replace(/â™¡/g, '♡')
    .replace(/â˜½/g, '☽')
    .replace(/á|á/g, 'á')
    .replace(/é|é/g, 'é')
    .replace(/í|í/g, 'í')
    .replace(/ó|ó/g, 'ó')
    .replace(/ú|ú/g, 'ú')
    .replace(/ñ|ñ/g, 'ñ')
    .replace(/ü|ü/g, 'ü')
    .replace(/Á|Á/g, 'Á')
    .replace(/Â‰|Ã‰/g, 'É')
    .replace(/Í|Í/g, 'Í')
    .replace(/Â“|Ã“/g, 'Ó')
    .replace(/Âš|Ãš/g, 'Ú')
    .replace(/Â‘|Ã‘/g, 'Ñ');
}
function esc(s){return cleanText(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const MOJIBAKE_RE = /[ÃÂ]|â€|’|“|”|•|–|—|¿|¡|·/;
const CP1252_BYTES = {
  '€':0x80, '‚':0x82, 'ƒ':0x83, '„':0x84, '…':0x85, '†':0x86, '‡':0x87, 'ˆ':0x88, '‰':0x89,
  'Š':0x8a, '‹':0x8b, 'Œ':0x8c, 'Ž':0x8e, '‘':0x91, '’':0x92, '“':0x93, '”':0x94,
  '•':0x95, '–':0x96, '—':0x97, '˜':0x98, '™':0x99, 'š':0x9a, '›':0x9b, 'œ':0x9c,
  'ž':0x9e, 'Ÿ':0x9f
};
const UTF8_DECODER = typeof TextDecoder !== 'undefined' ? new TextDecoder('utf-8', { fatal:true }) : null;

function decodeMojibakeOnce(value) {
  const text = String(value || '');
  if (!UTF8_DECODER || !MOJIBAKE_RE.test(text)) return text;
  const bytes = [];
  for (const ch of text) {
    const code = ch.codePointAt(0);
    if (code <= 0xff) bytes.push(code);
    else if (Object.prototype.hasOwnProperty.call(CP1252_BYTES, ch)) bytes.push(CP1252_BYTES[ch]);
    else return text;
  }
  try {
    return UTF8_DECODER.decode(new Uint8Array(bytes));
  } catch {
    return text;
  }
}

function repairTextTree(value, seen = new WeakSet()) {
  if (typeof value === 'string') return cleanText(value);
  if (!value || typeof value !== 'object') return value;
  if (seen.has(value)) return value;
  seen.add(value);
  if (Array.isArray(value)) return value.map(item => repairTextTree(item, seen));
  Object.keys(value).forEach(key => {
    value[key] = repairTextTree(value[key], seen);
  });
  return value;
}

function repairRenderedText(root) {
  if (!root || window._repairingText) return;
  window._repairingText = true;
  try {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) textNodes.push(node);
    textNodes.forEach(textNode => {
      if (textNode.parentElement?.closest('script,style')) return;
      const fixed = cleanText(textNode.nodeValue);
      if (fixed !== textNode.nodeValue) textNode.nodeValue = fixed;
    });
    root.querySelectorAll('[placeholder],[aria-label],[title],[data-label]').forEach(el => {
      ['placeholder','aria-label','title','data-label'].forEach(attr => {
        if (!el.hasAttribute(attr)) return;
        const value = el.getAttribute(attr);
        const fixed = cleanText(value);
        if (fixed !== value) el.setAttribute(attr, fixed);
      });
    });
  } finally {
    window._repairingText = false;
  }
}

function startTextRepairObserver() {
  const target = document.getElementById('screen-app');
  if (!target || window._textRepairObserver) return;
  const schedule = () => {
    if (window._textRepairQueued || window._repairingText) return;
    window._textRepairQueued = true;
    requestAnimationFrame(() => {
      window._textRepairQueued = false;
      repairRenderedText(target);
    });
  };
  window._textRepairObserver = new MutationObserver(schedule);
  window._textRepairObserver.observe(target, {
    childList:true,
    subtree:true,
    characterData:true,
    attributes:true,
    attributeFilter:['placeholder','aria-label','title','data-label']
  });
  schedule();
}
