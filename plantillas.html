<script>
const CATEGORY_COLORS = {'Finanzas & Negocios':'text-secondary bg-secondary/10','Marketing Digital':'text-primary bg-primary/10','Productividad':'text-tertiary bg-tertiary/10','Bienestar':'text-purple-300 bg-purple-400/10','Fitness':'text-blue-300 bg-blue-400/10','Nutrición':'text-cyan-300 bg-cyan-400/10','Relaciones':'text-pink-300 bg-pink-400/10','Fe y Espiritualidad':'text-amber-300 bg-amber-400/10','Educación':'text-violet-300 bg-violet-400/10','Belleza':'text-fuchsia-300 bg-fuchsia-400/10','Mascotas':'text-sky-300 bg-sky-400/10'};
document.addEventListener('DOMContentLoaded', async () => {
  const user = await Auth.requireAuth();
  if (!user) return;
  renderTemplates(getBuiltinTemplates());
});
function renderTemplates(templates) {
  const grid = document.getElementById('templates-grid');
  grid.innerHTML = templates.map(t => {
    const theme = window.getSuggestedOfferTheme ? window.getSuggestedOfferTheme(t.niche, t.product) : null;
    const brand = theme?.brandColor || '#2E5BFF';
    const accent = theme?.accentColor || '#7c3aed';
    const image = theme?.coverImage || '';
    return `<div class="group bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/5 hover:border-primary/20 transition-all duration-400 flex flex-col">
      <div class="aspect-video relative overflow-hidden flex items-center justify-center" style="background:linear-gradient(135deg,${brand},${accent})">
        ${image ? `<img src="${image}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-cover opacity-50 group-hover:scale-105 transition-transform duration-700"/>` : ''}
        <div class="absolute inset-0" style="background:linear-gradient(135deg,${brand}cc,rgba(0,0,0,.36));"></div>
        <span class="material-symbols-outlined text-white/10 relative" style="font-size:120px; font-variation-settings:'FILL' 1,'wght' 200;">${t.icon}</span>
        <div class="absolute inset-0 flex items-center justify-center"><span class="material-symbols-outlined text-white drop-shadow-lg" style="font-size:52px; font-variation-settings:'FILL' 1,'wght' 400;">${t.icon}</span></div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-4">
          <a href="./generador-ia.html?template=${t.id}" class="primary-gradient w-full py-2 rounded-lg text-xs font-bold text-white text-center block">Usar Plantilla</a>
        </div>
        <div class="absolute top-3 left-3 flex items-center gap-1.5 rounded-full bg-black/35 backdrop-blur px-2.5 py-1">
          <span class="w-2 h-2 rounded-full" style="background:${accent}"></span>
          <span class="text-[9px] uppercase tracking-widest font-black text-white/85">${theme?.id || 'premium'}</span>
        </div>
      </div>
      <div class="p-5 flex-1 flex flex-col">
        <div class="flex justify-between items-start mb-2"><h5 class="font-semibold text-on-surface text-sm">${esc(t.title)}</h5></div>
        <p class="text-xs text-on-surface-variant flex-1">${esc(t.product)}</p>
        <div class="flex items-center justify-between mt-3">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${CATEGORY_COLORS[t.category] || 'text-primary bg-primary/10'}">${esc(t.category)}</span>
          <span class="text-[10px] text-on-surface-variant">${t.questions.length} preguntas</span>
        </div>
        <a href="./generador-ia.html?template=${t.id}" class="mt-3 w-full py-2 rounded-lg border border-primary/20 text-primary text-xs font-bold text-center hover:bg-primary/5 transition-colors block">Usar esta plantilla</a>
      </div>
    </div>`;
  }).join('');
}
let _activeCategory = '', _activeSearch = '';
function applyFilters() {
  const all = getBuiltinTemplates();
  const filtered = all.filter(t => {
    const matchCat = !_activeCategory || t.category === _activeCategory;
    const q = _activeSearch.toLowerCase().trim();
    const matchSearch = !q || t.title.toLowerCase().includes(q) || t.product.toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || t.niche.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  renderTemplates(filtered);
  if (!filtered.length) document.getElementById('templates-grid').innerHTML = `<p class="text-on-surface-variant text-center py-12 col-span-4">No se encontraron plantillas.</p>`;
}
function filterBySearch(query) { _activeSearch = query; applyFilters(); }
function setCategory(btn, cat) { _activeCategory = cat; document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active-cat')); btn.classList.add('active-cat'); applyFilters(); }
function filterTemplates(query) { filterBySearch(query); }
function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
