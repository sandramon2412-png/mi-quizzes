<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cargando…</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html,body { margin: 0; padding: 0; height: 100%; background: #0e0e0e; color: #fff; font-family: system-ui, sans-serif; }
  #loading, #error { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-weight: 800; font-size: 1.25rem; margin: 0 0 0.5rem; }
  p { color: #adaaaa; font-size: 0.9rem; max-width: 28rem; }
  a { color: #4d7cff; text-decoration: none; font-weight: 600; margin-top: 1rem; display: inline-block; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Cargando landing…</p>
</div>

<div id="error" style="display:none">
  <h1>Landing no encontrada</h1>
  <p>Esta landing no existe, fue eliminada o no está publicada.</p>
  <a href="./">← Ir al inicio</a>
</div>

<script src="./supabase-config.js"></script>
<script>
  (async () => {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug') || window.location.pathname.split('/l/')[1]?.replace(/\/$/, '');
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const showError = () => { loading.style.display = 'none'; errorEl.style.display = 'flex'; };

    if (!slug) { showError(); return; }

    try {
      const row = await DB.landings.getBySlug(slug);
      if (!row || !row.published || !row.html) { showError(); return; }

      // Render the landing directly into the document
      document.open();
      document.write(row.html);
      document.close();

      // Track visit (fire and forget)
      try { DB.landings.incrementVisits(slug); } catch {}

      // Track response event for monthly usage (like quizzes/miniapps)
      try {
        if (typeof ResponseTracker !== 'undefined') {
          ResponseTracker.track({ ownerId: row.user_id, contentType: 'landing', contentId: row.id });
        }
      } catch {}
    } catch (e) {
      console.error(e);
      showError();
    }
  })();
</script>
</body>
</html>
