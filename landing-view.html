<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cargando…</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html,body { margin: 0; padding: 0; height: 100%; background: #0e0e0e; color: #fff; font-family: system-ui, sans-serif; }
  #loading, #error { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-weight: 800; font-size: 1.25rem; margin: 0 0 0.5rem; }
  p { color: #adaaaa; font-size: 0.9rem; max-width: 28rem; }
  a { color: #4d7cff; text-decoration: none; font-weight: 600; margin-top: 1rem; display: inline-block; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Cargando landing…</p>
</div>

<div id="error" style="display:none">
  <h1>Landing no encontrada</h1>
  <p>Esta landing no existe, fue eliminada o no está publicada.</p>
  <a href="./">← Ir al inicio</a>
</div>

<script src="./supabase-config.js"></script>
<script>
  (async () => {
    const params = new URLSearchParams(window.location.search);
    const draftId = params.get('draft');
    // Slug priority: ?slug= (from Vercel rewrite) > /l/<slug> > /<slug>
    let slug = params.get('slug');
    if (!slug) {
      const path = window.location.pathname.replace(/\/$/, '');
      if (path.startsWith('/l/')) slug = path.slice(3);
      else if (path && path !== '/') slug = path.slice(1);
    }
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const showError = () => { loading.style.display = 'none'; errorEl.style.display = 'flex'; };

    if (!slug && !draftId) { showError(); return; }

    try {
      let row = null;
      if (draftId) {
        const session = await Auth.session({ timeoutMs: 3000 }).catch(() => null);
        row = await DB.landings.get(draftId).catch(() => null);
        if (!row) {
          try {
            const cached = JSON.parse(sessionStorage.getItem('ls_landing_preview') || 'null');
            if (cached?.id === draftId) row = cached;
          } catch {}
        }
        if (!row || !row.html) { showError(); return; }
        if (row.user_id && session?.user?.id && row.user_id !== session.user.id) { showError(); return; }
        document.title = (row.title || 'Vista de landing') + ' · Vista';
        document.open();
        document.write(row.html);
        document.close();
        return;
      }

      row = await DB.landings.getBySlug(slug);
      if (!row || !row.published || !row.html) { showError(); return; }

      // Inject analytics tracker before rendering
      const TRACKER = `<script>(function(){
        var SB_URL = ${JSON.stringify(SUPABASE_URL)};
        var SB_KEY = ${JSON.stringify(SUPABASE_ANON_KEY)};
        var LID = ${JSON.stringify(row.id)};
        var OWNER = ${JSON.stringify(row.user_id)};
        var vid = localStorage.getItem('ls_visitor_id');
        if (!vid) { vid = (crypto.randomUUID && crypto.randomUUID()) || (Date.now()+'-'+Math.random().toString(36).slice(2)); localStorage.setItem('ls_visitor_id', vid); }
        function send(event_type, meta){
          try {
            fetch(SB_URL + '/rest/v1/landing_events', {
              method:'POST',
              headers:{ 'apikey': SB_KEY, 'Authorization':'Bearer ' + SB_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
              body: JSON.stringify({ landing_id: LID, user_id: OWNER, event_type: event_type, visitor_id: vid, meta: meta || {} }),
              keepalive: true
            });
          } catch(e){}
        }
        send('view');
        document.addEventListener('click', function(e){
          var a = e.target.closest && e.target.closest('a,button');
          if (!a) return;
          var href = a.getAttribute && a.getAttribute('href');
          var label = (a.innerText || '').trim().slice(0, 80);
          send('cta_click', { href: href || '', label: label, tag: a.tagName });
        }, true);
      })();<\/script>`;

      const htmlWithTracker = row.html.replace(/<head[^>]*>/i, (m) => m + TRACKER);

      // Render the landing directly into the document
      document.open();
      document.write(htmlWithTracker);
      document.close();

      // Track visit counter on the landing row itself (fire and forget)
      try { DB.landings.incrementVisits(slug); } catch {}

      // Track response event for monthly usage (like quizzes/miniapps)
      try {
        if (typeof ResponseTracker !== 'undefined') {
          ResponseTracker.track({ ownerId: row.user_id, contentType: 'landing', contentId: row.id });
        }
      } catch {}
    } catch (e) {
      console.error(e);
      showError();
    }
  })();
</script>
</body>
</html>
