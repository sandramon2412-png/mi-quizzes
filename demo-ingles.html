<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cargando English para Principiantes...</title>
<style>
  body { margin:0; background:#0e0e0e; color:#f0f0f0; font-family:'Plus Jakarta Sans',sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:16px; }
  .spinner { width:40px; height:40px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.1); border-top-color:#2E5BFF; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { font-size:13px; color:#9a9a9a; }
</style>
</head>
<body>
<div class="spinner"></div>
<p>Cargando tu mini-app de inglés...</p>
<script>
const APP_ID = 'demo-english-beginners-v1';
const APP_DATA = {
  id: APP_ID,
  created: new Date().toISOString(),
  status: 'active',
  accessCodes: [],
  name: 'English para Principiantes',
  description: 'Vocabulario, retos diarios y hábito de práctica — todo en un lugar',
  type: 'reto',
  types: ['reto', 'flashcards', 'tracker', 'glosario', 'afirmaciones'],
  voiceLang: 'en-US',

  // ── RETO: 7-day English Challenge ──────────────────────────
  retoDays: 7,
  retoContent: [
    {
      title: 'Greetings & Introductions',
      quote: '"Hello! My name is... Nice to meet you!" — Your first step to speaking English.',
      instructions: 'Hoy aprendes a saludar y presentarte. Repite estas frases en voz alta 5 veces:\n\n• Hello! / Hi! — Hola\n• Good morning! — Buenos días\n• Good afternoon! — Buenas tardes\n• Good night! — Buenas noches\n• My name is ___. — Me llamo ___.\n• Nice to meet you! — Mucho gusto.\n• How are you? — ¿Cómo estás?\n• I\'m fine, thank you! — Estoy bien, gracias.\n\nTip: Practica frente al espejo para ganar confianza.',
      reflectionPrompt: 'Write 3 sentences introducing yourself in English. Example: "My name is... I am from... Nice to meet you!"'
    },
    {
      title: 'Numbers & Colors',
      quote: '"One small step for a learner, one giant leap for fluency."',
      instructions: 'Hoy aprendes números del 1–20 y colores esenciales.\n\nNúmeros:\none, two, three, four, five, six, seven, eight, nine, ten,\neleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty.\n\nColores:\nred (rojo) • blue (azul) • green (verde) • yellow (amarillo)\nwhite (blanco) • black (negro) • orange (naranja) • purple (morado)\n\nPractica: mira objetos a tu alrededor y dí su color en inglés.',
      reflectionPrompt: 'Count from 1 to 10 in English, then describe the color of 5 objects near you. Example: "My phone is black."'
    },
    {
      title: 'Family & People',
      quote: '"Family is the same in every language."',
      instructions: 'Vocabulario de familia y personas:\n\n• Mother / Mom — Mamá\n• Father / Dad — Papá\n• Sister — Hermana\n• Brother — Hermano\n• Daughter — Hija\n• Son — Hijo\n• Grandmother / Grandma — Abuela\n• Grandfather / Grandpa — Abuelo\n• Friend — Amigo/a\n• Teacher — Maestro/a\n• Husband — Esposo\n• Wife — Esposa\n\nFrase clave: "I have a sister and two brothers." (Tengo una hermana y dos hermanos.)',
      reflectionPrompt: 'Describe your family in English in 3–5 sentences. Example: "I have a mother, a father, and one brother. My mother is very kind."'
    },
    {
      title: 'Essential Verbs',
      quote: '"Verbs are the engine of every sentence."',
      instructions: 'Los 10 verbos más usados en inglés:\n\n• To be — ser / estar → I am, You are, He/She is\n• To have — tener → I have\n• To go — ir → I go\n• To eat — comer → I eat\n• To drink — beber → I drink\n• To work — trabajar → I work\n• To study — estudiar → I study\n• To sleep — dormir → I sleep\n• To like — gustar → I like\n• To want — querer → I want\n\nPractica: "I am a student. I study English. I like coffee."',
      reflectionPrompt: 'Write 5 sentences using 5 different verbs from today. Example: "I am happy. I want to learn English. I like music."'
    },
    {
      title: 'Food & Drinks',
      quote: '"Let\'s talk about food — everyone\'s favorite topic!"',
      instructions: 'Vocabulario de comida y bebida:\n\n• Water — agua • Coffee — café • Tea — té • Juice — jugo • Milk — leche\n• Bread — pan • Rice — arroz • Chicken — pollo • Salad — ensalada\n• Apple — manzana • Banana — plátano • Orange — naranja • Egg — huevo\n\nFrases útiles:\n• I like... — Me gusta...\n• I don\'t like... — No me gusta...\n• I want... — Quiero...\n• Can I have...? — ¿Me puede dar...?\n\nEjemplo: "I like coffee and eggs. I don\'t like tea."',
      reflectionPrompt: 'What did you eat today? Describe your meals in English. Example: "For breakfast I ate bread and drank coffee."'
    },
    {
      title: 'Time & Days of the Week',
      quote: '"Time flies when you\'re learning English!"',
      instructions: 'Días de la semana:\nMonday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday\n(Lunes, Martes, Miércoles, Jueves, Viernes, Sábado, Domingo)\n\nPreguntar la hora:\n• What time is it? — ¿Qué hora es?\n• It\'s 3 o\'clock. — Son las 3.\n• It\'s half past 2. — Son las 2 y media.\n• In the morning / afternoon / evening — Por la mañana / tarde / noche\n\nFrase útil: "Today is Monday. It\'s 9 o\'clock in the morning."',
      reflectionPrompt: 'What day is today? What time is it right now? What are your plans for this week? Write it all in English.'
    },
    {
      title: 'Basic Conversations',
      quote: '"You\'ve made it through 7 days — now let\'s put it all together!"',
      instructions: '¡Día final! Conversaciones completas para principiantes:\n\n• Where are you from? → I\'m from Mexico. / I\'m from Colombia.\n• What do you do? → I\'m a teacher. / I\'m a student.\n• Do you speak English? → Yes, a little! I\'m learning.\n• How old are you? → I\'m 28 years old.\n• What\'s your favorite food? → I love pizza and coffee.\n• Do you have a family? → Yes! I have a husband and two kids.\n\n¡Practica estas preguntas con alguien o grábate respondiéndolas en inglés!',
      reflectionPrompt: 'Write a short dialogue (6–8 lines) in English — imagine you\'re meeting someone new. Use vocabulary from all 7 days!'
    }
  ],

  // ── FLASHCARDS: Essential Vocabulary ───────────────────────
  cards: [
    { front: 'Hello / Hi', back: 'Hola — saludo casual y formal' },
    { front: 'Thank you / Thanks', back: 'Gracias' },
    { front: 'Please', back: 'Por favor' },
    { front: 'Sorry / Excuse me', back: 'Lo siento / Perdón / Con permiso' },
    { front: 'Yes / No', back: 'Sí / No' },
    { front: 'Good morning!', back: 'Buenos días' },
    { front: 'Good night!', back: 'Buenas noches' },
    { front: 'How are you?', back: '¿Cómo estás?' },
    { front: "I don't understand", back: 'No entiendo' },
    { front: 'Can you repeat, please?', back: '¿Puedes repetir, por favor?' },
    { front: 'Where is...?', back: '¿Dónde está...?' },
    { front: 'How much is it?', back: '¿Cuánto cuesta?' },
    { front: 'I need help', back: 'Necesito ayuda' },
    { front: 'My name is...', back: 'Me llamo... / Mi nombre es...' },
    { front: 'Nice to meet you!', back: 'Mucho gusto / Encantado/a' },
    { front: 'See you later!', back: 'Hasta luego / Nos vemos' },
    { front: "I don't speak English well", back: 'No hablo inglés bien' },
    { front: 'Do you speak Spanish?', back: '¿Hablas español?' },
    { front: 'What is this?', back: '¿Qué es esto?' },
    { front: 'I love it!', back: '¡Me encanta!' }
  ],

  // ── TRACKER: 30-day practice habit ─────────────────────────
  trackerDays: 30,
  trackerHabit: 'Practice English for at least 15 minutes today',

  // ── GLOSARIO: Common Beginner Words ────────────────────────
  glossaryTerms: [
    { term: 'Hello / Goodbye', def: 'Hola / Adiós — los saludos más básicos del idioma' },
    { term: 'Please / Thank you', def: 'Por favor / Gracias — palabras mágicas de cortesía' },
    { term: 'Yes / No / Maybe', def: 'Sí / No / Quizás — respuestas básicas' },
    { term: 'I want...', def: 'Quiero... — para expresar deseos. Ej: "I want water."' },
    { term: 'I need...', def: 'Necesito... — para expresar necesidades. Ej: "I need help."' },
    { term: 'I like / I don\'t like', def: 'Me gusta / No me gusta. Ej: "I like coffee."' },
    { term: 'Where is...?', def: '¿Dónde está...? — para pedir direcciones o ubicaciones' },
    { term: 'How much?', def: '¿Cuánto cuesta? — esencial para compras' },
    { term: 'Today / Tomorrow / Yesterday', def: 'Hoy / Mañana / Ayer — referencias temporales básicas' },
    { term: 'Here / There', def: 'Aquí / Allá — indicar ubicación' },
    { term: 'Big / Small', def: 'Grande / Pequeño — adjetivos de tamaño básicos' },
    { term: 'Fast / Slow', def: 'Rápido / Lento — adjetivos de velocidad' },
    { term: 'Hot / Cold', def: 'Caliente / Frío — para temperatura y clima' },
    { term: 'Good / Bad / Amazing', def: 'Bueno / Malo / Increíble — para expresar opiniones' },
    { term: 'Can I...?', def: '¿Puedo...? — para pedir permiso educadamente' },
    { term: 'I am / You are / He is', def: 'Soy / Eres / Él es — conjugación básica de "to be"' },
    { term: 'What / Who / When / Where / Why', def: 'Qué / Quién / Cuándo / Dónde / Por qué — las 5 preguntas esenciales' },
    { term: 'Always / Never / Sometimes', def: 'Siempre / Nunca / A veces — frecuencia de acciones' }
  ],

  // ── AFIRMACIONES: English Motivation ───────────────────────
  affirmations: [
    'Every day my English gets a little better — and that\'s enough.',
    'Mistakes are not failures. They are proof that I\'m trying.',
    'I can understand more English today than I did yesterday.',
    'Learning a new language is one of the best gifts I can give myself.',
    'I am patient with myself. Fluency takes time and I am on my way.',
    'Speaking English opens doors I never imagined possible.',
    'I am brave enough to speak, even when I make mistakes.',
    'Progress, not perfection. I celebrate every small win.',
    'I am a confident English learner and I\'m proud of how far I\'ve come.',
    'Every word I learn is a new connection to a bigger world.'
  ],
  affirmationInstruction: 'Read one affirmation out loud every morning — in English! Feel the meaning as you say each word.'
};

// Save to localStorage under ls_mini_apps
const STORAGE_KEY = 'ls_mini_apps';
try {
  let apps = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const idx = apps.findIndex(a => a.id === APP_ID);
  if (idx >= 0) apps[idx] = APP_DATA;
  else apps.unshift(APP_DATA);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(apps));
} catch(e) {
  console.error('Error saving demo app:', e);
}

// Redirect to player (with cache buster)
window.location.href = `./mini-app-player.html?id=${APP_ID}&v=${Date.now()}`;
</script>
</body>
</html>
