<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vista PDF · Luminous Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
  :root {
    --doc-bg:#ffffff; --doc-fg:#1a1a1a; --doc-muted:#555;
    --doc-primary:#2E5BFF; --doc-accent:#7c3aed;
    --doc-surface:#f0f5ff; --doc-surface-2:#f7f8fb; --doc-border:#e5e7eb;
  }
  body.theme-dark-neon {
    --doc-bg:#0a0a0f; --doc-fg:#eaeaf0; --doc-muted:#a3a3b5;
    --doc-primary:#c084fc; --doc-accent:#22d3ee; --doc-surface:#1a1a2e; --doc-surface-2:#10101c; --doc-border:#2a2a44;
  }
  body.theme-pastel {
    --doc-bg:#fdf6f0; --doc-fg:#2a2233; --doc-muted:#6b5a6f;
    --doc-primary:#e0749c; --doc-accent:#f4a261; --doc-surface:#fbeadf; --doc-surface-2:#f7e1d4; --doc-border:#eed6c4;
  }
  body.theme-beauty {
    --doc-bg:#fff6f8; --doc-fg:#3a2431; --doc-muted:#8a6678;
    --doc-primary:#b85c8e; --doc-accent:#6f9d92; --doc-surface:#fff0f4; --doc-surface-2:#f7ede6; --doc-border:#ecd6de;
  }
  body.theme-corporate {
    --doc-bg:#ffffff; --doc-fg:#0f172a; --doc-muted:#475569;
    --doc-primary:#0a2540; --doc-accent:#059669; --doc-surface:#ecfdf5; --doc-surface-2:#f0fdf4; --doc-border:#d1fae5;
  }
  body.theme-finance {
    --doc-bg:#f4f7f5; --doc-fg:#13231b; --doc-muted:#64766d;
    --doc-primary:#1F7A5A; --doc-accent:#C8A24A; --doc-surface:#e8f1ec; --doc-surface-2:#fff8e5; --doc-border:#d5e4da;
  }
  body.theme-spiritual {
    --doc-bg:#FBF4ED; --doc-fg:#372620; --doc-muted:#8B7065;
    --doc-primary:#B96F5F; --doc-accent:#D8A06F; --doc-surface:#FFF0E7; --doc-surface-2:#FFF9F4; --doc-border:#EBD6C8;
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin:0; background:#111; color:var(--doc-fg); font-family:'Lora', serif; }
  .toolbar {
    position: sticky; top: 0; z-index: 20; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 18px; background:#0e0e0e; border-bottom:1px solid #2a2a2a; color:#fff; font-family:'Plus Jakarta Sans', sans-serif;
  }
  .toolbar .actions { display:flex; gap:10px; flex-wrap:wrap; }
  .btn {
    height:38px; border:0; border-radius:10px; padding:0 14px; display:inline-flex; align-items:center; gap:7px;
    font-size:12px; font-weight:800; text-decoration:none; cursor:pointer;
  }
  .btn.primary { background:linear-gradient(135deg,#2E5BFF,#7c3aed); color:#fff; }
  .btn.ghost { background:#242424; color:#ddd; }
  .hint { font-size:11px; color:#aaa; line-height:1.4; max-width:560px; }
  .page-shell { background:#d7d7d7; padding:22px 0 44px; }
  .cover {
    width:210mm; height:297mm; margin:0 auto 18px; overflow:hidden; color:#fff;
    background:linear-gradient(135deg,var(--doc-primary),var(--doc-accent));
    display:grid; grid-template-columns:1.05fr .95fr; gap:12mm; align-items:center; padding:24mm 22mm;
    page-break-after:always; break-after:page;
  }
  .cover.has-image {
    position:relative; display:flex; align-items:flex-end; padding:24mm 22mm;
    background:#111; isolation:isolate;
  }
  .cover.has-image::after {
    content:''; position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.68)), linear-gradient(90deg,rgba(0,0,0,.58),rgba(0,0,0,.08));
  }
  .cover.has-image > div:first-child { position:relative; z-index:2; max-width:150mm; text-shadow:0 10px 34px rgba(0,0,0,.42); }
  .cover h1 {
    font-family:'Plus Jakarta Sans',sans-serif; font-size:52px; line-height:1.04; letter-spacing:0; margin:0 0 18px; font-weight:800;
  }
  .cover .subtitle { font-size:21px; line-height:1.45; opacity:.92; margin:0; }
  .cover-media {
    min-height:145mm; border-radius:26px; overflow:hidden; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22); box-shadow:0 24px 70px rgba(0,0,0,.28);
  }
  .cover-media img { width:100%; height:145mm; object-fit:cover; display:block; }
  .cover.has-image .cover-media {
    position:absolute; inset:0; z-index:0; min-height:0; border-radius:0; border:0; box-shadow:none; background:#111;
  }
  .cover.has-image .cover-media img { width:100%; height:100%; min-height:0; object-fit:cover; object-position:center; opacity:.92; }
  .cover.has-image .cover-media[data-size="top"] img { object-position:top; }
  .cover.has-image .cover-media[data-size="bottom"] img { object-position:bottom; }
  .cover.has-image .cover-media[data-size="fit"] img { object-fit:contain; opacity:1; background:linear-gradient(135deg,var(--doc-primary),var(--doc-accent)); }
  .cover-visual { height:145mm; display:flex; align-items:flex-end; padding:24px; position:relative; overflow:hidden; }
  .cover-visual::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.28) 0 20%,transparent 20% 35%,rgba(255,255,255,.14) 35% 52%,transparent 52% 100%); }
  .cover-visual span { position:relative; z-index:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
  .chapter-page {
    width:210mm; min-height:297mm; margin:16px auto; padding:14mm 16mm;
    background:var(--doc-bg); color:var(--doc-fg);
    box-shadow:0 2px 20px rgba(0,0,0,.18);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .chapter { margin:0; }
  .chapter h2 {
    font-family:'Plus Jakarta Sans',sans-serif; color:var(--doc-primary); font-size:23px; line-height:1.15;
    margin:0 0 13px; letter-spacing:0; break-after:avoid; page-break-after:avoid;
  }
  .chapter h3 { font-family:'Plus Jakarta Sans',sans-serif; font-size:15.5px; margin:18px 0 8px; break-after:avoid; page-break-after:avoid; }
  .chapter p { font-size:12.8px; line-height:1.58; margin:0 0 8px; orphans:3; widows:3; }
  .chapter strong { color:var(--doc-primary); font-weight:700; }
  .chapter a { color:var(--doc-accent); }
  .chapter ul, .chapter ol { padding:0; margin:0 0 12px; }
  .chapter li { break-inside:avoid; page-break-inside:avoid; }
  .chapter ul li {
    list-style:none; position:relative; padding:7px 10px 7px 27px; margin:4px 0; border-radius:8px;
    background:var(--doc-surface); font-size:12.7px; line-height:1.48;
  }
  .chapter ul li::before { content:''; position:absolute; left:10px; top:14px; width:6px; height:6px; border-radius:50%; background:var(--doc-primary); }
  .chapter ol:not(.steps) { counter-reset:item; }
  .chapter ol:not(.steps) li {
    list-style:none; counter-increment:item; position:relative; padding:8px 10px 8px 39px; margin:5px 0;
    border-radius:9px; background:var(--doc-surface-2); font-size:12.7px; line-height:1.48;
  }
  .chapter ol:not(.steps) li::before {
    content:counter(item); position:absolute; left:9px; top:8px; width:21px; height:21px; border-radius:6px;
    background:var(--doc-primary); color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  blockquote, .callout {
    background:var(--doc-surface); border-left:4px solid var(--doc-accent); border-radius:0 10px 10px 0;
    padding:10px 13px; margin:12px 0; break-inside:avoid; page-break-inside:avoid;
  }
  .callout { color:var(--doc-fg); font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; line-height:1.55; }
  .callout > strong { display:block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; color:var(--doc-accent); }
  .callout p { margin:0; color:var(--doc-fg); }
  .callout p strong, .callout p em, .callout p b { display:inline; font-size:inherit; text-transform:none; letter-spacing:normal; color:inherit; }
  .callout-tip { background:rgba(46,91,255,0.10); border-color:var(--doc-primary); }
  .callout-tip > strong { color:var(--doc-primary); }
  .callout-info { background:rgba(124,58,237,0.10); border-color:var(--doc-accent); }
  .callout-quote { background:rgba(100,100,160,0.10); border-color:var(--doc-accent); font-style:italic; }
  table { width:100%; border-collapse:collapse; margin:12px 0; font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; break-inside:avoid; page-break-inside:avoid; }
  th { background:var(--doc-primary); color:#fff; text-align:left; padding:8px 10px; }
  td { padding:8px 10px; border-top:1px solid var(--doc-border); }
  tbody tr:nth-child(even) td { background:var(--doc-surface-2); }
  .feature-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:12px 0; break-inside:avoid; page-break-inside:avoid; }
  .feature-grid.cols-3 { grid-template-columns:repeat(3,1fr); }
  .feature-item { break-inside:avoid; page-break-inside:avoid; border:1px solid var(--doc-border); border-radius:12px; background:var(--doc-surface-2); padding:12px; }
  .feature-icon { width:30px; height:30px; border-radius:50%; background:var(--doc-primary); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-size:0; }
  .feature-icon::before { content:'✓'; font-size:15px; font-weight:800; line-height:1; }
  .feature-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:800; margin:5px 0 2px; }
  .feature-desc { font-size:11.5px; line-height:1.45; color:var(--doc-muted); margin:0; }
  .steps { list-style:none; counter-reset:step; padding:0; margin:10px 0 12px; }
  .steps li { list-style:none; counter-increment:step; position:relative; display:block; padding:8px 10px 8px 38px; margin:5px 0; border-radius:9px; background:var(--doc-surface-2); font-size:12.6px; line-height:1.46; color:var(--doc-fg); min-height:34px; }
  .steps li::before { content:counter(step); position:absolute; left:9px; top:50%; transform:translateY(-50%); width:21px; height:21px; border-radius:999px; background:var(--doc-primary); color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .numbered-card { display:flex; margin:9px 0; border-radius:10px; overflow:hidden; background:var(--doc-surface-2); break-inside:avoid; page-break-inside:avoid; }
  .numbered-card .n { flex:0 0 46px; background:var(--doc-primary); color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:20px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .numbered-card .body { padding:10px 12px; }
  .image-card { margin:10px 0 12px; border-radius:12px; overflow:hidden; background:var(--doc-surface-2); border:1px solid var(--doc-border); break-inside:avoid; page-break-inside:avoid; }
  .image-card img { display:block; width:100%; aspect-ratio:21/7; object-fit:cover; }
  .image-card[data-size="natural"] img { aspect-ratio:auto; height:auto; max-height:280px; object-fit:contain; }
  .image-card[data-size="wide"] img { aspect-ratio:16/9; object-fit:cover; }
  .image-card[data-size="banner"] img { aspect-ratio:2/1; object-fit:cover; }
  .image-card[data-size="square"] img { aspect-ratio:1/1; width:58%; margin:0 auto; }
  .image-card[data-size="tall"] img { aspect-ratio:3/4; width:52%; margin:0 auto; }
  .image-card[data-size="portrait"] img { aspect-ratio:9/16; width:40%; margin:0 auto; }
  .chapter button, .chapter .image-edit-btn, .chapter .eb-regen-btn { display:none !important; }
  .image-visual { position:relative; width:100%; aspect-ratio:21/7; background:linear-gradient(135deg,var(--doc-primary),var(--doc-accent)); display:flex; align-items:flex-end; padding:16px; color:#fff; overflow:hidden; }
  .image-visual::before { content:''; position:absolute; inset:0; background:linear-gradient(120deg,rgba(255,255,255,.20) 0 18%,transparent 18% 31%,rgba(255,255,255,.13) 31% 44%,transparent 44% 100%); }
  .image-visual span { position:relative; z-index:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
  figcaption { padding:7px 10px 9px; font-family:'Plus Jakarta Sans',sans-serif; font-size:9.5px; line-height:1.35; color:var(--doc-muted); text-transform:uppercase; letter-spacing:.08em; }
  .empty { min-height:70vh; display:grid; place-items:center; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; }
  .json-export { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; white-space: pre-wrap; }
  @page { size:A4; margin:14mm 16mm; }
  @page:first { size:A4; margin:0; }
  @media print {
    html, body { background:var(--doc-bg) !important; }
    .toolbar { display:none !important; }
    .page-shell { background:var(--doc-bg) !important; padding:0 !important; }
    .cover { width:210mm; height:297mm; margin:0; box-shadow:none; }
    .chapter-page {
      width:auto !important; min-height:0 !important;
      margin:0 !important; padding:0 !important; box-shadow:none !important;
      overflow:visible !important;
      break-before:auto !important; page-break-before:auto !important;
      break-after:auto !important; page-break-after:auto !important;
      background:transparent !important;
    }
    .cover + .chapter-page { break-before:auto !important; page-break-before:auto !important; }
    .chapter-page + .chapter-page { margin-top:0 !important; }
    .chapter-page:last-child { break-after:auto !important; page-break-after:auto !important; }
    .chapter h2 { margin-top:0; }
    .image-card img { max-height:64mm; object-fit:contain; background:var(--doc-surface); }
    .image-card { break-inside:avoid !important; page-break-inside:avoid !important; }
    .feature-grid, table { break-inside:auto !important; page-break-inside:auto !important; }
  }
</style>
</head>
<body>
<header class="toolbar">
  <div>
    <strong id="toolbar-title">Vista PDF</strong>
    <div class="hint">Usa <strong>Descargar PDF directo</strong> para evitar que Chrome reorganice las paginas. La impresion del navegador queda solo como respaldo.</div>
  </div>
  <div class="actions">
    <a id="back-link" class="btn ghost" href="./ebook-builder.html"><span class="material-symbols-outlined" style="font-size:16px">arrow_back</span>Volver al editor</a>
    <button id="server-pdf-btn" class="btn primary" type="button"><span class="material-symbols-outlined" style="font-size:16px">picture_as_pdf</span>Descargar PDF directo</button>
    <button id="print-btn" class="btn primary" type="button"><span class="material-symbols-outlined" style="font-size:16px">print</span>Imprimir navegador (respaldo)</button>
  </div>
</header>
<main id="root" class="page-shell"><div class="empty">Cargando ebook...</div></main>
<pre id="ebook-json" class="json-export"></pre>
<script src="./app.js?v=gamma-plus-2"></script>
<script src="./supabase-config.js?v=20260423n"></script>
<script src="./skinglow-demo-data.js?v=20260518"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const useDraftSnapshot = params.get('draft') === '1';
  const root = document.getElementById('root');
  const back = document.getElementById('back-link');
  let currentBook = null;
  if (id) back.href = './ebook-builder.html?id=' + encodeURIComponent(id);

  const escapeHtml = (s) => (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isSupabaseUuid = (value) =>
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ''));
  const stripLegacyTitle = (title) => (title || '').replace(/^cap[ií]tulo\s+\d+\s*[:\\-–—]?\\s*/i, '').trim();
  if (window.marked?.setOptions) marked.setOptions({ gfm:true, breaks:false });
  const smartIcons = ['check','insights','paid','savings','schedule','analytics','target','article'];
  function normalizeInlineHeadings(md = '') {
    return String(md)
      .replace(/(^|\n)([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ0-9, ]{10,72}?)(\s+(Para|Una vez|Al |Esto |Recuerda|Calcula|Identifica|Registra|Establece)\b)/g, '$1### $2\n\n$4')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }
  function upgradeBlock(block) {
    const lines = block.split('\n').filter(line => line.trim());
    if (!lines.length || /^<[a-z]/i.test(lines[0].trim())) return block;
    const boldBullet = /^[-*\u2022]\s+\*\*(.+?)\*\*(?:\s*[-:–—]\s*(.+))?$/;
    const boldItems = [];
    for (const line of lines) {
      const match = line.trim().match(boldBullet);
      if (match) boldItems.push({ title: match[1], desc: match[2] || '' });
    }
    if (boldItems.length >= 3) {
      const cls = boldItems.length >= 5 ? 'feature-grid cols-3' : 'feature-grid';
      return `<div class="${cls}">${boldItems.map((item, i) => `<div class="feature-item"><div class="feature-icon">${smartIcons[i % smartIcons.length]}</div><h4 class="feature-title">${item.title}</h4>${item.desc ? `<p class="feature-desc">${item.desc}</p>` : ''}</div>`).join('')}</div>`;
    }
    const simpleBullets = lines.filter(line => /^[-*\u2022]\s+/.test(line.trim())).map(line => line.trim().replace(/^[-*\u2022]\s+/, '').trim()).filter(Boolean);
    if (false && simpleBullets.length >= 3 && simpleBullets.length <= 6 && simpleBullets.length === lines.length) {
      const cls = simpleBullets.length >= 5 ? 'feature-grid cols-3' : 'feature-grid';
      return `<div class="${cls}">${simpleBullets.map((text, i) => {
        const parts = text.split(/\s+[-:–—]\s+/);
        const title = parts[0] || text;
        const desc = parts.slice(1).join(' - ') || text;
        return `<div class="feature-item"><div class="feature-icon">${smartIcons[i % smartIcons.length]}</div><h4 class="feature-title">${escapeHtml(title)}</h4><p class="feature-desc">${escapeHtml(desc)}</p></div>`;
      }).join('')}</div>`;
    }
    const numbered = lines.filter(line => /^\d+[.)]\s+/.test(line.trim()));
    if (numbered.length >= 3 && numbered.length === lines.length) {
      return `<ol class="steps">${numbered.map(line => `<li>${escapeHtml(line.trim().replace(/^\d+[.)]\s+/, ''))}</li>`).join('')}</ol>`;
    }
    if (lines.every(line => /^>\s?/.test(line.trim()))) {
      const text = lines.map(line => line.replace(/^>\s?/, '')).join(' ').trim();
      return `<div class="callout callout-info"><strong>Nota</strong><p>${escapeHtml(text)}</p></div>`;
    }
    return block;
  }

  function inlineMarkdown(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }

  function fallbackMarkdown(md = '') {
    return String(md).split(/\n\n+/).map(block => {
      const trimmed = block.trim();
      if (!trimmed) return '';
      if (/^<[a-z]/i.test(trimmed)) return trimmed;
      if (/^###\s+/.test(trimmed)) return `<h3>${inlineMarkdown(trimmed.replace(/^###\s+/, ''))}</h3>`;
      if (/^##\s+/.test(trimmed)) return `<h2>${inlineMarkdown(trimmed.replace(/^##\s+/, ''))}</h2>`;
      if (/^[-*\u2022]\s+/m.test(trimmed)) {
        const items = trimmed.split('\n').filter(Boolean).map(line => `<li>${inlineMarkdown(line.replace(/^[-*\u2022]\s+/, '').trim())}</li>`).join('');
        return `<ul>${items}</ul>`;
      }
      if (/^\|.+\|$/m.test(trimmed)) {
        const rows = trimmed.split('\n').filter(line => /^\|.+\|$/.test(line.trim())).map(line => line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim()));
        const [head, sep, ...body] = rows;
        const header = head ? `<thead><tr>${head.map(cell => `<th>${inlineMarkdown(cell)}</th>`).join('')}</tr></thead>` : '';
        const bodyRows = (sep && /^-+$/.test((sep[0] || '').replace(/:/g, ''))) ? body : rows.slice(1);
        return `<table>${header}<tbody>${bodyRows.map(row => `<tr>${row.map(cell => `<td>${inlineMarkdown(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      }
      return `<p>${inlineMarkdown(trimmed).replace(/\n/g, '<br>')}</p>`;
    }).join('\n');
  }

  async function loadEbook() {
    let row = null;
    if (id && useDraftSnapshot) {
      try {
        const snapshot = JSON.parse(localStorage.getItem(`ls_ebook_print_snapshot_${id}`) || 'null');
        if (snapshot?.id === id && Array.isArray(snapshot.chapters)) row = snapshot;
      } catch {}
    }
    if (!row && id) row = Ebooks.get(id);
    if (!row && id === 'skinglow-ebook' && typeof seedSkinGlowDemo === 'function') {
      try {
        const seeded = seedSkinGlowDemo({ setAnswers: true });
        if (seeded?.ebook) row = seeded.ebook;
      } catch {}
    }
    if (!row && id && isSupabaseUuid(id)) {
      try { row = await DB.ebooks.get(id); } catch {}
    }
    if (!row && id) row = Ebooks.get(id);
    if (!row && id === 'skinglow-ebook' && window.SKINGLOW_EBOOK) row = window.SKINGLOW_EBOOK;
    return row;
  }

  function renderMarkdown(md) {
    const cleaned = normalizeInlineHeadings(md || '')
      .replace(/P[ÁA]GINA\s+\d+\s*[-–—]\s*[^\n]*?\btext\b/gi, '')
      .replace(/^\s*text\s*$/gim, '')
      .replace(/\[Fecha\s+actual\]/gi, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
    const upgraded = cleaned.split(/\n\n+/).map(upgradeBlock).join('\n\n');
    return window.marked?.parse ? marked.parse(upgraded || '') : fallbackMarkdown(upgraded || '');
  }

  function inferTheme(row) {
    const text = [
      row?.title, row?.topic, row?.brief, row?.cover?.subtitle,
      ...(row?.chapters || []).slice(0, 3).flatMap(ch => [ch?.title, ch?.body_md]),
    ].filter(Boolean).join(' ').toLowerCase();
    if (/finanz|dinero|ahorro|deuda|presupuesto|invers|wealth|money/.test(text)) return 'finance';
    if (/espirit|bibl|fe\b|dios|oraci|devocional|cristi|comuni[oó]n/.test(text)) return 'spiritual';
    return 'light';
  }

  function normalizeEbook(row) {
    const storedTheme = row.cover?.theme || row.settings?.theme || row.theme || '';
    const inferredTheme = inferTheme(row);
    return {
      id: row.id,
      title: row.title || 'Mi ebook',
      theme: (!storedTheme || storedTheme === 'light') && inferredTheme !== 'light' ? inferredTheme : (storedTheme || inferredTheme),
      cover: row.cover || {},
      chapters: Array.isArray(row.chapters) ? row.chapters : [],
    };
  }

  function render(book) {
    currentBook = book;
    document.title = (book.title || 'Ebook') + ' · PDF';
    document.getElementById('toolbar-title').textContent = book.title || 'Vista PDF';
    document.body.className = 'theme-' + (book.theme || 'light');
    document.getElementById('ebook-json').textContent = JSON.stringify(book);
    const cover = book.cover || {};
    const coverImage = cover.imageUrl || '';
    const subtitle = cover.subtitle || '';
    const coverHtml = `
      <section class="cover${coverImage ? ' has-image' : ''}">
        <div>
          <h1>${escapeHtml(book.title || 'Mi ebook')}</h1>
          ${subtitle ? `<p class="subtitle">${escapeHtml(subtitle)}</p>` : ''}
        </div>
        <div class="cover-media"${cover.imageSize ? ` data-size="${escapeHtml(cover.imageSize)}"` : ''}>
          ${coverImage ? `<img src="${escapeHtml(coverImage)}" alt="${escapeHtml(book.title || 'Portada')}" crossorigin="anonymous" referrerpolicy="no-referrer">` : `<div class="cover-visual"><span>${escapeHtml(book.title || 'Visual editorial')}</span></div>`}
        </div>
      </section>`;
    const chaptersHtml = book.chapters.map((chapter, index) => `
      <div class="chapter-page">
        <section class="chapter">
          <h2>${escapeHtml(stripLegacyTitle(chapter.title) || `Seccion ${index + 1}`)}</h2>
          ${renderMarkdown(chapter.body_md || '')}
        </section>
      </div>
    `).join('');
    root.innerHTML = coverHtml + chaptersHtml;
  }

  try {
    const row = await loadEbook();
    if (!row) {
      root.innerHTML = '<div class="empty">No encontré este ebook. Vuelve al editor y prueba otra vez.</div>';
      return;
    }
    render(normalizeEbook(row));
  } catch (err) {
    console.error(err);
    root.innerHTML = '<div class="empty">No pude cargar el ebook.</div>';
  }

  function pdfFileName(title) {
    const clean = (title || 'ebook').replace(/[\\/:*?"<>|]+/g, '').trim() || 'ebook';
    return `${clean}.pdf`;
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2500);
  }

  async function downloadServerPdf() {
    if (!currentBook) throw new Error('El ebook todavia no esta cargado.');
    const response = await fetch('/api/generate-ebook-pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ebook: currentBook }),
    });
    if (!response.ok) {
      let detail = '';
      try {
        const data = await response.json();
        detail = data?.error || data?.message || '';
      } catch {}
      throw new Error(detail || 'No pude generar el PDF directo.');
    }
    const blob = await response.blob();
    if (!blob || blob.size < 1024) throw new Error('El PDF llego vacio.');
    downloadBlob(blob, pdfFileName(currentBook.title));
  }

  document.getElementById('print-btn').addEventListener('click', () => window.print());
  document.getElementById('server-pdf-btn')?.addEventListener('click', async (event) => {
    const button = event.currentTarget;
    const original = button.innerHTML;
    button.disabled = true;
    button.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">hourglass_empty</span>Generando...';
    try {
      await downloadServerPdf();
    } catch (err) {
      console.warn('[ebook-print] server PDF failed, opening browser print fallback', err);
      alert('No pude generar el PDF directo. Se abrira la impresion del navegador como respaldo.');
      window.print();
    } finally {
      button.disabled = false;
      button.innerHTML = original;
    }
  });
})();
</script>
</body>
</html>
